name: Bug report
description: Report a reproducible game or system defect
title: '[Bug]: '
body:
  - type: dropdown
    id: system
    attributes:
      label: System
      description: Choose the owning system when known.
      options:
        - World
        - Terrain
        - Water
        - Roads
        - Zoning
        - Buildings
        - Simulation Time
        - RCI Demand & Occupancy
        - Economy
        - Cross-system / Unknown
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What did you observe?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest repeatable sequence.
    validations:
      required: true

  - type: textarea
    id: state
    attributes:
      label: Save, game time, and environment
      description: >-
        Include save version/state, in-game date/time, browser, Node/pnpm, or other
        relevant context.

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, console output, or evidence
