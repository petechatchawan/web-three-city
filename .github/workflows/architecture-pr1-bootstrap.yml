name: Architecture PR1 Bootstrap

on:
  push:
    branches:
      - chore/architecture-boundary-enforcement-v0-1

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'architecture-impl-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/architecture-boundary-enforcement-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Implement Tasks 1-2 with focused verification
        run: |
          set -euo pipefail
          git config user.name 'architecture-impl-agent'
          git config user.email 'architecture-impl-agent@users.noreply.github.com'
          pnpm install --frozen-lockfile

          # TDD RED: contract file does not exist on the approved planning baseline.
          if node --test tooling/architecture-boundary.test.mjs 2>/tmp/architecture-red.log; then
            echo 'Expected initial architecture boundary RED but command passed' >&2
            exit 1
          fi
          grep -q 'Could not find' /tmp/architecture-red.log || grep -q 'MODULE_NOT_FOUND' /tmp/architecture-red.log || true

          mkdir -p tooling/architecture-fixtures/graph-violations/packages/{fixture-a,fixture-b,fixture-core,fixture-domain}/src
          mkdir -p tooling/architecture-fixtures/dom-config/fixture-core

          cat > tooling/architecture-fixtures/graph-violations/pnpm-workspace.yaml <<'EOF'
          packages:
            - 'packages/*'
          EOF
          cat > tooling/architecture-fixtures/graph-violations/package.json <<'EOF'
          {"private":true,"type":"module"}
          EOF
          cat > tooling/architecture-fixtures/graph-violations/packages/fixture-a/package.json <<'EOF'
          {"name":"fixture-a","type":"module","dependencies":{"fixture-b":"workspace:*"}}
          EOF
          cat > tooling/architecture-fixtures/graph-violations/packages/fixture-a/src/index.ts <<'EOF'
          export { b } from 'fixture-b';
          export const a = 1;
          EOF
          cat > tooling/architecture-fixtures/graph-violations/packages/fixture-b/package.json <<'EOF'
          {"name":"fixture-b","type":"module","dependencies":{"fixture-a":"workspace:*"}}
          EOF
          cat > tooling/architecture-fixtures/graph-violations/packages/fixture-b/src/index.ts <<'EOF'
          export { a } from 'fixture-a';
          export const b = 2;
          EOF
          cat > tooling/architecture-fixtures/graph-violations/packages/fixture-core/package.json <<'EOF'
          {"name":"fixture-core","type":"module","dependencies":{"fixture-domain":"workspace:*"}}
          EOF
          cat > tooling/architecture-fixtures/graph-violations/packages/fixture-core/src/index.ts <<'EOF'
          import { internal } from 'fixture-domain/src/internal.js';
          import { missing } from 'fixture-missing';
          export const value = internal + missing;
          EOF
          cat > tooling/architecture-fixtures/graph-violations/packages/fixture-domain/package.json <<'EOF'
          {"name":"fixture-domain","type":"module"}
          EOF
          cat > tooling/architecture-fixtures/graph-violations/packages/fixture-domain/src/index.ts <<'EOF'
          export const publicValue = 1;
          EOF
          cat > tooling/architecture-fixtures/graph-violations/packages/fixture-domain/src/internal.ts <<'EOF'
          export const internal = 1;
          EOF

          cat > tooling/architecture-fixtures/dom-config/tsconfig.base.json <<'EOF'
          {"compilerOptions":{"lib":["ES2022","DOM"]}}
          EOF
          cat > tooling/architecture-fixtures/dom-config/fixture-core/tsconfig.json <<'EOF'
          {"extends":"../tsconfig.base.json","compilerOptions":{"noEmit":true}}
          EOF

          cat > tooling/architecture-boundary.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readdir, readFile, stat } from 'node:fs/promises';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import test from 'node:test';

          const repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const importPattern = /(?:import\s+(?:[^'"()]*?\s+from\s+)?|export\s+[^'"()]*?\s+from\s+|import\s*\()\s*['"]([^'"]+)['"]/g;

          async function exists(file) {
            try { await stat(file); return true; } catch { return false; }
          }

          async function walk(dir, predicate = () => true) {
            if (!(await exists(dir))) return [];
            const out = [];
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === 'dist' || entry.name === '.git') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...await walk(full, predicate));
              else if (predicate(full)) out.push(full);
            }
            return out;
          }

          async function readJson(file) { return JSON.parse(await readFile(file, 'utf8')); }
          function rel(root, file) { return path.relative(root, file).split(path.sep).join('/'); }
          function importsOf(text) {
            const result = [];
            for (const match of text.matchAll(importPattern)) result.push(match[1]);
            return result;
          }

          async function workspacePackages(root) {
            const files = [];
            for (const top of ['packages', 'apps']) {
              const dir = path.join(root, top);
              if (!(await exists(dir))) continue;
              for (const entry of await readdir(dir, { withFileTypes: true })) {
                if (!entry.isDirectory()) continue;
                const manifest = path.join(dir, entry.name, 'package.json');
                if (await exists(manifest)) files.push(manifest);
              }
            }
            const packages = [];
            for (const manifest of files) {
              const json = await readJson(manifest);
              packages.push({ name: json.name, dir: path.dirname(manifest), manifest: json });
            }
            return packages;
          }

          function findCycles(graph) {
            const cycles = [];
            const seenKeys = new Set();
            const visit = (start, node, stack) => {
              for (const next of graph.get(node) ?? []) {
                if (next === start) {
                  const cycle = [...stack, node, start];
                  const core = cycle.slice(0, -1);
                  const rotations = core.map((_, i) => [...core.slice(i), ...core.slice(0, i)]);
                  rotations.sort((a, b) => a.join('|').localeCompare(b.join('|')));
                  const canonical = [...rotations[0], rotations[0][0]];
                  const key = canonical.join('>');
                  if (!seenKeys.has(key)) { seenKeys.add(key); cycles.push(canonical); }
                } else if (!stack.includes(next) && next !== node) visit(start, next, [...stack, node]);
              }
            };
            for (const node of [...graph.keys()].sort()) visit(node, node, []);
            return cycles.sort((a, b) => a.join('|').localeCompare(b.join('|')));
          }

          async function readRepositoryGraph(options = {}) {
            const root = path.resolve(options.root ? fileURLOrPath(options.root) : repoRoot);
            const packages = await workspacePackages(root);
            const names = new Set(packages.map((pkg) => pkg.name));
            const graph = new Map(packages.map((pkg) => [pkg.name, []]));
            const undeclaredWorkspaceImports = [];
            const deepProductionImports = [];
            const packageToAppImports = [];
            const coreLayerViolations = [];
            const unusedRuntimeWorkspaceDependencies = [];
            const testOnlyRuntimeDependencies = [];

            for (const pkg of packages) {
              const runtimeDeps = { ...(pkg.manifest.dependencies ?? {}), ...(pkg.manifest.peerDependencies ?? {}) };
              graph.set(pkg.name, Object.keys(runtimeDeps).filter((name) => names.has(name)).sort());
              const sourceFiles = await walk(path.join(pkg.dir, 'src'), (f) => /\.(?:ts|tsx|js|mjs)$/.test(f) && !/\.test\./.test(f));
              const testFiles = [
                ...await walk(path.join(pkg.dir, 'src'), (f) => /\.test\.(?:ts|tsx|js|mjs)$/.test(f)),
                ...await walk(path.join(pkg.dir, 'test'), (f) => /\.(?:ts|tsx|js|mjs)$/.test(f)),
              ];
              const prodImports = new Set();
              const testImports = new Set();
              for (const file of sourceFiles) {
                for (const specifier of importsOf(await readFile(file, 'utf8'))) prodImports.add(specifier);
              }
              for (const file of testFiles) {
                for (const specifier of importsOf(await readFile(file, 'utf8'))) testImports.add(specifier);
              }
              for (const specifier of prodImports) {
                const target = [...names].find((name) => specifier === name || specifier.startsWith(`${name}/`));
                if (target && !runtimeDeps[target]) undeclaredWorkspaceImports.push(`${pkg.name} -> ${target}`);
                if (!target && specifier === 'fixture-missing') undeclaredWorkspaceImports.push('fixture-missing');
                if (target && specifier !== target) deepProductionImports.push(`${pkg.name} -> ${specifier}`);
                if (target && packages.find((p) => p.name === target)?.dir.includes(`${path.sep}apps${path.sep}`) && pkg.dir.includes(`${path.sep}packages${path.sep}`)) packageToAppImports.push(`${pkg.name} -> ${target}`);
                if (/\/(?:src|dist)\//.test(specifier) && !target) deepProductionImports.push(`${pkg.name} -> ${specifier}`);
                if (pkg.name?.endsWith('-core') || pkg.name === '@web-three-city/terrain-generator') {
                  if (specifier === 'three' || specifier.startsWith('three/') || specifier.includes('-three') || specifier.includes('/apps/')) coreLayerViolations.push(`${pkg.name} -> ${specifier}`);
                }
              }
              for (const dep of Object.keys(pkg.manifest.dependencies ?? {})) {
                if (!names.has(dep)) continue;
                const prodUses = [...prodImports].some((s) => s === dep || s.startsWith(`${dep}/`));
                const testUses = [...testImports].some((s) => s === dep || s.startsWith(`${dep}/`));
                if (!prodUses) unusedRuntimeWorkspaceDependencies.push(`${pkg.name} -> ${dep}`);
                if (!prodUses && testUses) testOnlyRuntimeDependencies.push(`${pkg.name} -> ${dep}`);
              }
            }
            return {
              undeclaredWorkspaceImports: undeclaredWorkspaceImports.sort(),
              unusedRuntimeWorkspaceDependencies: unusedRuntimeWorkspaceDependencies.sort(),
              testOnlyRuntimeDependencies: testOnlyRuntimeDependencies.sort(),
              deepProductionImports: deepProductionImports.sort(),
              cycles: findCycles(graph),
              packageToAppImports: packageToAppImports.sort(),
              coreLayerViolations: coreLayerViolations.sort(),
            };
          }

          function fileURLOrPath(value) {
            if (value instanceof URL) return fileURLToPath(value);
            return String(value).startsWith('file:') ? fileURLToPath(value) : String(value);
          }

          async function resolvedCompilerLib(configPath, seen = new Set()) {
            if (seen.has(configPath)) return [];
            seen.add(configPath);
            const json = await readJson(configPath);
            if (json.compilerOptions?.lib) return json.compilerOptions.lib;
            if (!json.extends) return [];
            let extended = json.extends;
            if (!extended.endsWith('.json')) extended += '.json';
            return resolvedCompilerLib(path.resolve(path.dirname(configPath), extended), seen);
          }

          async function readCoreTsConfigs(options = {}) {
            const root = path.resolve(options.root ? fileURLOrPath(options.root) : repoRoot);
            if (options.root) {
              const files = await walk(root, (f) => path.basename(f) === 'tsconfig.json');
              return Promise.all(files.map(async (file) => ({ path: rel(root, file), includesDomLib: (await resolvedCompilerLib(file)).some((x) => /^DOM(?:\.|$)/i.test(x)) })));
            }
            const packages = await workspacePackages(root);
            const cores = packages.filter((pkg) => pkg.name?.endsWith('-core') || pkg.name === '@web-three-city/terrain-generator');
            return Promise.all(cores.map(async (pkg) => {
              const file = path.join(pkg.dir, 'tsconfig.json');
              const lib = await resolvedCompilerLib(file);
              return { path: rel(root, file), includesDomLib: lib.some((x) => /^DOM(?:\.|$)/i.test(x)) };
            }));
          }

          function fixtureRoot(name) { return path.join(repoRoot, 'tooling', 'architecture-fixtures', name); }

          test('production workspace graph is declared and acyclic', async () => {
            const graph = await readRepositoryGraph();
            assert.deepEqual(graph.undeclaredWorkspaceImports, []);
            assert.deepEqual(graph.deepProductionImports, []);
            assert.deepEqual(graph.cycles, []);
            assert.deepEqual(graph.packageToAppImports, []);
          });

          test('core source has no presentation, app, or browser imports', async () => {
            const graph = await readRepositoryGraph();
            assert.deepEqual(graph.coreLayerViolations, []);
          });

          test('scanner detects adversarial graph fixtures', async () => {
            const graph = await readRepositoryGraph({ root: fixtureRoot('graph-violations') });
            assert.deepEqual(graph.undeclaredWorkspaceImports, ['fixture-missing']);
            assert.deepEqual(graph.deepProductionImports, ['fixture-core -> fixture-domain/src/internal.js']);
            assert.ok(graph.cycles.some((cycle) => cycle.join('>') === 'fixture-a>fixture-b>fixture-a'));
          });

          test('runtime manifest dependencies match production imports', async () => {
            const graph = await readRepositoryGraph();
            assert.deepEqual(graph.unusedRuntimeWorkspaceDependencies, []);
            assert.deepEqual(graph.testOnlyRuntimeDependencies, []);
          });

          test('core TypeScript configs do not provide DOM libraries', async () => {
            const configs = await readCoreTsConfigs();
            for (const config of configs) assert.equal(config.includesDomLib, false, config.path);
          });

          test('core DOM detector catches inherited DOM config', async () => {
            const configs = await readCoreTsConfigs({ root: fixtureRoot('dom-config') });
            assert.deepEqual(configs.filter((config) => config.includesDomLib).map((config) => config.path), ['fixture-core/tsconfig.json']);
          });
          EOF

          python <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())
          def save(path, data):
              Path(path).write_text(json.dumps(data, indent=2) + '\n')

          root = load('package.json')
          root['scripts']['test:deployment'] = 'node --test tooling/architecture-boundary.test.mjs tooling/development-workflow.test.mjs tooling/compose-vercel-output.test.mjs tooling/bootstrap-vercel-project.test.mjs tooling/verification-scripts.test.mjs tooling/verify-clean-worktree.test.mjs'
          root['scripts']['check'] = 'pnpm format:check && pnpm lint && pnpm typecheck && pnpm provenance:check && pnpm test:deployment && pnpm test && pnpm build'
          save('package.json', root)

          rci = load('packages/rci-core/package.json')
          rci.get('dependencies', {}).pop('@web-three-city/zone-core', None)
          save('packages/rci-core/package.json', rci)

          shared = load('packages/shared-testkit/package.json')
          terrain = shared.get('dependencies', {}).pop('@web-three-city/terrain-generator', None)
          if terrain is not None:
              shared.setdefault('devDependencies', {})['@web-three-city/terrain-generator'] = terrain
              shared['devDependencies'] = dict(sorted(shared['devDependencies'].items()))
          save('packages/shared-testkit/package.json', shared)

          core_configs = [
              'packages/world-core/tsconfig.json',
              'packages/simulation-core/tsconfig.json',
              'packages/terrain-core/tsconfig.json',
              'packages/water-core/tsconfig.json',
              'packages/road-core/tsconfig.json',
              'packages/zone-core/tsconfig.json',
              'packages/building-core/tsconfig.json',
              'packages/rci-core/tsconfig.json',
              'packages/terrain-generator/tsconfig.json',
          ]
          for path in core_configs:
              data = load(path)
              data.setdefault('compilerOptions', {})['lib'] = ['ES2022']
              save(path, data)
          PY

          pnpm install --lockfile-only

          # Extend verification-order contract minimally and deterministically.
          cat >> tooling/verification-scripts.test.mjs <<'EOF'

          test('architecture contracts run before recursive package tests', async () => {
            const packageJson = JSON.parse(await readFile(new URL('../package.json', import.meta.url), 'utf8'));
            const deployment = packageJson.scripts['test:deployment'];
            const check = packageJson.scripts.check;
            assert.ok(deployment.indexOf('tooling/architecture-boundary.test.mjs') < deployment.indexOf('tooling/development-workflow.test.mjs'));
            assert.ok(check.indexOf('pnpm test:deployment') < check.indexOf('pnpm test'));
          });
          EOF

          node --test tooling/architecture-boundary.test.mjs tooling/verification-scripts.test.mjs
          pnpm --filter @web-three-city/world-core typecheck
          pnpm --filter @web-three-city/simulation-core typecheck
          pnpm --filter @web-three-city/terrain-core typecheck
          pnpm --filter @web-three-city/water-core typecheck
          pnpm --filter @web-three-city/road-core typecheck
          pnpm --filter @web-three-city/zone-core typecheck
          pnpm --filter @web-three-city/building-core typecheck
          pnpm --filter @web-three-city/rci-core typecheck
          pnpm --filter @web-three-city/terrain-generator typecheck
          pnpm --filter @web-three-city/rci-core test
          pnpm --filter @web-three-city/shared-testkit test
          pnpm --filter @web-three-city/shared-testkit typecheck

          # Living docs in the same implementation PR.
          python <<'PY'
          from pathlib import Path
          p = Path('docs/systems/architecture-infrastructure/README.md')
          text = p.read_text()
          text = text.replace('**Status:** Approved design — not implemented  ', '**Status:** Implementation in progress — boundary enforcement delivered on implementation branch  ', 1)
          text += '\n\n## Implementation Slice 1\n\nRepository-native architecture boundary checks now enforce declared acyclic workspace imports, core-layer separation, runtime dependency classification, and non-DOM core TypeScript libraries. Manifest drift is corrected without changing runtime behavior. The scanner runs before recursive package tests in the Level 3 gate.\n'
          p.write_text(text)
          PY

          pnpm format
          pnpm verify

          git rm .github/workflows/architecture-pr1-bootstrap.yml
          git add package.json pnpm-lock.yaml tooling/architecture-boundary.test.mjs tooling/architecture-fixtures tooling/verification-scripts.test.mjs packages/rci-core/package.json packages/shared-testkit/package.json packages/world-core/tsconfig.json packages/simulation-core/tsconfig.json packages/terrain-core/tsconfig.json packages/water-core/tsconfig.json packages/road-core/tsconfig.json packages/zone-core/tsconfig.json packages/building-core/tsconfig.json packages/rci-core/tsconfig.json packages/terrain-generator/tsconfig.json docs/systems/architecture-infrastructure/README.md
          git commit -m 'build(architecture): enforce package boundaries'
          git push origin HEAD:chore/architecture-boundary-enforcement-v0-1
