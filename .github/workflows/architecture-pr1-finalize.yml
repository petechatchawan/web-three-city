name: Architecture PR1 Finalize

on:
  push:
    branches:
      - chore/architecture-boundary-enforcement-v0-1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/architecture-boundary-enforcement-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reuse corrected implementation script
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/architecture-pr1-implement.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == 'run: |') + 1
          script_lines = []
          for line in source[start:]:
              if line and not line.startswith('          '):
                  break
              script_lines.append(line[10:] if len(line) >= 10 else '')
          script = '\n'.join(script_lines) + '\n'
          script = script.replace("import { fileURLToPath } from 'node:url';", "import { fileURLToPath, URL } from 'node:url';")
          script = script.replace(
              'git rm .github/workflows/architecture-pr1-implement.yml',
              'git rm .github/workflows/architecture-pr1-implement.yml .github/workflows/architecture-pr1-finalize.yml',
          )
          Path('/tmp/architecture-pr1.sh').write_text(script)
          PY
          bash /tmp/architecture-pr1.sh
