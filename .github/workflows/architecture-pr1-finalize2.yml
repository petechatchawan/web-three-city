name: Architecture PR1 Finalize 2

on:
  push:
    branches:
      - chore/architecture-boundary-enforcement-v0-1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/architecture-boundary-enforcement-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Implement and verify final PR1 candidate
        run: |
          set -euo pipefail
          git config user.name 'architecture-impl-agent'
          git config user.email 'architecture-impl-agent@users.noreply.github.com'

          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/architecture-pr1-implement.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == 'run: |') + 1
          script_lines = []
          for line in source[start:]:
              if line and not line.startswith('          '):
                  break
              script_lines.append(line[10:] if len(line) >= 10 else '')
          script = '\n'.join(script_lines) + '\n'
          script = script.replace("import { fileURLToPath } from 'node:url';", "import { fileURLToPath, URL } from 'node:url';")

          portable = r'''
          python <<'PY2'
          from pathlib import Path
          p = Path('packages/terrain-core/src/serialization.ts')
          text = p.read_text()
          start = text.index('function bytesToBase64')
          end = text.index('\nfunction isRecord', start)
          replacement = r'''const BASE64_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

function bytesToBase64(bytes: Uint8Array): string {
  let encoded = '';
  for (let index = 0; index < bytes.length; index += 3) {
    const first = bytes[index] ?? 0;
    const hasSecond = index + 1 < bytes.length;
    const hasThird = index + 2 < bytes.length;
    const second = bytes[index + 1] ?? 0;
    const third = bytes[index + 2] ?? 0;
    const value = (first << 16) | (second << 8) | third;
    encoded += BASE64_ALPHABET[(value >>> 18) & 63];
    encoded += BASE64_ALPHABET[(value >>> 12) & 63];
    encoded += hasSecond ? BASE64_ALPHABET[(value >>> 6) & 63] : '=';
    encoded += hasThird ? BASE64_ALPHABET[value & 63] : '=';
  }
  return encoded;
}

function base64ToBytes(value: string): Uint8Array | null {
  if (
    value.length === 0 ||
    value.length % 4 !== 0 ||
    !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value)
  ) {
    return null;
  }

  const padding = value.endsWith('==') ? 2 : value.endsWith('=') ? 1 : 0;
  const bytes = new Uint8Array((value.length / 4) * 3 - padding);
  let output = 0;
  for (let index = 0; index < value.length; index += 4) {
    const first = BASE64_ALPHABET.indexOf(value[index]!);
    const second = BASE64_ALPHABET.indexOf(value[index + 1]!);
    const third = value[index + 2] === '=' ? 0 : BASE64_ALPHABET.indexOf(value[index + 2]!);
    const fourth = value[index + 3] === '=' ? 0 : BASE64_ALPHABET.indexOf(value[index + 3]!);
    const decoded = (first << 18) | (second << 12) | (third << 6) | fourth;
    if (output < bytes.length) bytes[output++] = (decoded >>> 16) & 255;
    if (output < bytes.length) bytes[output++] = (decoded >>> 8) & 255;
    if (output < bytes.length) bytes[output++] = decoded & 255;
  }
  return bytes;
}
'''
          p.write_text(text[:start] + replacement + text[end:])

          t = Path('packages/terrain-core/test/serialization.test.ts')
          text = t.read_text()
          marker = "describe('terrain serialization', () => {\n"
          test = r'''  it('preserves the canonical TerrainSaveV1 base64 wire representation without DOM codecs', () => {
    const levels = new Uint8Array(129 * 129).fill(2);
    const map = createTerrainMap({
      config: WORLD_CONFIG,
      seed: 1,
      generatorVersion: 'coastal-v1',
      generationAttempt: 0,
      revision: 0,
      heightLevels: levels,
    });

    expect(encodeTerrainSaveV1(map).heightLevels).toBe('AgIC'.repeat((129 * 129) / 3));
  });

'''
          assert marker in text
          t.write_text(text.replace(marker, marker + test, 1))
          PY2

          pnpm --filter @web-three-city/terrain-core test
          pnpm --filter @web-three-city/terrain-core typecheck
          pnpm --filter @web-three-city/terrain-core build
          '''
          script = script.replace('\npnpm format\npnpm verify\n', '\n' + portable + '\npnpm format\npnpm verify\n', 1)
          script = script.replace(
              'git rm .github/workflows/architecture-pr1-implement.yml',
              'git rm .github/workflows/architecture-pr1-implement.yml .github/workflows/architecture-pr1-finalize.yml .github/workflows/architecture-pr1-finalize2.yml',
              1,
          )
          script = script.replace(
              'git add package.json',
              'git add packages/terrain-core/src/serialization.ts packages/terrain-core/test/serialization.test.ts package.json',
              1,
          )
          Path('/tmp/architecture-pr1.sh').write_text(script)
          PY

          bash /tmp/architecture-pr1.sh
