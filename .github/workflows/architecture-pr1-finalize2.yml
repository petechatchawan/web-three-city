name: Architecture PR1 Finalize 2

on:
  push:
    branches:
      - chore/architecture-boundary-enforcement-v0-1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/architecture-boundary-enforcement-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Implement and verify final PR1 candidate
        env:
          TERRAIN_SERIALIZATION_B64:  bicgfSk7CiAgfQp9Cg==
          TERRAIN_SERIALIZATION_TEST_B64: 
        run: |
          set -euo pipefail
          git config user.name 'architecture-impl-agent'
          git config user.email 'architecture-impl-agent@users.noreply.github.com'
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/architecture-pr1-implement.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == 'run: |') + 1
          script_lines = []
          for line in source[start:]:
              if line and not line.startswith('          '):
                  break
              script_lines.append(line[10:] if len(line) >= 10 else '')
          script = '\n'.join(script_lines) + '\n'
          script = script.replace("import { fileURLToPath } from 'node:url';", "import { fileURLToPath, URL } from 'node:url';")
          portable = """
echo \"$TERRAIN_SERIALIZATION_B64\" | base64 -d > packages/terrain-core/src/serialization.ts
echo \"$TERRAIN_SERIALIZATION_TEST_B64\" | base64 -d > packages/terrain-core/test/serialization.test.ts
pnpm --filter @web-three-city/terrain-core test
pnpm --filter @web-three-city/terrain-core typecheck
pnpm --filter @web-three-city/terrain-core build
"""
          script = script.replace('\npnpm format\npnpm verify\n', '\n' + portable + '\npnpm format\npnpm verify\n', 1)
          script = script.replace('git rm .github/workflows/architecture-pr1-implement.yml', 'git rm .github/workflows/architecture-pr1-implement.yml .github/workflows/architecture-pr1-finalize.yml .github/workflows/architecture-pr1-finalize2.yml', 1)
          script = script.replace('git add package.json', 'git add packages/terrain-core/src/serialization.ts packages/terrain-core/test/serialization.test.ts package.json', 1)
          Path('/tmp/architecture-pr1.sh').write_text(script)
          PY
          bash /tmp/architecture-pr1.sh
