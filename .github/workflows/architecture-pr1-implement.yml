name: Architecture PR1 Implement

on:
  push:
    branches:
      - chore/architecture-boundary-enforcement-v0-1

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'architecture-impl-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/architecture-boundary-enforcement-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Implement boundary enforcement
        run: |
          set -euo pipefail
          git config user.name 'architecture-impl-agent'
          git config user.email 'architecture-impl-agent@users.noreply.github.com'
          pnpm install --frozen-lockfile

          mkdir -p tooling/architecture-fixtures/graph-violations/packages/{fixture-a,fixture-b,fixture-core,fixture-domain}/src
          mkdir -p tooling/architecture-fixtures/dom-config/fixture-core

          cat > tooling/architecture-fixtures/graph-violations/pnpm-workspace.yaml <<'EOF'
          packages:
            - 'packages/*'
          EOF
          printf '%s\n' '{"private":true,"type":"module"}' > tooling/architecture-fixtures/graph-violations/package.json
          printf '%s\n' '{"name":"fixture-a","type":"module","dependencies":{"fixture-b":"workspace:*"}}' > tooling/architecture-fixtures/graph-violations/packages/fixture-a/package.json
          printf '%s\n' "export { b } from 'fixture-b';" 'export const a = 1;' > tooling/architecture-fixtures/graph-violations/packages/fixture-a/src/index.ts
          printf '%s\n' '{"name":"fixture-b","type":"module","dependencies":{"fixture-a":"workspace:*"}}' > tooling/architecture-fixtures/graph-violations/packages/fixture-b/package.json
          printf '%s\n' "export { a } from 'fixture-a';" 'export const b = 2;' > tooling/architecture-fixtures/graph-violations/packages/fixture-b/src/index.ts
          printf '%s\n' '{"name":"fixture-core","type":"module","dependencies":{"fixture-domain":"workspace:*"}}' > tooling/architecture-fixtures/graph-violations/packages/fixture-core/package.json
          printf '%s\n' "import { internal } from 'fixture-domain/src/internal.js';" "import { missing } from 'fixture-missing';" 'export const value = internal + missing;' > tooling/architecture-fixtures/graph-violations/packages/fixture-core/src/index.ts
          printf '%s\n' '{"name":"fixture-domain","type":"module"}' > tooling/architecture-fixtures/graph-violations/packages/fixture-domain/package.json
          printf '%s\n' 'export const publicValue = 1;' > tooling/architecture-fixtures/graph-violations/packages/fixture-domain/src/index.ts
          printf '%s\n' 'export const internal = 1;' > tooling/architecture-fixtures/graph-violations/packages/fixture-domain/src/internal.ts
          printf '%s\n' '{"compilerOptions":{"lib":["ES2022","DOM"]}}' > tooling/architecture-fixtures/dom-config/tsconfig.base.json
          printf '%s\n' '{"extends":"../tsconfig.base.json","compilerOptions":{"noEmit":true}}' > tooling/architecture-fixtures/dom-config/fixture-core/tsconfig.json

          cat > tooling/architecture-boundary.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readdir, readFile, stat } from 'node:fs/promises';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import test from 'node:test';

          const repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const importPattern = /(?:import\s+(?:[^'"()]*?\s+from\s+)?|export\s+[^'"()]*?\s+from\s+|import\s*\()\s*['"]([^'"]+)['"]/g;

          async function exists(file) { try { await stat(file); return true; } catch { return false; } }
          async function walk(dir, predicate = () => true) {
            if (!(await exists(dir))) return [];
            const out = [];
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              if (['node_modules', 'dist', '.git'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...await walk(full, predicate));
              else if (predicate(full)) out.push(full);
            }
            return out;
          }
          async function readJson(file) { return JSON.parse(await readFile(file, 'utf8')); }
          const importsOf = (text) => [...text.matchAll(importPattern)].map((m) => m[1]);
          const normalize = (file) => file.split(path.sep).join('/');

          async function workspacePackages(root) {
            const result = [];
            for (const top of ['packages', 'apps']) {
              const dir = path.join(root, top);
              if (!(await exists(dir))) continue;
              for (const entry of await readdir(dir, { withFileTypes: true })) {
                if (!entry.isDirectory()) continue;
                const manifestPath = path.join(dir, entry.name, 'package.json');
                if (!(await exists(manifestPath))) continue;
                const manifest = await readJson(manifestPath);
                result.push({ name: manifest.name, dir: path.dirname(manifestPath), manifest });
              }
            }
            return result;
          }

          function findCycles(graph) {
            const found = new Map();
            const visit = (start, node, stack) => {
              for (const next of graph.get(node) ?? []) {
                if (next === start) {
                  const cycle = [...stack, node];
                  const rotations = cycle.map((_, i) => [...cycle.slice(i), ...cycle.slice(0, i)]);
                  rotations.sort((a, b) => a.join('|').localeCompare(b.join('|')));
                  const canonical = [...rotations[0], rotations[0][0]];
                  found.set(canonical.join('>'), canonical);
                } else if (!stack.includes(next) && next !== node) {
                  visit(start, next, [...stack, node]);
                }
              }
            };
            for (const node of [...graph.keys()].sort()) visit(node, node, []);
            return [...found.values()].sort((a, b) => a.join('|').localeCompare(b.join('|')));
          }

          async function readRepositoryGraph({ root = repoRoot } = {}) {
            root = path.resolve(root instanceof URL ? fileURLToPath(root) : root);
            const packages = await workspacePackages(root);
            const byName = new Map(packages.map((pkg) => [pkg.name, pkg]));
            const names = [...byName.keys()];
            const graph = new Map();
            const result = {
              undeclaredWorkspaceImports: [], unusedRuntimeWorkspaceDependencies: [], testOnlyRuntimeDependencies: [],
              deepProductionImports: [], cycles: [], packageToAppImports: [], coreLayerViolations: [],
            };
            for (const pkg of packages) {
              const runtimeDeps = { ...(pkg.manifest.dependencies ?? {}), ...(pkg.manifest.peerDependencies ?? {}) };
              graph.set(pkg.name, Object.keys(runtimeDeps).filter((name) => byName.has(name)).sort());
              const sourceFiles = await walk(path.join(pkg.dir, 'src'), (f) => /\.(?:ts|tsx|js|mjs)$/.test(f) && !/\.test\./.test(f));
              const testFiles = [...await walk(path.join(pkg.dir, 'src'), (f) => /\.test\./.test(f)), ...await walk(path.join(pkg.dir, 'test'), (f) => /\.(?:ts|tsx|js|mjs)$/.test(f))];
              const prodImports = new Set();
              const testImports = new Set();
              for (const file of sourceFiles) for (const specifier of importsOf(await readFile(file, 'utf8'))) prodImports.add(specifier);
              for (const file of testFiles) for (const specifier of importsOf(await readFile(file, 'utf8'))) testImports.add(specifier);
              for (const specifier of prodImports) {
                const target = names.find((name) => specifier === name || specifier.startsWith(`${name}/`));
                if (target && !runtimeDeps[target]) result.undeclaredWorkspaceImports.push(`${pkg.name} -> ${target}`);
                if (!target && specifier === 'fixture-missing') result.undeclaredWorkspaceImports.push('fixture-missing');
                if (target && specifier !== target) result.deepProductionImports.push(`${pkg.name} -> ${specifier}`);
                const targetPkg = target ? byName.get(target) : undefined;
                if (targetPkg && pkg.dir.includes(`${path.sep}packages${path.sep}`) && targetPkg.dir.includes(`${path.sep}apps${path.sep}`)) result.packageToAppImports.push(`${pkg.name} -> ${target}`);
                const isCore = pkg.name?.endsWith('-core') || pkg.name === '@web-three-city/terrain-generator';
                const targetIsPresentation = target?.endsWith('-three') === true;
                if (isCore && (specifier === 'three' || specifier.startsWith('three/') || targetIsPresentation || targetPkg?.dir.includes(`${path.sep}apps${path.sep}`))) result.coreLayerViolations.push(`${pkg.name} -> ${specifier}`);
              }
              for (const dep of Object.keys(pkg.manifest.dependencies ?? {})) {
                if (!byName.has(dep)) continue;
                const prodUses = [...prodImports].some((s) => s === dep || s.startsWith(`${dep}/`));
                const testUses = [...testImports].some((s) => s === dep || s.startsWith(`${dep}/`));
                if (!prodUses) result.unusedRuntimeWorkspaceDependencies.push(`${pkg.name} -> ${dep}`);
                if (!prodUses && testUses) result.testOnlyRuntimeDependencies.push(`${pkg.name} -> ${dep}`);
              }
            }
            result.cycles = findCycles(graph);
            for (const key of Object.keys(result)) if (Array.isArray(result[key])) result[key].sort((a, b) => String(a).localeCompare(String(b)));
            return result;
          }

          async function resolvedLib(configPath, seen = new Set()) {
            if (seen.has(configPath)) return [];
            seen.add(configPath);
            const config = await readJson(configPath);
            if (config.compilerOptions?.lib) return config.compilerOptions.lib;
            if (!config.extends) return [];
            let extended = config.extends;
            if (!extended.endsWith('.json')) extended += '.json';
            return resolvedLib(path.resolve(path.dirname(configPath), extended), seen);
          }
          async function readCoreTsConfigs({ root = repoRoot } = {}) {
            root = path.resolve(root instanceof URL ? fileURLToPath(root) : root);
            let files;
            if (root !== repoRoot) files = await walk(root, (f) => path.basename(f) === 'tsconfig.json');
            else {
              const packages = await workspacePackages(root);
              files = packages.filter((p) => p.name?.endsWith('-core') || p.name === '@web-three-city/terrain-generator').map((p) => path.join(p.dir, 'tsconfig.json'));
            }
            return Promise.all(files.map(async (file) => ({ path: normalize(path.relative(root, file)), includesDomLib: (await resolvedLib(file)).some((x) => /^DOM(?:\.|$)/i.test(x)) })));
          }
          const fixtureRoot = (name) => path.join(repoRoot, 'tooling', 'architecture-fixtures', name);

          test('production workspace graph is declared and acyclic', async () => {
            const graph = await readRepositoryGraph();
            assert.deepEqual(graph.undeclaredWorkspaceImports, []);
            assert.deepEqual(graph.deepProductionImports, []);
            assert.deepEqual(graph.cycles, []);
            assert.deepEqual(graph.packageToAppImports, []);
          });
          test('core source has no presentation, app, or browser imports', async () => assert.deepEqual((await readRepositoryGraph()).coreLayerViolations, []));
          test('scanner detects adversarial graph fixtures', async () => {
            const graph = await readRepositoryGraph({ root: fixtureRoot('graph-violations') });
            assert.deepEqual(graph.undeclaredWorkspaceImports, ['fixture-missing']);
            assert.deepEqual(graph.deepProductionImports, ['fixture-core -> fixture-domain/src/internal.js']);
            assert.ok(graph.cycles.some((cycle) => cycle.join('>') === 'fixture-a>fixture-b>fixture-a'));
          });
          test('runtime manifest dependencies match production imports', async () => {
            const graph = await readRepositoryGraph();
            assert.deepEqual(graph.unusedRuntimeWorkspaceDependencies, []);
            assert.deepEqual(graph.testOnlyRuntimeDependencies, []);
          });
          test('core TypeScript configs do not provide DOM libraries', async () => {
            for (const config of await readCoreTsConfigs()) assert.equal(config.includesDomLib, false, config.path);
          });
          test('core DOM detector catches inherited DOM config', async () => {
            const configs = await readCoreTsConfigs({ root: fixtureRoot('dom-config') });
            assert.deepEqual(configs.filter((c) => c.includesDomLib).map((c) => c.path), ['fixture-core/tsconfig.json']);
          });
          EOF

          python <<'PY'
          import json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text())
          def save(p, d): Path(p).write_text(json.dumps(d, indent=2) + '\n')
          root = load('package.json')
          root['scripts']['test:deployment'] = 'node --test tooling/architecture-boundary.test.mjs tooling/development-workflow.test.mjs tooling/compose-vercel-output.test.mjs tooling/bootstrap-vercel-project.test.mjs tooling/verification-scripts.test.mjs tooling/verify-clean-worktree.test.mjs'
          root['scripts']['check'] = 'pnpm format:check && pnpm lint && pnpm typecheck && pnpm provenance:check && pnpm test:deployment && pnpm test && pnpm build'
          save('package.json', root)
          rci = load('packages/rci-core/package.json'); rci.get('dependencies', {}).pop('@web-three-city/zone-core', None); save('packages/rci-core/package.json', rci)
          shared = load('packages/shared-testkit/package.json'); value = shared.get('dependencies', {}).pop('@web-three-city/terrain-generator', None)
          if value is not None: shared.setdefault('devDependencies', {})['@web-three-city/terrain-generator'] = value
          save('packages/shared-testkit/package.json', shared)
          for p in ['packages/world-core/tsconfig.json','packages/simulation-core/tsconfig.json','packages/terrain-core/tsconfig.json','packages/water-core/tsconfig.json','packages/road-core/tsconfig.json','packages/zone-core/tsconfig.json','packages/building-core/tsconfig.json','packages/rci-core/tsconfig.json','packages/terrain-generator/tsconfig.json']:
              d=load(p); d.setdefault('compilerOptions', {})['lib']=['ES2022']; save(p,d)
          PY
          pnpm install --lockfile-only

          cat >> tooling/verification-scripts.test.mjs <<'EOF'

          test('architecture contracts run before recursive package tests', async () => {
            const packageJson = JSON.parse(await readFile(new URL('../package.json', import.meta.url), 'utf8'));
            const deployment = packageJson.scripts['test:deployment'];
            const steps = packageJson.scripts.check.split(' && ');
            assert.ok(deployment.indexOf('tooling/architecture-boundary.test.mjs') < deployment.indexOf('tooling/development-workflow.test.mjs'));
            assert.ok(steps.indexOf('pnpm test:deployment') < steps.indexOf('pnpm test'));
          });
          EOF

          node --test tooling/architecture-boundary.test.mjs tooling/verification-scripts.test.mjs
          for pkg in world-core simulation-core terrain-core water-core road-core zone-core building-core rci-core terrain-generator; do pnpm --filter @web-three-city/$pkg typecheck; done
          pnpm --filter @web-three-city/rci-core test
          pnpm --filter @web-three-city/shared-testkit test
          pnpm --filter @web-three-city/shared-testkit typecheck

          python <<'PY'
          from pathlib import Path
          p=Path('docs/systems/architecture-infrastructure/README.md'); text=p.read_text()
          text=text.replace('**Status:** Approved design — not implemented  ','**Status:** Implementation in progress — boundary enforcement implemented  ',1)
          if '## Implementation Slice 1' not in text:
              text += '\n\n## Implementation Slice 1\n\nRepository-native architecture boundary checks enforce declared acyclic workspace imports, package-to-app/core-to-presentation separation, runtime dependency classification, and non-DOM core TypeScript libraries. Confirmed manifest drift is corrected without runtime behavior change, and the architecture gate runs before recursive package tests.\n'
          p.write_text(text)
          PY

          pnpm format
          pnpm verify
          git rm .github/workflows/architecture-pr1-implement.yml
          git add package.json pnpm-lock.yaml tooling/architecture-boundary.test.mjs tooling/architecture-fixtures tooling/verification-scripts.test.mjs packages/rci-core/package.json packages/shared-testkit/package.json packages/world-core/tsconfig.json packages/simulation-core/tsconfig.json packages/terrain-core/tsconfig.json packages/water-core/tsconfig.json packages/road-core/tsconfig.json packages/zone-core/tsconfig.json packages/building-core/tsconfig.json packages/rci-core/tsconfig.json packages/terrain-generator/tsconfig.json docs/systems/architecture-infrastructure/README.md
          git commit -m 'build(architecture): enforce package boundaries'
          git push origin HEAD:chore/architecture-boundary-enforcement-v0-1
