name: Architecture PR1 Runner

on:
  push:
    branches:
      - chore/architecture-boundary-enforcement-v0-1

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/architecture-boundary-enforcement-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: |
          rm -f .github/workflows/architecture-pr1-finalize2.yml
          bash tooling/architecture-pr1-author.sh
