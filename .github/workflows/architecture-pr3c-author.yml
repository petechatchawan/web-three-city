name: Architecture PR3 Runtime Authority Author

on:
  push:
    branches:
      - refactor/dependent-world-consistency-v0-1

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'architecture-impl-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dependent-world-consistency-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash tooling/architecture-pr3c-repair.sh
