name: Architecture PR3 Committed Reads Author

on:
  push:
    branches:
      - refactor/dependent-world-consistency-v0-1
    paths:
      - '.github/workflows/architecture-pr3d-author.yml'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dependent-world-consistency-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash tooling/architecture-pr3d-author.sh
