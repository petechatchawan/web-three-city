name: Architecture PR4 Finalize

on:
  push:
    branches:
      - refactor/presentation-coordination-v0-1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'architecture-impl-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/presentation-coordination-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build and verify bounded presentation extraction
        run: |
          set -euo pipefail
          git config user.name 'architecture-impl-agent'
          git config user.email 'architecture-impl-agent@users.noreply.github.com'
          pnpm install --frozen-lockfile

          python <<'PY'
          from pathlib import Path
          path = Path('apps/game/src/game-bootstrap.ts')
          text = path.read_text()
          import_anchor = "import { fingerprintCommittedWorld } from './application/committed-world-fingerprint.js';\n"
          presentation_import = "import { PresentationCoordinator } from './application/presentation-coordinator.js';\n"
          if presentation_import not in text:
              assert import_anchor in text
              text = text.replace(import_anchor, import_anchor + presentation_import, 1)
          if '  const presentCompleteWorld = (world: CommittedWorld): void => {' in text:
              start = text.index('  const presentCompleteWorld = (world: CommittedWorld): void => {')
              end = text.index('  const saveCoordinator = new SaveCoordinator({', start)
              replacement = '''  const presentationCoordinator = new PresentationCoordinator({
            setReplacingWorld: (value) => {
              replacingWorld = value;
            },
            loadTerrain: (world) => terrain.load(world.terrain),
            loadWater: (world) => {
              const presentationStart = performance.now();
              water.load(world.terrain, world.water);
              waterPresentationDurationMs = performance.now() - presentationStart;
              waterBuildMetrics = stagedWaterBuildMetrics;
            },
            loadGrid: (world) => grid.load(world.terrain),
            loadRoads: (world) => roadPresentation.loadAll(world.roads, world.environments.road),
            loadZones: (world) => {
              zoneSurfaceSnapshot = world.terrain;
              zonePresentation.loadAll(world.zones);
            },
            loadBuildings: (world) => buildingPresentation.load(world.buildings),
            rebuildSelection: (world) => rebuildSelection(selection, world.terrain, selectedCell),
            refreshTerrainObjects: () => inputRef.current?.refreshTerrainObjects(),
          });
          const transactionCoordinator = new DefaultWorldTransactionCoordinator({
            worldStore: committedWorldStore,
            presentation: presentationCoordinator.completeWorld,
          });
          '''
              text = text[:start] + replacement + text[end:]
              text = text.replace('incrementalPresentation(', 'presentationCoordinator.incremental(')
              text = text.replace('noOpPresentation', 'presentationCoordinator.noOp')
          handler_anchor = "  ui.canvas.addEventListener(\n    'webglcontextrestored',"
          handler = text.index(handler_anchor)
          if '      terrain.load(snapshot);' in text[handler:]:
              restore_start = text.index('      terrain.load(snapshot);', handler)
              restore_end_line = '      contextLost = false;'
              restore_end = text.index(restore_end_line, restore_start) + len(restore_end_line)
              text = text[:restore_start] + '      presentationCoordinator.rebuildCommittedWorld(transactionCoordinator.snapshot());\n      contextLost = false;' + text[restore_end:]
          path.write_text(text)
          PY

          python <<'PY'
          from pathlib import Path
          path = Path('docs/systems/architecture-infrastructure/README.md')
          text = path.read_text()
          text = text.replace('**Status:** Implementation in progress — slices 1–3 implemented; PR 3 final verification pending  ', '**Status:** Implementation in progress — slices 1–4 implemented; PR 4 verification pending  ', 1)
          text = text.replace('**Implementation baseline:** `master@05334eba378340c610d6f6a8633e220a120580cf`  ', '**Implementation baseline:** `master@6578b3fa13d19c608068995a1dd8796baf9d7ef7`  ', 1)
          text = text.replace('- `game-bootstrap.ts` still owns substantial presentation/composition wiring; bounded presentation extraction is the next implementation slice.', '- Complete-world presentation synchronization is extracted behind an explicit application coordinator; `game-bootstrap.ts` remains the composition root and retains adapter construction.', 1)
          if '## Implementation Slice 4' not in text:
              text += '\n\n## Implementation Slice 4\n\n`PresentationCoordinator` owns the ordered post-publication synchronization and committed-world recovery path for Terrain, Water, Grid, Roads, Zones, Buildings, selection, and terrain-object refresh. `game-bootstrap.ts` supplies explicit adapter callbacks and remains the composition root; presentation does not gain domain authority, Save ownership, tool state, or Undo ownership. WebGL context restoration delegates to the same complete-world recovery path, while incremental background Growth updates remain isolated from active tool and Undo state.\n'
          path.write_text(text)
          PY

          pnpm exec prettier --write apps/game/src/application/presentation-coordinator.ts apps/game/src/application/presentation-coordinator.test.ts apps/game/src/game-bootstrap.ts
          pnpm exec eslint apps/game/src/application/presentation-coordinator.ts apps/game/src/application/presentation-coordinator.test.ts apps/game/src/game-bootstrap.ts
          pnpm --filter @web-three-city/game test -- src/application/presentation-coordinator.test.ts
          pnpm --filter @web-three-city/game test
          pnpm --filter @web-three-city/game typecheck
          pnpm build:browser
          pnpm exec playwright install chromium
          pnpm exec playwright test browser-tests/transaction-release.spec.ts browser-tests/interaction-conformance.spec.ts --project=chromium --workers=2

          git rm .github/workflows/architecture-pr4-author.yml .github/workflows/architecture-pr4-finalize.yml
          git add apps/game/src/application/presentation-coordinator.ts apps/game/src/application/presentation-coordinator.test.ts apps/game/src/game-bootstrap.ts docs/systems/architecture-infrastructure/README.md
          git diff --cached --check
          git commit -m 'refactor(game): extract bounded presentation coordination'
          git push origin HEAD:refactor/presentation-coordination-v0-1
