name: Author Building Growth Core

on:
  push:
    branches:
      - agent/building-growth-core-v0-1

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-core-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Author tests and implementation without executing tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          write('packages/simulation-core/package.json', '''{
            "name": "@web-three-city/simulation-core",
            "version": "0.0.0",
            "private": true,
            "type": "module",
            "exports": "./src/index.ts",
            "dependencies": {
              "@web-three-city/world-core": "workspace:*"
            },
            "scripts": {
              "test": "vitest run --passWithNoTests",
              "test:coverage": "vitest run --coverage --passWithNoTests",
              "typecheck": "tsc -p tsconfig.json --noEmit",
              "build": "tsc -p tsconfig.build.json"
            }
          }
          ''')
          write('packages/simulation-core/tsconfig.json', '''{
            "extends": "../../tsconfig.base.json",
            "compilerOptions": { "noEmit": true },
            "include": ["src", "test", "vitest.config.ts"]
          }
          ''')
          write('packages/simulation-core/tsconfig.build.json', '''{
            "extends": "../../tsconfig.base.json",
            "compilerOptions": {
              "declaration": true,
              "emitDeclarationOnly": true,
              "outDir": "dist",
              "rootDir": "src"
            },
            "include": ["src"]
          }
          ''')
          write('packages/simulation-core/vitest.config.ts', '''import { defineConfig } from 'vitest/config';

          export default defineConfig({
            test: { environment: 'node' },
          });
          ''')
          write('packages/simulation-core/src/contracts.ts', '''export type SimulationSpeed = 'paused' | 'normal' | 'fast' | 'faster';

          export interface SimulationSnapshot {
            readonly revision: number;
            readonly absoluteTick: number;
            readonly growthSequence: number;
          }

          export interface GameCalendar {
            readonly year: number;
            readonly month: number;
            readonly day: number;
            readonly hour: number;
          }

          export interface SimulationTickPlan {
            readonly baseRevision: number;
            readonly beforeAbsoluteTick: number;
            readonly afterAbsoluteTick: number;
            readonly valid: boolean;
            readonly invalidReason: 'simulation:invalid-state' | 'simulation:tick-overflow' | null;
          }

          export interface SimulationTickReceipt {
            readonly beforeRevision: number;
            readonly afterRevision: number;
            readonly beforeAbsoluteTick: number;
            readonly afterAbsoluteTick: number;
          }

          export type SimulationContractErrorCode =
            | 'simulation:invalid-plan'
            | 'simulation:stale-plan'
            | 'simulation:invalid-state';

          export class SimulationContractError extends Error {
            readonly code: SimulationContractErrorCode;

            constructor(code: SimulationContractErrorCode) {
              super(code);
              this.name = 'SimulationContractError';
              this.code = code;
            }
          }
          ''')
          write('packages/simulation-core/src/calendar.ts', '''import type { GameCalendar } from './contracts.js';

          export const HOURS_PER_DAY = 24;
          export const DAYS_PER_MONTH = 30;
          export const MONTHS_PER_YEAR = 12;
          export const INITIAL_ABSOLUTE_TICK = 8;
          export const DEVELOPMENT_EVALUATION_HOURS = Object.freeze([0, 6, 12, 18] as const);

          export function assertAbsoluteTick(value: number): void {
            if (!Number.isSafeInteger(value) || value < 0) {
              throw new RangeError('simulation-calendar:invalid-tick');
            }
          }

          export function deriveGameCalendar(absoluteTick: number): GameCalendar {
            assertAbsoluteTick(absoluteTick);
            const completeDays = Math.floor(absoluteTick / HOURS_PER_DAY);
            const hour = absoluteTick % HOURS_PER_DAY;
            const completeMonths = Math.floor(completeDays / DAYS_PER_MONTH);
            const day = (completeDays % DAYS_PER_MONTH) + 1;
            const year = Math.floor(completeMonths / MONTHS_PER_YEAR) + 1;
            const month = (completeMonths % MONTHS_PER_YEAR) + 1;
            return Object.freeze({ year, month, day, hour });
          }

          export function isDevelopmentEvaluationTick(absoluteTick: number): boolean {
            return DEVELOPMENT_EVALUATION_HOURS.includes(
              deriveGameCalendar(absoluteTick).hour as (typeof DEVELOPMENT_EVALUATION_HOURS)[number],
            );
          }
          ''')
          write('packages/simulation-core/src/simulation-snapshot.ts', '''import { INITIAL_ABSOLUTE_TICK, assertAbsoluteTick } from './calendar.js';
          import type { SimulationSnapshot } from './contracts.js';

          export function createSimulationSnapshot(input: SimulationSnapshot): SimulationSnapshot {
            if (!Number.isSafeInteger(input.revision) || input.revision < 0) {
              throw new RangeError('simulation-snapshot:invalid-revision');
            }
            assertAbsoluteTick(input.absoluteTick);
            if (!Number.isSafeInteger(input.growthSequence) || input.growthSequence < 0) {
              throw new RangeError('simulation-snapshot:invalid-growth-sequence');
            }
            return Object.freeze({
              revision: input.revision,
              absoluteTick: input.absoluteTick,
              growthSequence: input.growthSequence,
            });
          }

          export function createInitialSimulationSnapshot(): SimulationSnapshot {
            return createSimulationSnapshot({
              revision: 0,
              absoluteTick: INITIAL_ABSOLUTE_TICK,
              growthSequence: 0,
            });
          }
          ''')
          write('packages/simulation-core/src/simulation-mutation.ts', '''import {
            SimulationContractError,
            type SimulationSnapshot,
            type SimulationTickPlan,
            type SimulationTickReceipt,
          } from './contracts.js';
          import { createSimulationSnapshot } from './simulation-snapshot.js';

          export function planSimulationTick(snapshot: SimulationSnapshot): SimulationTickPlan {
            try {
              const validated = createSimulationSnapshot(snapshot);
              if (validated.absoluteTick === Number.MAX_SAFE_INTEGER) {
                return Object.freeze({
                  baseRevision: validated.revision,
                  beforeAbsoluteTick: validated.absoluteTick,
                  afterAbsoluteTick: validated.absoluteTick,
                  valid: false,
                  invalidReason: 'simulation:tick-overflow',
                });
              }
              return Object.freeze({
                baseRevision: validated.revision,
                beforeAbsoluteTick: validated.absoluteTick,
                afterAbsoluteTick: validated.absoluteTick + 1,
                valid: true,
                invalidReason: null,
              });
            } catch {
              return Object.freeze({
                baseRevision: snapshot.revision,
                beforeAbsoluteTick: snapshot.absoluteTick,
                afterAbsoluteTick: snapshot.absoluteTick,
                valid: false,
                invalidReason: 'simulation:invalid-state',
              });
            }
          }

          export function commitSimulationTick(
            snapshot: SimulationSnapshot,
            plan: SimulationTickPlan,
            growthSequence = snapshot.growthSequence,
          ): { readonly snapshot: SimulationSnapshot; readonly receipt: SimulationTickReceipt } {
            if (!plan.valid || plan.invalidReason !== null) {
              throw new SimulationContractError('simulation:invalid-plan');
            }
            const validated = createSimulationSnapshot(snapshot);
            if (
              validated.revision !== plan.baseRevision ||
              validated.absoluteTick !== plan.beforeAbsoluteTick
            ) {
              throw new SimulationContractError('simulation:stale-plan');
            }
            const next = createSimulationSnapshot({
              revision: validated.revision + 1,
              absoluteTick: plan.afterAbsoluteTick,
              growthSequence,
            });
            return Object.freeze({
              snapshot: next,
              receipt: Object.freeze({
                beforeRevision: validated.revision,
                afterRevision: next.revision,
                beforeAbsoluteTick: validated.absoluteTick,
                afterAbsoluteTick: next.absoluteTick,
              }),
            });
          }
          ''')
          write('packages/simulation-core/src/serialization.ts', '''import { err, ok, type Result } from '@web-three-city/world-core';
          import type { SimulationSnapshot } from './contracts.js';
          import { createSimulationSnapshot } from './simulation-snapshot.js';

          export interface SimulationSaveV1 {
            readonly kind: 'simulation-save';
            readonly schemaVersion: 1;
            readonly absoluteTick: number;
            readonly growthSequence: number;
          }

          export interface SimulationSaveError {
            readonly code: 'simulation-save:invalid-schema' | 'simulation-save:invalid-state';
          }

          function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === 'object' && value !== null;
          }

          export function encodeSimulationSaveV1(snapshot: SimulationSnapshot): SimulationSaveV1 {
            const validated = createSimulationSnapshot(snapshot);
            return Object.freeze({
              kind: 'simulation-save',
              schemaVersion: 1,
              absoluteTick: validated.absoluteTick,
              growthSequence: validated.growthSequence,
            });
          }

          export function decodeSimulationSaveV1(
            input: unknown,
          ): Result<SimulationSnapshot, SimulationSaveError> {
            if (
              !isRecord(input) ||
              input.kind !== 'simulation-save' ||
              input.schemaVersion !== 1 ||
              typeof input.absoluteTick !== 'number' ||
              typeof input.growthSequence !== 'number'
            ) {
              return err({ code: 'simulation-save:invalid-schema' });
            }
            try {
              return ok(
                createSimulationSnapshot({
                  revision: 0,
                  absoluteTick: input.absoluteTick,
                  growthSequence: input.growthSequence,
                }),
              );
            } catch {
              return err({ code: 'simulation-save:invalid-state' });
            }
          }
          ''')
          write('packages/simulation-core/src/index.ts', '''export * from './contracts.js';
          export * from './calendar.js';
          export * from './simulation-snapshot.js';
          export * from './simulation-mutation.js';
          export * from './serialization.js';
          ''')

          write('packages/simulation-core/test/calendar.test.ts', '''import { describe, expect, it } from 'vitest';
          import {
            deriveGameCalendar,
            isDevelopmentEvaluationTick,
          } from '../src/index.js';

          describe('simple game calendar', () => {
            it('derives the initial calendar from absolute tick eight', () => {
              expect(deriveGameCalendar(8)).toEqual({ year: 1, month: 1, day: 1, hour: 8 });
            });

            it('rolls exact day month and year boundaries', () => {
              expect(deriveGameCalendar(24)).toEqual({ year: 1, month: 1, day: 2, hour: 0 });
              expect(deriveGameCalendar(24 * 30)).toEqual({ year: 1, month: 2, day: 1, hour: 0 });
              expect(deriveGameCalendar(24 * 30 * 12)).toEqual({ year: 2, month: 1, day: 1, hour: 0 });
            });

            it('rejects invalid ticks and identifies evaluation hours', () => {
              expect(() => deriveGameCalendar(-1)).toThrow('simulation-calendar:invalid-tick');
              expect(() => deriveGameCalendar(1.5)).toThrow('simulation-calendar:invalid-tick');
              expect([0, 6, 12, 18].every(isDevelopmentEvaluationTick)).toBe(true);
              expect(isDevelopmentEvaluationTick(8)).toBe(false);
            });
          });
          ''')
          write('packages/simulation-core/test/simulation-snapshot.test.ts', '''import { describe, expect, it } from 'vitest';
          import {
            createInitialSimulationSnapshot,
            createSimulationSnapshot,
          } from '../src/index.js';

          describe('simulation snapshot', () => {
            it('creates immutable initial authority', () => {
              const snapshot = createInitialSimulationSnapshot();
              expect(snapshot).toEqual({ revision: 0, absoluteTick: 8, growthSequence: 0 });
              expect(Object.isFrozen(snapshot)).toBe(true);
            });

            it('rejects invalid authority', () => {
              expect(() => createSimulationSnapshot({ revision: -1, absoluteTick: 8, growthSequence: 0 })).toThrow();
              expect(() => createSimulationSnapshot({ revision: 0, absoluteTick: -1, growthSequence: 0 })).toThrow();
              expect(() => createSimulationSnapshot({ revision: 0, absoluteTick: 8, growthSequence: -1 })).toThrow();
            });
          });
          ''')
          write('packages/simulation-core/test/simulation-mutation.test.ts', '''import { describe, expect, it } from 'vitest';
          import {
            commitSimulationTick,
            createInitialSimulationSnapshot,
            planSimulationTick,
          } from '../src/index.js';

          describe('simulation tick mutation', () => {
            it('advances exactly one logical tick with revision fencing', () => {
              const before = createInitialSimulationSnapshot();
              const plan = planSimulationTick(before);
              const committed = commitSimulationTick(before, plan);
              expect(committed.snapshot).toEqual({ revision: 1, absoluteTick: 9, growthSequence: 0 });
              expect(() => commitSimulationTick(committed.snapshot, plan)).toThrow('simulation:stale-plan');
            });
          });
          ''')
          write('packages/simulation-core/test/serialization.test.ts', '''import { describe, expect, it } from 'vitest';
          import {
            createSimulationSnapshot,
            decodeSimulationSaveV1,
            encodeSimulationSaveV1,
          } from '../src/index.js';

          describe('SimulationSaveV1', () => {
            it('round trips authoritative tick and growth sequence', () => {
              const snapshot = createSimulationSnapshot({ revision: 7, absoluteTick: 99, growthSequence: 4 });
              const decoded = decodeSimulationSaveV1(encodeSimulationSaveV1(snapshot));
              expect(decoded.ok).toBe(true);
              if (decoded.ok) expect(decoded.value).toEqual({ revision: 0, absoluteTick: 99, growthSequence: 4 });
            });

            it('fails closed for malformed authority', () => {
              expect(decodeSimulationSaveV1({ kind: 'simulation-save', schemaVersion: 1, absoluteTick: -1, growthSequence: 0 }).ok).toBe(false);
            });
          });
          ''')

          building_package = json.loads(Path('packages/building-core/package.json').read_text())
          building_package['dependencies']['@web-three-city/simulation-core'] = 'workspace:*'
          write('packages/building-core/package.json', json.dumps(building_package, indent=2) + '\n')

          write('packages/building-core/src/contracts.ts', '''import type { SimulationSnapshot } from '@web-three-city/simulation-core';
          import type { ChunkCoord, TerrainCellSurfaceProfile } from '@web-three-city/terrain-core';
          import type { CellCoord } from '@web-three-city/world-core';
          import type {
            ZoneDefinitionId,
            ZoneRoadAccess,
            ZoneRoadDirection,
          } from '@web-three-city/zone-core';

          export type BuildingDefinitionId =
            | 'residential-cottage-1x1'
            | 'residential-rowhouse-1x2'
            | 'commercial-shop-1x1'
            | 'commercial-office-2x2'
            | 'industrial-workshop-1x2'
            | 'industrial-warehouse-2x2';

          export type BuildingDefinitionVersion = 1;
          export type BuildingRotationQuarterTurns = 0 | 1 | 2 | 3;
          export type BuildingPrototypeId =
            | 'cottage'
            | 'rowhouse'
            | 'shop'
            | 'office'
            | 'workshop'
            | 'warehouse';
          export type BuildingOperation = 'develop' | 'bulldoze';
          export type BuildingLifecycle = 'construction' | 'active';

          export interface BuildingDefinition {
            readonly id: BuildingDefinitionId;
            readonly version: BuildingDefinitionVersion;
            readonly label: string;
            readonly footprintWidth: number;
            readonly footprintDepth: number;
            readonly allowedRotationQuarterTurns: readonly BuildingRotationQuarterTurns[];
            readonly compatibleZoneDefinitionIds: readonly ZoneDefinitionId[];
            readonly selectionPriority: number;
            readonly selectionWeight: number;
            readonly constructionDurationTicks: number;
            readonly prototypeId: BuildingPrototypeId;
            readonly prototypeHeight: number;
          }

          export interface BuildingInstanceBase {
            readonly instanceId: string;
            readonly buildingDefinitionId: BuildingDefinitionId;
            readonly buildingDefinitionVersion: BuildingDefinitionVersion;
            readonly originCell: CellCoord;
            readonly rotationQuarterTurns: BuildingRotationQuarterTurns;
          }

          export interface ConstructionBuildingInstance extends BuildingInstanceBase {
            readonly lifecycle: 'construction';
            readonly constructionStartedAtTick: number;
            readonly constructionCompletesAtTick: number;
          }

          export interface ActiveBuildingInstance extends BuildingInstanceBase {
            readonly lifecycle: 'active';
            readonly activatedAtTick: number;
          }

          export type BuildingInstance = ConstructionBuildingInstance | ActiveBuildingInstance;
          export type BuildingInstanceInput = BuildingInstance | BuildingInstanceBase;

          export interface BuildingSnapshot {
            readonly revision: number;
            readonly instances: readonly BuildingInstance[];
          }

          export interface RotatedBuildingFootprint {
            readonly width: number;
            readonly depth: number;
          }

          export interface BuildingFrontage {
            readonly direction: ZoneRoadDirection;
            readonly distance: 1 | 2 | 3;
            readonly frontageCell: CellCoord;
            readonly roadCell: CellCoord;
          }

          export interface BuildingDevelopmentEnvironment {
            readonly terrainRevision: number;
            readonly waterSourceTerrainRevision: number;
            readonly roadRevision: number;
            readonly zoneRevision: number;
            surfaceAt(cell: CellCoord): TerrainCellSurfaceProfile;
            isDry(cell: CellCoord): boolean;
            isRoadOccupied(cell: CellCoord): boolean;
            zoneDefinitionIdAt(cell: CellCoord): ZoneDefinitionId | null;
            roadAccessAt(cell: CellCoord): ZoneRoadAccess | null;
          }

          export type BuildingInvalidReason =
            | 'building:invalid-state'
            | 'building:invalid-environment'
            | 'building:invalid-cell'
            | 'building:no-change'
            | 'building:no-zoned-lot'
            | 'building:no-compatible-definition'
            | 'building:mixed-zone'
            | 'building:unsupported-terrain'
            | 'building:wet-cell'
            | 'building:road-occupied'
            | 'building:occupied'
            | 'building:road-access-required'
            | 'building:not-found';

          export interface BuildingMutationPlan {
            readonly operation: BuildingOperation;
            readonly baseBuildingRevision: number;
            readonly baseTerrainRevision: number;
            readonly baseWaterSourceTerrainRevision: number;
            readonly baseRoadRevision: number;
            readonly baseZoneRevision: number;
            readonly requestedCell: CellCoord | null;
            readonly proposedInstances: readonly BuildingInstance[];
            readonly addedInstances: readonly BuildingInstance[];
            readonly removedInstances: readonly BuildingInstance[];
            readonly dirtyChunks: readonly ChunkCoord[];
            readonly valid: boolean;
            readonly invalidReason: BuildingInvalidReason | null;
          }

          export interface BuildingMutationReceipt {
            readonly beforeRevision: number;
            readonly afterRevision: number;
            readonly operation: BuildingOperation;
            readonly addedInstanceCount: number;
            readonly removedInstanceCount: number;
            readonly addedCellCount: number;
            readonly removedCellCount: number;
            readonly dirtyChunks: readonly ChunkCoord[];
          }

          export type BuildingGrowthInvalidReason =
            | 'building-growth:invalid-building-state'
            | 'building-growth:invalid-simulation-state'
            | 'building-growth:invalid-environment'
            | 'building-growth:tick-overflow';

          export interface BuildingGrowthPlan {
            readonly baseBuildingRevision: number;
            readonly baseSimulationRevision: number;
            readonly baseTerrainRevision: number;
            readonly baseWaterSourceTerrainRevision: number;
            readonly baseRoadRevision: number;
            readonly baseZoneRevision: number;
            readonly beforeAbsoluteTick: number;
            readonly afterAbsoluteTick: number;
            readonly proposedInstances: readonly BuildingInstance[];
            readonly startedInstanceIds: readonly string[];
            readonly completedInstanceIds: readonly string[];
            readonly nextGrowthSequence: number;
            readonly dirtyChunks: readonly ChunkCoord[];
            readonly valid: boolean;
            readonly invalidReason: BuildingGrowthInvalidReason | null;
          }

          export interface BuildingGrowthReceipt {
            readonly beforeBuildingRevision: number;
            readonly afterBuildingRevision: number;
            readonly beforeSimulationRevision: number;
            readonly afterSimulationRevision: number;
            readonly beforeAbsoluteTick: number;
            readonly afterAbsoluteTick: number;
            readonly startedInstanceIds: readonly string[];
            readonly completedInstanceIds: readonly string[];
            readonly dirtyChunks: readonly ChunkCoord[];
          }

          export interface BuildingGrowthInput {
            readonly buildings: BuildingSnapshot;
            readonly simulation: SimulationSnapshot;
            readonly environment: BuildingDevelopmentEnvironment;
          }

          export type BuildingContractErrorCode =
            | 'building:invalid-plan'
            | 'building:stale-building-plan'
            | 'building:stale-terrain-plan'
            | 'building:stale-water-plan'
            | 'building:stale-road-plan'
            | 'building:stale-zone-plan'
            | 'building:incoherent-world-revision'
            | 'building:invalid-proposed-state'
            | 'building-growth:invalid-plan'
            | 'building-growth:stale-simulation-plan';

          export class BuildingContractError extends Error {
            readonly code: BuildingContractErrorCode;

            constructor(code: BuildingContractErrorCode) {
              super(code);
              this.name = 'BuildingContractError';
              this.code = code;
            }
          }
          ''')

          write('packages/building-core/src/building-definitions.ts', '''import { zoneDefinitionForId } from '@web-three-city/zone-core';
          import type {
            BuildingDefinition,
            BuildingDefinitionId,
            BuildingRotationQuarterTurns,
          } from './contracts.js';

          const ALL_ROTATIONS: readonly BuildingRotationQuarterTurns[] = Object.freeze([0, 1, 2, 3]);

          function definition(value: BuildingDefinition): BuildingDefinition {
            const rotations = [...value.allowedRotationQuarterTurns];
            const compatibleZoneDefinitionIds = [...value.compatibleZoneDefinitionIds];
            let referencesResolvable = true;
            try {
              for (const zoneDefinitionId of compatibleZoneDefinitionIds) zoneDefinitionForId(zoneDefinitionId);
            } catch {
              referencesResolvable = false;
            }
            if (
              !Number.isSafeInteger(value.footprintWidth) || value.footprintWidth <= 0 ||
              !Number.isSafeInteger(value.footprintDepth) || value.footprintDepth <= 0 ||
              !Number.isSafeInteger(value.selectionPriority) || value.selectionPriority < 0 ||
              !Number.isSafeInteger(value.selectionWeight) || value.selectionWeight <= 0 ||
              !Number.isSafeInteger(value.constructionDurationTicks) || value.constructionDurationTicks <= 0 ||
              value.constructionDurationTicks !== 24 * value.footprintWidth * value.footprintDepth ||
              rotations.length === 0 || new Set(rotations).size !== rotations.length ||
              rotations.some((rotation) => rotation < 0 || rotation > 3) ||
              compatibleZoneDefinitionIds.length === 0 ||
              new Set(compatibleZoneDefinitionIds).size !== compatibleZoneDefinitionIds.length ||
              compatibleZoneDefinitionIds.some((zoneDefinitionId) => zoneDefinitionId.length === 0) ||
              !referencesResolvable || !Number.isFinite(value.prototypeHeight) || value.prototypeHeight <= 0
            ) {
              throw new RangeError('building-definition:invalid');
            }
            return Object.freeze({
              ...value,
              allowedRotationQuarterTurns: Object.freeze(rotations.sort((a, b) => a - b)),
              compatibleZoneDefinitionIds: Object.freeze(compatibleZoneDefinitionIds.sort()),
            });
          }

          export const RESIDENTIAL_COTTAGE_1X1 = definition({
            id: 'residential-cottage-1x1', version: 1, label: 'Cottage',
            footprintWidth: 1, footprintDepth: 1, allowedRotationQuarterTurns: ALL_ROTATIONS,
            compatibleZoneDefinitionIds: Object.freeze(['residential']), selectionPriority: 10,
            selectionWeight: 40, constructionDurationTicks: 24, prototypeId: 'cottage', prototypeHeight: 0.8,
          });
          export const RESIDENTIAL_ROWHOUSE_1X2 = definition({
            id: 'residential-rowhouse-1x2', version: 1, label: 'Row House',
            footprintWidth: 1, footprintDepth: 2, allowedRotationQuarterTurns: ALL_ROTATIONS,
            compatibleZoneDefinitionIds: Object.freeze(['residential']), selectionPriority: 20,
            selectionWeight: 30, constructionDurationTicks: 48, prototypeId: 'rowhouse', prototypeHeight: 1.25,
          });
          export const COMMERCIAL_SHOP_1X1 = definition({
            id: 'commercial-shop-1x1', version: 1, label: 'Corner Shop',
            footprintWidth: 1, footprintDepth: 1, allowedRotationQuarterTurns: ALL_ROTATIONS,
            compatibleZoneDefinitionIds: Object.freeze(['commercial']), selectionPriority: 10,
            selectionWeight: 40, constructionDurationTicks: 24, prototypeId: 'shop', prototypeHeight: 0.9,
          });
          export const COMMERCIAL_OFFICE_2X2 = definition({
            id: 'commercial-office-2x2', version: 1, label: 'Office',
            footprintWidth: 2, footprintDepth: 2, allowedRotationQuarterTurns: ALL_ROTATIONS,
            compatibleZoneDefinitionIds: Object.freeze(['commercial']), selectionPriority: 30,
            selectionWeight: 10, constructionDurationTicks: 96, prototypeId: 'office', prototypeHeight: 2.1,
          });
          export const INDUSTRIAL_WORKSHOP_1X2 = definition({
            id: 'industrial-workshop-1x2', version: 1, label: 'Workshop',
            footprintWidth: 1, footprintDepth: 2, allowedRotationQuarterTurns: ALL_ROTATIONS,
            compatibleZoneDefinitionIds: Object.freeze(['industrial']), selectionPriority: 20,
            selectionWeight: 35, constructionDurationTicks: 48, prototypeId: 'workshop', prototypeHeight: 1.05,
          });
          export const INDUSTRIAL_WAREHOUSE_2X2 = definition({
            id: 'industrial-warehouse-2x2', version: 1, label: 'Warehouse',
            footprintWidth: 2, footprintDepth: 2, allowedRotationQuarterTurns: ALL_ROTATIONS,
            compatibleZoneDefinitionIds: Object.freeze(['industrial']), selectionPriority: 30,
            selectionWeight: 20, constructionDurationTicks: 96, prototypeId: 'warehouse', prototypeHeight: 1.35,
          });

          const DEFINITIONS: readonly BuildingDefinition[] = Object.freeze([
            RESIDENTIAL_COTTAGE_1X1, RESIDENTIAL_ROWHOUSE_1X2,
            COMMERCIAL_SHOP_1X1, COMMERCIAL_OFFICE_2X2,
            INDUSTRIAL_WORKSHOP_1X2, INDUSTRIAL_WAREHOUSE_2X2,
          ]);
          const BY_ID = new Map<BuildingDefinitionId, BuildingDefinition>(DEFINITIONS.map((entry) => [entry.id, entry]));

          export function buildingDefinitions(): readonly BuildingDefinition[] { return DEFINITIONS; }
          export function buildingDefinitionForId(id: BuildingDefinitionId): BuildingDefinition {
            const found = BY_ID.get(id);
            if (found === undefined) throw new RangeError('building-definition:unknown-id');
            return found;
          }
          ''')

          write('packages/building-core/src/building-lifecycle.ts', '''import { INITIAL_ABSOLUTE_TICK } from '@web-three-city/simulation-core';
          import type {
            ActiveBuildingInstance,
            BuildingInstance,
            BuildingInstanceInput,
