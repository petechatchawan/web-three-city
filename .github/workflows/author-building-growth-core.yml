              baseWaterSourceTerrainRevision: input.environment.waterSourceTerrainRevision,
              baseRoadRevision: input.environment.roadRevision,
              baseZoneRevision: input.environment.zoneRevision,
              beforeAbsoluteTick: input.simulation.absoluteTick,
              afterAbsoluteTick: input.simulation.absoluteTick,
              proposedInstances: Object.freeze([]), startedInstanceIds: Object.freeze([]),
              completedInstanceIds: Object.freeze([]), nextGrowthSequence: input.simulation.growthSequence,
              dirtyChunks: Object.freeze([]), valid: false, invalidReason: reason,
