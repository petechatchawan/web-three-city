          import { WORLD_CONFIG } from '@web-three-city/world-core';
          import {
            commitBuildingGrowthTick, createEmptyBuildingSnapshot, planBuildingGrowthTick,
            type BuildingDevelopmentEnvironment,
          } from '../src/index.js';

          const environment: BuildingDevelopmentEnvironment = Object.freeze({
            terrainRevision: 0, waterSourceTerrainRevision: 0, roadRevision: 0, zoneRevision: 0,
            surfaceAt: () => Object.freeze({ shape: 'flat', minimumHeightLevel: 0, maximumHeightLevel: 0, diagonal: 'nw-se' }),
            isDry: () => true,
            isRoadOccupied: () => false,
            zoneDefinitionIdAt: (cell) => cell.x === 0 && cell.z === 0 ? 'residential' : null,
            roadAccessAt: () => Object.freeze({ direction: 'south', distance: 1, roadCell: { x: 0, z: 1 } }),
          });

          describe('automatic Building Growth tick', () => {
            it('starts at most one Construction on an evaluation tick', () => {
              const buildings = createEmptyBuildingSnapshot(WORLD_CONFIG);
              const simulation = createSimulationSnapshot({ revision: 0, absoluteTick: 23, growthSequence: 0 });
              const plan = planBuildingGrowthTick({ buildings, simulation, environment, config: WORLD_CONFIG });
              const result = commitBuildingGrowthTick({ buildings, simulation, environment, config: WORLD_CONFIG, plan });
              expect(result.simulation.absoluteTick).toBe(24);
              expect(result.buildings.instances).toHaveLength(1);
              expect(result.buildings.instances[0]?.lifecycle).toBe('construction');
              expect(result.receipt.startedInstanceIds).toEqual(['building:growth:1']);
            });

            it('advances an idle non-evaluation tick without changing Buildings', () => {
              const buildings = createEmptyBuildingSnapshot(WORLD_CONFIG);
              const simulation = createSimulationSnapshot({ revision: 0, absoluteTick: 8, growthSequence: 0 });
              const plan = planBuildingGrowthTick({ buildings, simulation, environment, config: WORLD_CONFIG });
              const result = commitBuildingGrowthTick({ buildings, simulation, environment, config: WORLD_CONFIG, plan });
              expect(result.simulation.absoluteTick).toBe(9);
              expect(result.buildings).toBe(buildings);
            });
          });
          ''')

