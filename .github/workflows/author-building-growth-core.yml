              baseRoadRevision: input.environment.roadRevision,
              baseZoneRevision: input.environment.zoneRevision,
              beforeAbsoluteTick: simulation.absoluteTick,
              afterAbsoluteTick: afterTick,
              proposedInstances: Object.freeze(proposed.map(copyBuildingInstance)),
              startedInstanceIds: freezeStrings(startedIds),
              completedInstanceIds: freezeStrings(completedIds),
