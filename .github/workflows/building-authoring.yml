name: Building Foundation Authoring

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  author:
    if: github.head_ref == 'agent/building-content-occupancy-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-content-occupancy-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Repair literal authoring templates
        run: python3 tooling/repair-building-authoring-scripts.py
      - name: Generate implementation and test specifications
        run: |
          node tooling/generate-building-foundation-part1.mjs
          node tooling/generate-building-foundation-part2.mjs
          node tooling/generate-building-foundation-part3.mjs
      - name: Refresh workspace lockfile only
        run: pnpm install --lockfile-only
      - name: Remove temporary authoring machinery and restore CI
        run: |
          git checkout origin/master -- .github/workflows/ci.yml
          rm tooling/repair-building-authoring-scripts.py
          rm tooling/generate-building-foundation-part1.mjs
          rm tooling/generate-building-foundation-part2.mjs
          rm tooling/generate-building-foundation-part3.mjs
          rm .github/workflows/building-authoring.yml
      - name: Commit generated Building Foundation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: implement Building Content and Occupancy Foundation v0.1"
          git push origin HEAD:agent/building-content-occupancy-v0-1
