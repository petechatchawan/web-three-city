name: Building Compatibility Authoring

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  author:
    if: github.head_ref == 'agent/building-content-occupancy-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-content-occupancy-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked authoring dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply compatibility migration
        run: python3 tooling/finalize_building_compatibility.py
      - name: Format migrated files
        run: >-
          pnpm exec prettier --write
          apps/game/src/game-input.ts
          browser-tests/game.spec.ts
          browser-tests/road.spec.ts
      - name: Remove temporary authoring machinery
        run: |
          rm tooling/finalize_building_compatibility.py
          rm .github/workflows/building-compatibility-authoring.yml
      - name: Commit compatibility migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: migrate Building consumers to WorldSaveV3"
          git push origin HEAD:agent/building-content-occupancy-v0-1
