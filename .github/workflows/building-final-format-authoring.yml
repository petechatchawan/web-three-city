name: Building Final Format Authoring

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/building-content-occupancy-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-content-occupancy-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked authoring dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed source and workflow files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/master...HEAD | grep -E '\.(ts|js|yml|yaml)$' || true)
          if (( ${#files[@]} > 0 )); then
            pnpm exec prettier --write "${files[@]}"
          fi
      - name: Remove temporary formatting workflow
        run: rm .github/workflows/building-final-format-authoring.yml
      - name: Commit final authored tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format Building Foundation authored files"
          git push origin HEAD:agent/building-content-occupancy-v0-1
