name: Building Input Contract Authoring

on:
  push:
    branches:
      - agent/building-content-occupancy-v0-1

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-content-occupancy-v0-1
          fetch-depth: 0
      - name: Apply guarded Zone presentation contracts
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY' > .authoring-output.txt 2>&1
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one fragment, found {count}')
              file.write_text(text.replace(old, new, 1))

          Path('apps/game/src/zone-building-presentation.ts').write_text("""import type { ZoneToolMode } from './game-tool-mode.js';
          import type { ZoneInputState } from './zone-stroke-controller.js';
          import type { GameZoneInvalidReason, GuardedZoneCandidate } from './zone-building-guard.js';

          export interface GuardedZonePresentation {
            readonly state: ZoneInputState;
            readonly reason: GameZoneInvalidReason | null;
            readonly effectiveCellCount: number;
            readonly invalidCellCount: number;
          }

          export function createGuardedZonePresentation(
            mode: ZoneToolMode | null,
            candidate: GuardedZoneCandidate | null,
          ): GuardedZonePresentation {
            const invalidCellCount =
              candidate === null
                ? 0
                : candidate.invalidReason === 'zone:building-occupied'
                  ? candidate.blockedBuildingCells.length
                  : candidate.corePlan.invalidCells.length;
            return Object.freeze({
              state: Object.freeze({
                mode,
                strokeActive: candidate !== null,
                previewValid: candidate?.valid ?? null,
                previewInvalidReason: candidate?.invalidReason ?? null,
                previewCellCount: candidate?.corePlan.requestedCells.length ?? 0,
              }),
              reason: candidate?.invalidReason ?? null,
              effectiveCellCount:
                candidate?.valid === true ? candidate.corePlan.changedCells.length : 0,
              invalidCellCount,
            });
          }
          """.replace('          ', ''))

          replace_once(
              'apps/game/src/zone-stroke-controller.ts',
              "import type { ZoneToolMode } from './game-tool-mode.js';\n",
              "import type { ZoneToolMode } from './game-tool-mode.js';\nimport type { GameZoneInvalidReason } from './zone-building-guard.js';\n",
          )
          replace_once(
              'apps/game/src/zone-stroke-controller.ts',
              "  readonly previewInvalidReason: ZoneMutationPlan['invalidReason'];\n",
              "  readonly previewInvalidReason: GameZoneInvalidReason | null;\n",
          )

          replace_once(
              'apps/game/src/game-input.ts',
              "import type { GameTerraformInvalidReason } from './terraform-occupancy-guard.js';\n",
              "import type { GameTerraformInvalidReason } from './terraform-occupancy-guard.js';\nimport { createGuardedZonePresentation } from './zone-building-presentation.js';\nimport type { GuardedZoneCandidate, GameZoneInvalidReason } from './zone-building-guard.js';\n",
          )
          replace_once(
              'apps/game/src/game-input.ts',
              """  readonly guardZonePlan?: (plan: ZoneMutationPlan) => {
    readonly previewPlan: ZoneMutationPlan;
    readonly valid: boolean;
    readonly invalidReason: import('./zone-building-guard.js').GameZoneInvalidReason | null;
  };
  readonly onZonePlan: (
    plan: ZoneMutationPlan,
    reason?: import('./zone-building-guard.js').GameZoneInvalidReason | null,
  ) => void;
""",
              """  readonly guardZonePlan?: (plan: ZoneMutationPlan) => GuardedZoneCandidate;
  readonly onZonePlan: (plan: ZoneMutationPlan, reason?: GameZoneInvalidReason | null) => void;
""",
          )
          replace_once(
              'apps/game/src/game-input.ts',
              """    onPreview(baseZones, plan): void {
      const candidate =
        plan === null
          ? null
          : (options.guardZonePlan?.(plan) ??
            Object.freeze({
              previewPlan: plan,
              valid: plan.valid,
              invalidReason: plan.invalidReason,
            }));
      routeZonePreview(options.zonePreview, baseZones, candidate?.previewPlan ?? null);
      dispatchGameToolEvent(
        options.canvas,
        Object.freeze({
          type: 'zone-state',
          state: Object.freeze({
            mode: isZoneToolMode(mode) ? mode : null,
            strokeActive: candidate !== null,
            previewValid: candidate?.valid ?? null,
            previewInvalidReason: plan?.invalidReason ?? null,
            previewCellCount: plan?.requestedCells.length ?? 0,
          }),
          reason: candidate?.invalidReason ?? null,
          effectiveCellCount: candidate?.valid === true ? (plan?.changedCells.length ?? 0) : 0,
          invalidCellCount:
            candidate?.invalidReason === 'zone:building-occupied'
              ? 1
              : (plan?.invalidCells.length ?? 0),
        }),
      );
    },
""",
              """    onPreview(baseZones, plan): void {
      const candidate =
        plan === null
          ? null
          : (options.guardZonePlan?.(plan) ??
            Object.freeze({
              corePlan: plan,
              previewPlan: plan,
              valid: plan.valid,
              invalidReason: plan.invalidReason,
              blockedBuildingCells: Object.freeze([]),
            }));
      routeZonePreview(options.zonePreview, baseZones, candidate?.previewPlan ?? null);
      const presentation = createGuardedZonePresentation(
        isZoneToolMode(mode) ? mode : null,
        candidate,
      );
      dispatchGameToolEvent(
        options.canvas,
        Object.freeze({ type: 'zone-state', ...presentation }),
      );
    },
""",
          )
          replace_once(
              'apps/game/src/game-input.ts',
              """            : (options.guardZonePlan?.(rawPlan) ?? {
                previewPlan: rawPlan,
                valid: rawPlan.valid,
                invalidReason: rawPlan.invalidReason,
              });
""",
              """            : (options.guardZonePlan?.(rawPlan) ??
              Object.freeze({
                corePlan: rawPlan,
                previewPlan: rawPlan,
                valid: rawPlan.valid,
                invalidReason: rawPlan.invalidReason,
                blockedBuildingCells: Object.freeze([]),
              }));
""",
          )
          replace_once(
              'apps/game/src/road-building-guard.ts',
              '  readonly blockedBuildingCells?: readonly CellCoord[];\n',
              '  readonly blockedBuildingCells: readonly CellCoord[];\n',
          )
          print('phase-a:success')
          PY
          status=$?
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$status" -ne 0 ]; then
            git add .authoring-output.txt
            git commit -m 'chore: record Building authoring failure'
            git push origin HEAD:agent/building-content-occupancy-v0-1
            exit 0
          fi
          rm .authoring-output.txt
          rm .github/workflows/building-static-diagnostics.yml
          git add -A
          git commit -m 'fix: route Building-aware Zone presentation'
          git push origin HEAD:agent/building-content-occupancy-v0-1
