name: Building Static Review Corrections

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'agent/building-content-occupancy-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-content-occupancy-v0-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply static-review corrections
        run: node tooling/apply-building-static-review-fixes.mjs
      - name: Remove temporary correction machinery
        run: |
          rm tooling/apply-building-static-review-fixes.mjs
          rm .github/workflows/building-static-review.yml
      - name: Commit corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: align Building integration contracts"
          git push origin HEAD:agent/building-content-occupancy-v0-1
