name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format implementation source
        run: pnpm format
      - name: Persist canonical bootstrap artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/implementation/foundation-architecture-structure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            README.md \
            apps \
            foundation \
            tooling \
            tests \
            architecture.policy.json \
            eslint.config.js \
            package.json \
            playwright.config.ts \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Canonical bootstrap artifacts already persisted."
          else
            git commit -m "chore: normalize bootstrap artifacts"
            git push origin HEAD:implementation/foundation-architecture-structure
          fi
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify repository
        run: pnpm verify
