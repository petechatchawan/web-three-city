name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Format implementation source
        run: pnpm format
      - name: Capture formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source-${{ github.sha }}
          path: |
            .github/workflows/ci.yml
            .husky
            .prettierignore
            README.md
            apps
            foundation
            tooling
            tests
            architecture.policy.json
            eslint.config.js
            package.json
            playwright.config.ts
            pnpm-workspace.yaml
            tsconfig.base.json
          if-no-files-found: error
          retention-days: 1
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify repository
        run: pnpm verify
