name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Diagnostic decomposition of the canonical Lean owner command: pnpm check
      - name: Format remediation sources
        run: |
          pnpm exec prettier --write --log-level silent \
            packages/traffic-core/src/graph-reconciler.ts \
            packages/traffic-core/src/route-planner.ts \
            packages/traffic-three/src/traffic-agent-materializer.ts
      - name: Upload exact formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: prettier-remediation
          path: |
            packages/traffic-core/src/graph-reconciler.ts
            packages/traffic-core/src/route-planner.ts
            packages/traffic-three/src/traffic-agent-materializer.ts
          if-no-files-found: error
      - name: Stop after formatting capture
        run: exit 1
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Check provenance
        run: pnpm provenance:check
      - name: Test architecture boundary
        run: node --test tooling/architecture-boundary.test.mjs
      - name: Test topology
        run: node --test tooling/test-topology.test.mjs
      - name: Test CI topology
        run: node --test tooling/ci-topology.test.mjs
      - name: Test development workflow
        run: node --test tooling/development-workflow.test.mjs
      - name: Test Vercel composition
        run: node --test tooling/compose-vercel-output.test.mjs
      - name: Test Vercel bootstrap
        run: node --test tooling/bootstrap-vercel-project.test.mjs
      - name: Test verification scripts
        run: node --test tooling/verification-scripts.test.mjs
      - name: Test clean-worktree verifier
        run: node --test tooling/verify-clean-worktree.test.mjs
      - name: Test Citizen Mobility core
        run: pnpm --filter @web-three-city/citizen-mobility-core test
      - name: Test Traffic core
        run: pnpm --filter @web-three-city/traffic-core test
      - name: Test Traffic Three
        run: pnpm --filter @web-three-city/traffic-three test
      - name: Test Building Three
        run: pnpm --filter @web-three-city/building-three test
      - name: Test Game
        run: pnpm --filter @web-three-city/game test
      - name: Test remaining package aggregate
        run: pnpm test
      - name: Build packages
        run: pnpm build
      - name: Archive lean build outputs
        run: tar -czf lean-builds.tar.gz apps/game/dist apps/terrain-lab/dist
      - name: Upload lean build outputs
        uses: actions/upload-artifact@v4
        with:
          name: lean-builds
          path: lean-builds.tar.gz
          if-no-files-found: error

  browser:
    name: Full browser verification
    needs: lean
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download lean build outputs
        uses: actions/download-artifact@v4
        with:
          name: lean-builds
      - name: Restore lean build outputs
        run: |
          tar -xzf lean-builds.tar.gz
          test -d apps/game/dist
          test -d apps/terrain-lab/dist
          rm lean-builds.tar.gz
      - run: ./node_modules/.bin/playwright install chromium
      - run: pnpm test:browser:only
      - run: node tooling/verify-clean-worktree.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
