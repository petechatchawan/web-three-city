name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Check provenance
        run: pnpm provenance:check
      - name: Test deployment tooling
        run: pnpm test:deployment
      - name: Test packages
        run: pnpm test
      - name: Build packages
        run: pnpm build
      - name: Archive lean build outputs
        run: tar -czf lean-builds.tar.gz apps/game/dist apps/terrain-lab/dist
      - name: Upload lean build outputs
        uses: actions/upload-artifact@v4
        with:
          name: lean-builds
          path: lean-builds.tar.gz
          if-no-files-found: error

  browser:
    name: Full browser verification
    needs: lean
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download lean build outputs
        uses: actions/download-artifact@v4
        with:
          name: lean-builds
      - name: Restore lean build outputs
        run: |
          tar -xzf lean-builds.tar.gz
          test -d apps/game/dist
          test -d apps/terrain-lab/dist
          rm lean-builds.tar.gz
      - run: ./node_modules/.bin/playwright install chromium
      - run: pnpm test:browser:only
      - run: node tooling/verify-clean-worktree.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
