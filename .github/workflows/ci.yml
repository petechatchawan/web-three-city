name: A12 Bootstrap Preparation

on:
  push:
    branches:
      - reset/product-architecture-clean-slate

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm architecture:check
      - run: pnpm build
      - run: git diff --check
      - name: Persist normalized scaffold and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No normalization or lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(bootstrap): normalize scaffold and pin workspace lockfile"
          git push origin HEAD:reset/product-architecture-clean-slate
