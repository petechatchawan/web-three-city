name: CI

on:
  push:
    branches: ['agent/**']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write "**/*.{ts,js,yml,yaml}"
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @web-three-city/terrain-lab build
      - run: pnpm --filter @web-three-city/game build
      - name: Commit canonical state
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml \
            apps/game/src/main.ts \
            apps/terrain-lab/src/fixture-registry.ts \
            packages/camera-input/test/terrain-picker.test.ts \
            playwright.config.ts
          if git diff --cached --quiet; then
            echo "Canonical state already committed."
          else
            git commit -m "chore: lock dependencies and canonical formatting"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
