name: CI

on:
  push:
    branches: ['agent/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: |
          pnpm exec prettier --write "**/*.{ts,js,yml,yaml}"
          git diff --name-only | tee canonical-changed-files.txt
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @web-three-city/terrain-lab build
      - run: pnpm --filter @web-three-city/game build
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-repository-state
          path: |
            canonical-changed-files.txt
            pnpm-lock.yaml
            .github
            apps
            browser-tests
            packages
            tooling
            eslint.config.js
            package.json
            playwright.config.ts
            tsconfig.base.json
            vitest.workspace.ts
          include-hidden-files: true
          if-no-files-found: error
