name: CI

on:
  push:
    branches: ['agent/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: |
          pnpm exec prettier --write "**/*.{ts,js,yml,yaml}"
          git diff --name-only -- '*.ts' '*.js' '*.yml' '*.yaml' | tee prettier-changed-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-prettier-output
          path: |
            prettier-changed-files.txt
            packages/terrain-three
            packages/camera-input
          include-hidden-files: true
      - run: pnpm lint
      - run: pnpm typecheck
