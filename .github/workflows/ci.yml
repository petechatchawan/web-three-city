name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: building-format-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-closure:
    name: Building format closure
    if: github.head_ref == 'agent/building-content-occupancy-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-content-occupancy-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact failing files
        run: |
          pnpm exec prettier --write \
            apps/game/src/game-input.ts \
            apps/game/src/game-tool-mode-building.test.ts \
            apps/game/src/road-building-frontage-guard.test.ts \
            apps/game/src/zone-building-presentation.test.ts
      - name: Restore standard CI and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/ci.yml \
            apps/game/src/game-input.ts \
            apps/game/src/game-tool-mode-building.test.ts \
            apps/game/src/road-building-frontage-guard.test.ts \
            apps/game/src/zone-building-presentation.test.ts
          git diff --cached --check
          git commit -m 'style: format Building verification sources'
          git push origin HEAD:agent/building-content-occupancy-v0-1
