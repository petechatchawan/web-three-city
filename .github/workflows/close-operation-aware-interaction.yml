name: Close operation-aware interaction

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/close-operation-aware-interaction.yml'

permissions:
  contents: write

concurrency:
  group: close-operation-aware-interaction
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Record closure evidence
        run: python .github/scripts/close-operation-aware-interaction.py

      - name: Remove closure runner
        run: |
          rm -f .github/workflows/close-operation-aware-interaction.yml
          rm -f .github/scripts/close-operation-aware-interaction.py

      - name: Verify final tree
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          spec = Path('docs/superpowers/specs/2026-08-02-operation-aware-road-preview-release-camera-pan-design.md').read_text()
          plan = Path('docs/superpowers/plans/2026-08-02-operation-aware-road-preview-release-camera-pan.md').read_text()
          vercel = json.loads(Path('vercel.json').read_text())

          assert '**Status:** Implemented and verified' in spec
          assert '## Closure Evidence' in spec
          assert '**Execution Status:** Complete and verified' in plan
          assert '## Final Verification Record' in plan
          assert re.search(r'(?m)^- \[ \]', plan) is None
          assert vercel.get('git', {}).get('deploymentEnabled') is False
          assert not Path('.github/workflows/close-operation-aware-interaction.yml').exists()
          assert not Path('.github/scripts/close-operation-aware-interaction.py').exists()
          assert list(Path('.github/workflows').glob('*operation-aware*')) == []
          assert list(Path('.github').glob('operation-aware*trigger')) == []
          PY
          git diff --check

      - name: Commit closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: close operation-aware interaction verification"
          git push origin HEAD:master
