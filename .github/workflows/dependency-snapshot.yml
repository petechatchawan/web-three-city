name: Dependency Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Archive installed dependencies
        run: |
          tar -czf dependency-snapshot.tgz \
            node_modules \
            apps/*/node_modules \
            packages/*/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-dependencies
          path: dependency-snapshot.tgz
          if-no-files-found: error
