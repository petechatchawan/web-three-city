name: Development Workflow v0.1 Bootstrap

on:
  push:
    branches:
      - chore/development-workflow-system-improvement-v0-1

permissions:
  contents: write

concurrency:
  group: development-workflow-v01-bootstrap
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/development-workflow-system-improvement-v0-1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure implementation workspace
        run: |
          set -euo pipefail
          git config user.name "workflow-v0.1-agent"
          git config user.email "workflow-v0.1-agent@users.noreply.github.com"
          pnpm install --frozen-lockfile

      - name: Task 1 — fast-loop contracts and package watch scripts
        run: |
          set -euo pipefail
          cat > tooling/development-workflow.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readdir, readFile } from 'node:fs/promises';
          import { URL } from 'node:url';
          import test from 'node:test';

          const rootUrl = new URL('../', import.meta.url);

          async function readRepoText(path) {
            return readFile(new URL(path, rootUrl), 'utf8');
          }

          async function readRepoJson(path) {
            return JSON.parse(await readRepoText(path));
          }

          async function readWorkspaceManifests() {
            const manifests = [];
            for (const root of ['apps', 'packages']) {
              const rootDirectory = new URL(`${root}/`, rootUrl);
              const entries = await readdir(rootDirectory, { withFileTypes: true });
              for (const entry of entries) {
                if (!entry.isDirectory()) continue;
                const path = `${root}/${entry.name}/package.json`;
                try {
                  manifests.push({ path, packageJson: await readRepoJson(path) });
                } catch (error) {
                  if (error?.code !== 'ENOENT') throw error;
                }
              }
            }
            return manifests;
          }

          const rootPackageJson = await readRepoJson('package.json');

          test('root exposes canonical fast-loop scripts', () => {
            assert.equal(rootPackageJson.scripts.format, 'prettier --write "**/*.{ts,js,yml,yaml}"');
            assert.equal(rootPackageJson.scripts['test:watch'], 'pnpm -r --if-present test:watch');
          });

          test('every Vitest workspace exposes watch mode and non-test workspaces do not get a fake test surface', async () => {
            const manifests = await readWorkspaceManifests();
            let vitestWorkspaceCount = 0;
            for (const { path, packageJson } of manifests) {
              const testScript = packageJson.scripts?.test;
              if (typeof testScript === 'string' && testScript.includes('vitest')) {
                vitestWorkspaceCount += 1;
                assert.equal(packageJson.scripts['test:watch'], 'vitest', path);
              }
            }
            assert.equal(vitestWorkspaceCount, 17);
            const terrainLab = manifests.find(({ packageJson }) => packageJson.name === '@web-three-city/terrain-lab');
            assert.ok(terrainLab);
            assert.equal(terrainLab.packageJson.scripts?.test, undefined);
            assert.equal(terrainLab.packageJson.scripts?.['test:watch'], undefined);
          });

          test('repository-wide tooling gate includes workflow contract tests', () => {
            assert.match(rootPackageJson.scripts['test:deployment'], /development-workflow\.test\.mjs/);
          });
          EOF

          if node --test tooling/development-workflow.test.mjs; then
            echo 'Task 1 RED unexpectedly passed' >&2
            exit 1
          fi
          echo 'Task 1 RED confirmed'

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const write = (path, value) => fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);

          const root = read('package.json');
          root.scripts.format = 'prettier --write "**/*.{ts,js,yml,yaml}"';
          root.scripts['test:watch'] = 'pnpm -r --if-present test:watch';
          if (!root.scripts['test:deployment'].includes('tooling/development-workflow.test.mjs')) {
            root.scripts['test:deployment'] = root.scripts['test:deployment'].replace(
              'node --test ',
              'node --test tooling/development-workflow.test.mjs ',
            );
          }
          write('package.json', root);

          const manifests = [
            'apps/game/package.json',
            'packages/building-core/package.json',
            'packages/building-three/package.json',
            'packages/camera-input/package.json',
            'packages/rci-core/package.json',
            'packages/road-core/package.json',
            'packages/road-three/package.json',
            'packages/shared-testkit/package.json',
            'packages/simulation-core/package.json',
            'packages/terrain-core/package.json',
            'packages/terrain-generator/package.json',
            'packages/terrain-three/package.json',
            'packages/water-core/package.json',
            'packages/water-three/package.json',
            'packages/world-core/package.json',
            'packages/zone-core/package.json',
            'packages/zone-three/package.json',
          ];
          for (const path of manifests) {
            const manifest = read(path);
            manifest.scripts['test:watch'] = 'vitest';
            write(path, manifest);
          }
          NODE

          node --test tooling/development-workflow.test.mjs
          pnpm --filter @web-three-city/rci-core test
          pnpm --filter @web-three-city/rci-core typecheck
          pnpm --filter @web-three-city/rci-core test:watch -- --run

          git add package.json apps/game/package.json packages/*/package.json tooling/development-workflow.test.mjs
          git commit -m "build(workflow): add package fast-loop scripts"
          git push origin HEAD:chore/development-workflow-system-improvement-v0-1

      - name: Task 2 — Husky and lint-staged staged-only guard
        run: |
          set -euo pipefail
          cat >> tooling/development-workflow.test.mjs <<'EOF'

          test('pre-commit setup is staged-only and excludes slow gates', async () => {
            const packageJson = await readRepoJson('package.json');
            const preCommit = await readRepoText('.husky/pre-commit');
            assert.equal(packageJson.scripts.prepare, 'husky');
            assert.equal(typeof packageJson.devDependencies.husky, 'string');
            assert.equal(typeof packageJson.devDependencies['lint-staged'], 'string');
            assert.equal(preCommit.trim(), 'pnpm exec lint-staged');
            const lintStaged = packageJson['lint-staged'];
            assert.deepEqual(lintStaged['*.{ts,js}'], ['prettier --write', 'eslint --fix']);
            assert.equal(lintStaged['*.{mjs,cjs}'], 'eslint --fix');
            assert.equal(lintStaged['*.{yml,yaml}'], 'prettier --write');
            const serializedPolicy = `${preCommit}\n${JSON.stringify(lintStaged)}`;
            assert.doesNotMatch(serializedPolicy, /typecheck|vitest|playwright|pnpm verify|eslint \.|pnpm lint/i);
          });
          EOF

          if node --test tooling/development-workflow.test.mjs; then
            echo 'Task 2 RED unexpectedly passed' >&2
            exit 1
          fi
          echo 'Task 2 RED confirmed'

          pnpm add -Dw husky lint-staged

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const root = JSON.parse(fs.readFileSync(path, 'utf8'));
          root.scripts.prepare = 'husky';
          root['lint-staged'] = {
            '*.{ts,js}': ['prettier --write', 'eslint --fix'],
            '*.{mjs,cjs}': 'eslint --fix',
            '*.{yml,yaml}': 'prettier --write',
          };
          fs.writeFileSync(path, `${JSON.stringify(root, null, 2)}\n`);
          NODE

          mkdir -p .husky
          printf '%s\n' 'pnpm exec lint-staged' > .husky/pre-commit
          chmod +x .husky/pre-commit

          node --test tooling/development-workflow.test.mjs

          cat > tooling/.workflow-hook-smoke.ts <<'EOF'
          export const workflowHookSmoke={ok:true}
          EOF
          git add tooling/.workflow-hook-smoke.ts
          pnpm exec lint-staged
          grep -Fx 'export const workflowHookSmoke = { ok: true };' tooling/.workflow-hook-smoke.ts
          git restore --staged tooling/.workflow-hook-smoke.ts
          rm tooling/.workflow-hook-smoke.ts
          test ! -e tooling/.workflow-hook-smoke.ts

          pnpm install

          git add package.json pnpm-lock.yaml .husky/pre-commit tooling/development-workflow.test.mjs
          git update-index --add --chmod=+x .husky/pre-commit
          git commit -m "build(workflow): add staged pre-commit guard"
          git push origin HEAD:chore/development-workflow-system-improvement-v0-1

      - name: Task 3 — normative root AGENTS guide
        run: |
          set -euo pipefail
          cat >> tooling/development-workflow.test.mjs <<'EOF'

          test('AGENTS defines actionable repository navigation and verification policy', async () => {
            const agents = await readRepoText('AGENTS.md');
            for (const heading of [
              '## Repository Map',
              '## How to Locate Code',
              '## Architecture Rules',
              '## Fast Verification',
              '## Verification Escalation Rules',
              '## Static Level 2 Verification Map',
              '## Branch Policy',
              '## Documentation and Exact-Head Evidence',
              '## Definition of Done',
              '## Forbidden Shortcuts',
            ]) {
              assert.ok(agents.includes(heading), heading);
            }
            assert.match(agents, /pnpm --filter @web-three-city\/<pkg> test/);
            assert.match(agents, /pnpm --filter @web-three-city\/<pkg> typecheck/);
            for (const level of ['Level 0', 'Level 1', 'Level 2', 'Level 3', 'Level 4']) assert.match(agents, new RegExp(level));
            assert.match(agents, /highest required level/i);
            assert.match(agents, /conservative verification map/i);
            assert.match(agents, /same PR/i);
            assert.match(agents, /exact-head/i);
            assert.match(agents, /pnpm verify.*not.*default|not.*default.*pnpm verify/is);
            assert.match(agents, /master.*always-releasable/is);
          });

          test('AGENTS static Level 2 map contains every approved changed-owner row', async () => {
            const agents = await readRepoText('AGENTS.md');
            for (const owner of [
              'world-core', 'terrain-core', 'simulation-core', 'zone-core', 'building-core', 'rci-core',
              'road-core', 'water-core', 'terrain-generator', 'camera-input', 'building-three',
              'road-three', 'terrain-three', 'water-three', 'zone-three',
            ]) {
              assert.match(agents, new RegExp(`\\| \\`${owner}\\` \\|`));
            }
          });

          test('AGENTS makes the exact-head documentation exception normative', async () => {
            const agents = await readRepoText('AGENTS.md');
            assert.match(agents, /living.*documentation.*before.*exact-head/is);
            assert.match(agents, /PR body|PR comment|pull request body|pull request comment/i);
            assert.match(agents, /do not create.*commit.*run ID|do not.*commit.*CI.*metadata/is);
          });
          EOF

          if node --test tooling/development-workflow.test.mjs; then
            echo 'Task 3 RED unexpectedly passed' >&2
            exit 1
          fi
          echo 'Task 3 RED confirmed'

          cat > AGENTS.md <<'EOF'
          # Repository Agent Guide

          ## Repository Map

          `web-three-city` is a TypeScript/Three.js modular-monolith city builder. Navigate by system ownership before editing.

          ```text
          apps/                       runnable composition, UI, and labs
          packages/*-core             deterministic domain/foundation authority
          packages/*-three            Three.js presentation adapters
          packages/camera-input       camera/input adapter utility
          packages/shared-testkit     shared test-only helpers
          packages/terrain-generator  terrain generation domain utility
          tooling/                    repository verification/deployment tooling
          docs/systems/               living system registry/spec/ADR/TDD/verification
          browser-tests/              browser acceptance and release evidence
          ```

          ## How to Locate Code

          Use this path rather than repository-wide search-and-edit when an owning handoff exists:

          ```text
          symptom/request
          → docs/systems/README.md
          → docs/systems/<system>/README.md
          → owning package/app
          → colocated tests
          → implementation
          ```

          ## Architecture Rules

          - `*-core` packages own deterministic domain/foundation behavior and must not depend on DOM or Three.js presentation.
          - `*-three` packages are presentation/adapters. They consume domain snapshots/contracts and do not own gameplay state.
          - `apps/game` composes systems. Cross-system orchestration never justifies circular core-package imports.
          - State authority, Save compatibility, deterministic ordering, and atomic commit behavior must not be weakened by workflow changes.
          - Workspace package dependencies must reflect actual imports and must remain acyclic.

          ## Fast Verification

          Default to the smallest sufficient loop:

          ```bash
          pnpm --filter @web-three-city/<pkg> test:watch
          pnpm --filter @web-three-city/<pkg> test
          pnpm --filter @web-three-city/<pkg> typecheck
          pnpm format
          pnpm verify
          pnpm verify:full
          pnpm test:browser
          ```

          `pnpm verify` is Level 3 and is not the default after each local edit. Use package-scoped tests/typecheck first.

          ## Verification Escalation Rules

          The final gate is determined by these normative rules. Lower levels remain the feedback loop during implementation.

          - **Level 0 — Focused iteration.** Run a focused Vitest file/test name or package `test:watch` while actively editing. Do not run repository-wide verification.
          - **Level 1 — Owning package.** Default localized-code gate: owning package `test` plus `typecheck`.
          - **Level 2 — Affected consumers.** A public/exported contract, exported type, runtime assumption, Save-facing contract, or behavior observable by another package requires at least Level 2. Run the owner and the consumers listed in the static map below.
          - **Level 3 — PR finalization / repository tooling.** Root/workspace/tooling configuration changes, including TypeScript, ESLint, Prettier, Vitest, pnpm workspace, CI workflow, shared verification tooling, or development-dependency configuration, require Level 3. Canonical gate: `pnpm verify`.
          - **Level 4 — Browser/release/milestone closure.** Browser-visible behavior requiring browser acceptance, release closure, milestone closure, or an explicit repository policy requires Level 4. Canonical gate: `pnpm verify:full`.

          Conflict resolution:

          1. The **highest required level wins** as the final gate; lower levels are still used first for fast feedback.
          2. Public/exported contract change implies at least Level 2; never stop at the owner when a consumer can observe the change.
          3. Root/workspace/tooling configuration change implies Level 3.
          4. Browser-visible behavior requiring browser acceptance, release closure, or milestone closure implies Level 4 at finalization.
          5. Save schema/compatibility behavior requires owner + `game` at Level 2 minimum, then the relevant milestone final gate.
          6. A workspace dependency relationship addition/removal that changes consumers must update the Static Level 2 Verification Map in the **same PR**.
          7. Uncertain ownership or impact means escalate one level and inspect the registry/manifests. Do not jump directly to Level 4 merely because of uncertainty.
          8. PR templates cannot redefine escalation; this section is the repository authority.

          ## Static Level 2 Verification Map

          This is a **conservative verification map**, not the architectural dependency graph. Extra verification is acceptable; omitting a real consumer is not.

          | Changed owner | Level 2 verification consumers |
          | --- | --- |
          | `world-core` | `terrain-core`, `road-core`, `water-core`, `zone-core`, `building-core`, `rci-core`, `building-three`, `road-three`, `terrain-three`, `water-three`, `zone-three`, `game`, `terrain-lab` |
          | `terrain-core` | `road-core`, `water-core`, `zone-core`, `building-core`, `road-three`, `terrain-three`, `game`, `terrain-lab` |
          | `simulation-core` | `building-core`, `rci-core`, `game` |
          | `zone-core` | `building-core`, `rci-core`, `zone-three`, `game` |
          | `building-core` | `rci-core`, `building-three`, `game` |
          | `rci-core` | `game` |
          | `road-core` | `road-three`, `game`, `terrain-lab` |
          | `water-core` | `water-three`, `game`, `terrain-lab` |
          | `terrain-generator` | `game`, `terrain-lab` |
          | `camera-input` | `game`, `terrain-lab` |
          | `building-three` | `game` |
          | `road-three` | `game`, `terrain-lab` |
          | `terrain-three` | `game`, `terrain-lab` |
          | `water-three` | `game`, `terrain-lab` |
          | `zone-three` | `game` |

          Maintenance rules:

          - Treat the table as verification policy, not as generated architecture authority.
          - Inspect relevant workspace `package.json` manifests whenever dependency relationships change.
          - Update this map in the same PR as any dependency relationship change that alters consumers.
          - A new package must have ownership and Level 2 consumers assigned before its implementation PR is ready.
          - If a listed consumer has no `test` script, run its available `typecheck`/build gate rather than adding a meaningless no-op test.
          - v0.2 may replace this table with affected/dependent graph tooling; until then this map is authoritative for Level 2 selection.

          ## Branch Policy

          `master` is the always-releasable trunk **by repository policy**. Short-lived `feat/*`, `fix/*`, `docs/*`, and `chore/*` branches merge through pull requests into `master`. A release boundary is an accepted `master` commit and/or Git tag. There is no `develop` integration branch.

          This describes repository policy; do not infer technical branch-protection settings without checking GitHub repository settings.

          ## Documentation and Exact-Head Evidence

          Behavior, public contracts, ownership, dependency direction, Save semantics, and extension-boundary changes must update `docs/systems/<system>/README.md` in the same PR. Required living documentation must already be correct **before exact-head verification** begins.

          Exact-head CI evidence is generated after the candidate exists. Do not create a new commit merely to insert a CI run ID, artifact ID, final count, or equivalent metadata after exact-head verification. Record those facts in the PR body or PR comment when the repository tree does not need to change. A stable verification record may be prepared before the run with acceptance criteria that do not require post-run mutation.

          A bounded post-merge documentation-only closure commit is allowed only when an older milestone contract genuinely requires it; it must not become the normal workflow.

          ## Definition of Done

          - Scope/system ownership is correct and no unrelated behavior is included.
          - Level 0/1 targeted verification was used during implementation and the required final level passed.
          - Required Level 2 consumers were selected from this file, not from memory.
          - Living documentation is synchronized in the same PR.
          - Determinism and Save compatibility are preserved or explicitly addressed where applicable.
          - No temporary/debug artifacts remain.
          - Required final-gate evidence is recorded, including exact candidate SHA when exact-head verification applies.

          ## Forbidden Shortcuts

          - Do not use whole-repository `pnpm verify`/`pnpm verify:full` after every small edit instead of targeted feedback.
          - Do not skip Level 2 for observable public-contract changes.
          - Do not invent downstream consumers from memory when this map and workspace manifests exist.
          - Do not merge with knowingly stale living documentation.
          - Do not make formatter-only cleanup PRs the normal path; use `pnpm format` and the staged hook before commit.
          - Do not put runtime/domain behavior into `*-three` presentation code or into workflow documentation/configuration.
          EOF

          if node --test tooling/development-workflow.test.mjs; then
            :
          else
            echo 'Task 3 GREEN failed' >&2
            exit 1
          fi

          git add AGENTS.md tooling/development-workflow.test.mjs
          git commit -m "docs(workflow): add repository agent guide"
          git push origin HEAD:chore/development-workflow-system-improvement-v0-1

      - name: Task 4 — GitHub bug form and PR template
        run: |
          set -euo pipefail
          cat >> tooling/development-workflow.test.mjs <<'EOF'

          test('bug Issue Form captures system, symptom, expectation, actual behavior, and reproduction', async () => {
            const issueForm = await readRepoText('.github/ISSUE_TEMPLATE/bug_report.yml');
            assert.match(issueForm, /name:\s*Bug report/i);
            assert.match(issueForm, /type:\s*dropdown/);
            assert.match(issueForm, /id:\s*system/);
            for (const system of ['World', 'Terrain', 'Water', 'Roads', 'Zoning', 'Buildings', 'Simulation Time', 'RCI Demand & Occupancy', 'Economy', 'Cross-system / Unknown']) {
              assert.ok(issueForm.includes(system), system);
            }
            for (const id of ['symptom', 'expected', 'actual', 'reproduction']) assert.match(issueForm, new RegExp(`id:\\s*${id}`));
            assert.match(issueForm, /required:\s*true/);
          });

          test('PR template delegates affected-consumer decisions to AGENTS and enforces same-PR docs', async () => {
            const template = await readRepoText('.github/pull_request_template.md');
            assert.match(template, /AGENTS\.md.*Verification Escalation Rules/is);
            assert.match(template, /Targeted package tests/i);
            assert.match(template, /Targeted package typecheck/i);
            assert.match(template, /Affected consumer verification/i);
            assert.match(template, /docs\/systems\/<system>\/README\.md/i);
            assert.match(template, /Behavior.*contracts.*unchanged|documentation update not required/is);
            assert.match(template, /exact.*SHA/i);
            assert.match(template, /debug|temporary/i);
          });
          EOF

          if node --test tooling/development-workflow.test.mjs; then
            echo 'Task 4 RED unexpectedly passed' >&2
            exit 1
          fi
          echo 'Task 4 RED confirmed'

          mkdir -p .github/ISSUE_TEMPLATE
          cat > .github/ISSUE_TEMPLATE/bug_report.yml <<'EOF'
          name: Bug report
          description: Report a reproducible game or system defect
          title: "[Bug]: "
          body:
            - type: dropdown
              id: system
              attributes:
                label: System
                description: Choose the owning system when known.
                options:
                  - World
                  - Terrain
                  - Water
                  - Roads
                  - Zoning
                  - Buildings
                  - Simulation Time
                  - RCI Demand & Occupancy
                  - Economy
                  - Cross-system / Unknown
              validations:
                required: true

            - type: textarea
              id: symptom
              attributes:
                label: Symptom
                description: What did you observe?
              validations:
                required: true

            - type: textarea
              id: expected
              attributes:
                label: Expected behavior
              validations:
                required: true

            - type: textarea
              id: actual
              attributes:
                label: Actual behavior
              validations:
                required: true

            - type: textarea
              id: reproduction
              attributes:
                label: Reproduction steps
                description: Include the smallest repeatable sequence.
              validations:
                required: true

            - type: textarea
              id: state
              attributes:
                label: Save, game time, and environment
                description: Include save version/state, in-game date/time, browser, Node/pnpm, or other relevant context.

            - type: textarea
              id: evidence
              attributes:
                label: Screenshots, console output, or evidence
          EOF

          cat > .github/pull_request_template.md <<'EOF'
          ## Scope

          - System:
          - Owning package(s):
          - Behavior/contract changed:

          ## Verification

          - [ ] Targeted package tests passed.
          - [ ] Targeted package typecheck passed.
          - [ ] Affected consumer verification required by [AGENTS.md § Verification Escalation Rules](../AGENTS.md#verification-escalation-rules) passed.
          - [ ] Relevant browser verification passed when the escalation rules require it.
          - [ ] Final repository/CI evidence is recorded for the required level.

          Commands/results:

          ```text

          ```

          ## Documentation

          - [ ] `docs/systems/<system>/README.md` is updated in this PR; or
          - [ ] Behavior/contracts/ownership/Save/dependency boundaries are unchanged, so a living-documentation update is not required.

          ## Definition of Done

          - [ ] No unrelated changes.
          - [ ] No temporary/debug artifacts.
          - [ ] Determinism and Save compatibility are addressed when applicable.
          - [ ] Exact candidate SHA is recorded when final exact-head verification is required.
          EOF

          node --test tooling/development-workflow.test.mjs
          pnpm exec prettier --check .github/ISSUE_TEMPLATE/bug_report.yml

          git add .github/ISSUE_TEMPLATE/bug_report.yml .github/pull_request_template.md tooling/development-workflow.test.mjs
          git commit -m "chore(github): add workflow issue and PR templates"
          git push origin HEAD:chore/development-workflow-system-improvement-v0-1

      - name: Task 5 — trunk workflow and system registry
        run: |
          set -euo pipefail
          cat >> tooling/development-workflow.test.mjs <<'EOF'

          test('development workflow documents master trunk and package-targeted iteration instead of develop integration', async () => {
            const workflow = await readRepoText('docs/development-workflow.md');
            assert.match(workflow, /master.*always-releasable.*trunk/is);
            assert.match(workflow, /short-lived.*branch.*pull request.*master/is);
            assert.match(workflow, /Verification Ladder/i);
            assert.match(workflow, /AGENTS\.md/);
            assert.match(workflow, /pnpm --filter @web-three-city\/<pkg> test/);
            assert.doesNotMatch(workflow, /develop is the active integration branch/i);
            assert.doesNotMatch(workflow, /target `develop`/i);
          });

          test('system registry reports implemented RCI and the Development Workflow system', async () => {
            const registry = await readRepoText('docs/systems/README.md');
            assert.match(registry, /\[RCI Demand & Occupancy\]\(rci\/README\.md\).*Implemented.*`rci-core`.*`RciSaveV1`.*`WorldSaveV5`/i);
            assert.match(registry, /\[Development Workflow\]\(development-workflow\/README\.md\).*Implemented/i);
          });
          EOF

          if node --test tooling/development-workflow.test.mjs; then
            echo 'Task 5 RED unexpectedly passed' >&2
            exit 1
          fi
          echo 'Task 5 RED confirmed'

          cat > docs/development-workflow.md <<'EOF'
          # Development and Release Workflow

          ## Branch model

          `master` is the always-releasable trunk by repository policy. There is no `develop` integration branch.

          Implementation, fixes, refactors, tests, and documentation use short-lived `feat/*`, `fix/*`, `docs/*`, or `chore/*` branches. Every branch targets `master` through a pull request. Do not infer technical branch-protection enforcement from this policy; check repository settings when enforcement matters.

          ```text
          short-lived feat/* | fix/* | docs/* | chore/*
                            ↓ pull request
          master — always-releasable trunk
                            ↓ accepted production commit / optional Git tag
          Vercel Production — master Git integration
          ```

          ## Verification Ladder

          `AGENTS.md § Verification Escalation Rules` is the normative authority. Use the lowest sufficient level while implementing and the highest required level as the final gate.

          - Level 0 — focused test/watch iteration.
          - Level 1 — owning package `test` + `typecheck`; default localized feedback loop.
          - Level 2 — static affected-consumer verification from `AGENTS.md` when a public/runtime/Save-facing contract can affect consumers.
          - Level 3 — `pnpm verify` for repository/tooling/configuration PR finalization.
          - Level 4 — `pnpm verify:full` for browser acceptance, release closure, milestone closure, or another explicit trigger.

          Canonical package inner loop:

          ```bash
          pnpm --filter @web-three-city/<pkg> test
          pnpm --filter @web-three-city/<pkg> typecheck
          ```

          Do not use `pnpm verify` as the default after every small edit. Escalate according to `AGENTS.md`, not personal or agent memory.

          ## Pull request finalization

          Before a PR is ready:

          - complete the required targeted package/consumer checks;
          - update required `docs/systems/<system>/README.md` living documentation in the same PR;
          - run Level 3 when root/workspace/tooling policy requires it;
          - run Level 4 only when the escalation rules require browser/release/milestone closure;
          - keep the tree free of debug and temporary artifacts.

          For Level 4, commit the complete candidate first and verify that exact clean head. Final CI run IDs, artifacts, and counts may be recorded in the PR body/comment without creating a new metadata-only commit that invalidates the verified SHA.

          ## Vercel deployment policy

          Vercel Production Branch remains `master`. The repository's `vercel.json` disables automatic Git deployment for non-production branches and enables `master`; implementation branches therefore do not become Production merely because they receive commits.

          Production flow:

          ```text
          accepted PR → master
                     ↓
          Vercel Git Integration
                     ↓
          Production deployment
          ```

          A Git tag may mark a release boundary on an accepted `master` commit; it does not replace the trunk or introduce a release branch.

          ## Exact-head evidence

          When Level 4 applies, evidence must identify the exact candidate SHA and the actual required verification result. A tree change after successful exact-head verification creates a new candidate and requires the relevant verification again. Metadata-only PR updates do not change the tree and are the preferred place for post-run CI identifiers.
          EOF

          python <<'PY'
          from pathlib import Path
          p = Path('docs/systems/README.md')
          lines = p.read_text().splitlines()
          out = []
          inserted = False
          for line in lines:
              if line.startswith('| [RCI Demand & Occupancy]'):
                  line = '| [RCI Demand & Occupancy](rci/README.md) | Implemented | `rci-core` + `apps/game` orchestration | `RciSaveV1` / `WorldSaveV5` |'
              out.append(line)
              if line.startswith('| [Economy]') and not any('[Development Workflow]' in x for x in lines):
                  out.append('| [Development Workflow](development-workflow/README.md) | Implemented | root configuration, `.github/`, `AGENTS.md`, development docs | Git-tracked configuration and documentation |')
                  inserted = True
          p.write_text('\n'.join(out) + '\n')
          PY

          node --test tooling/development-workflow.test.mjs

          git add docs/development-workflow.md docs/systems/README.md tooling/development-workflow.test.mjs
          git commit -m "docs(workflow): align trunk workflow and system registry"
          git push origin HEAD:chore/development-workflow-system-improvement-v0-1

