name: Development Workflow v0.1 dependency cleanup

on:
  push:
    branches:
      - chore/development-workflow-system-improvement-v0-1

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/development-workflow-system-improvement-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate dependency state with Node-compatible versions
        run: |
          set -euo pipefail
          git config user.name 'workflow-v0.1-agent'
          git config user.email 'workflow-v0.1-agent@users.noreply.github.com'
          pnpm add -Dw --save-exact husky@9.1.7 lint-staged@16.2.4
          git rm .github/workflows/dev-workflow-v01-dependency-cleanup.yml
          git add package.json pnpm-lock.yaml
          git commit -m 'build(workflow): align pre-commit dependencies with Node baseline'
          git push origin HEAD:chore/development-workflow-system-improvement-v0-1
