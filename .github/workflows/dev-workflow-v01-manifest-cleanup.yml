name: Development Workflow v0.1 manifest cleanup

on:
  push:
    branches:
      - chore/development-workflow-system-improvement-v0-1

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/development-workflow-system-improvement-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize manifests and lockfile
        run: |
          set -euo pipefail
          git config user.name 'workflow-v0.1-agent'
          git config user.email 'workflow-v0.1-agent@users.noreply.github.com'

          pnpm remove -Dw husky lint-staged
          pnpm add -Dw -E husky@9.1.7 lint-staged@16.2.4

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const write = (path, value) => fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);

          const root = read('package.json');
          const s = root.scripts;
          root.scripts = {
            build: s.build,
            prepare: 'husky',
            'build:browser': s['build:browser'],
            'bootstrap:vercel': s['bootstrap:vercel'],
            'compose:vercel': s['compose:vercel'],
            typecheck: s.typecheck,
            'typecheck:browser': s['typecheck:browser'],
            lint: s.lint,
            format: s.format,
            'format:check': s['format:check'],
            'provenance:check': s['provenance:check'],
            test: s.test,
            'test:watch': s['test:watch'],
            'test:coverage': s['test:coverage'],
            'test:deployment': s['test:deployment'],
            'test:browser': s['test:browser'],
            'test:browser:only': s['test:browser:only'],
            check: s.check,
            verify: s.verify,
            'verify:full': s['verify:full'],
          };
          const d = root.devDependencies;
          root.devDependencies = {
            '@eslint/js': d['@eslint/js'],
            '@playwright/test': d['@playwright/test'],
            '@vitest/coverage-v8': d['@vitest/coverage-v8'],
            eslint: d.eslint,
            husky: d.husky,
            'lint-staged': d['lint-staged'],
            'happy-dom': d['happy-dom'],
            prettier: d.prettier,
            typescript: d.typescript,
            'typescript-eslint': d['typescript-eslint'],
            vite: d.vite,
            vitest: d.vitest,
            '@types/node': d['@types/node'],
            '@types/three': d['@types/three'],
            three: d.three,
          };
          write('package.json', root);

          const manifests = [
            'apps/game/package.json',
            'packages/building-core/package.json',
            'packages/building-three/package.json',
            'packages/camera-input/package.json',
            'packages/rci-core/package.json',
            'packages/road-core/package.json',
            'packages/road-three/package.json',
            'packages/shared-testkit/package.json',
            'packages/simulation-core/package.json',
            'packages/terrain-core/package.json',
            'packages/terrain-generator/package.json',
            'packages/terrain-three/package.json',
            'packages/water-core/package.json',
            'packages/water-three/package.json',
            'packages/world-core/package.json',
            'packages/zone-core/package.json',
            'packages/zone-three/package.json',
          ];

          for (const path of manifests) {
            const manifest = read(path);
            const ordered = {};
            for (const [key, value] of Object.entries(manifest.scripts)) {
              if (key === 'test:watch') continue;
              ordered[key] = value;
              if (key === 'test') ordered['test:watch'] = 'vitest';
            }
            manifest.scripts = ordered;
            let text = `${JSON.stringify(manifest, null, 2)}\n`;
            if (path === 'packages/terrain-core/package.json') {
              text = text.replace(
                '"dependencies": {\n    "@web-three-city/world-core": "workspace:*"\n  },',
                '"dependencies": { "@web-three-city/world-core": "workspace:*" },',
              );
            }
            fs.writeFileSync(path, text);
          }
          NODE

          pnpm install --frozen-lockfile
          node --test tooling/development-workflow.test.mjs

          git rm .github/workflows/dev-workflow-v01-manifest-cleanup.yml
          git add package.json pnpm-lock.yaml apps/game/package.json packages/*/package.json
          git commit -m 'build(workflow): normalize manifest changes'
          git push origin HEAD:chore/development-workflow-system-improvement-v0-1
