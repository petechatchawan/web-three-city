name: Development Workflow v0.1 Task 6 status finalization

on:
  push:
    branches:
      - chore/development-workflow-system-improvement-v0-1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/development-workflow-system-improvement-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize Task 6 historical status annotations
        run: |
          set -euo pipefail
          git config user.name 'workflow-v0.1-agent'
          git config user.email 'workflow-v0.1-agent@users.noreply.github.com'

          python <<'PY'
          from pathlib import Path

          spec = Path('docs/systems/development-workflow/specs/2026-08-07-development-workflow-system-improvement-v0-1.md')
          text = spec.read_text()
          text = text.replace('**Status:** Approved  ', '**Status:** Implemented  ', 1)
          note = 'Implementation delivery note: v0.1 was delivered from this approved design without changing its scope or historical decisions.\n'
          if note not in text:
              marker = '**Date:** `2026-08-07`\n'
              text = text.replace(marker, marker + '\n' + note, 1)
          spec.write_text(text)

          plan = Path('docs/systems/development-workflow/tdd/2026-08-07-development-workflow-system-improvement-v0-1.md')
          text = plan.read_text()
          heading = '## Execution Status\n'
          if heading not in text:
              anchor = '**Tech Stack:** Node.js 22, pnpm 10.13.1 workspaces, Vitest 4, TypeScript 6, ESLint 9, Prettier 3, Husky, lint-staged, GitHub Issue Forms, GitHub pull-request templates, Node built-in `node:test` for repository workflow contract tests.\n'
              status = '''\n## Execution Status\n\n- Tasks 1–6: implemented on `chore/development-workflow-system-improvement-v0-1` through PR #35.\n- Task 7: exact-head Level 3/4 verification and merge closure remain pending.\n- Required living documentation is complete before the final exact-head candidate; post-run CI metadata belongs in PR #35 rather than a metadata-only tree mutation.\n- The approved task definitions below are preserved as the execution record; this status annotation does not rewrite their historical RED/GREEN instructions.\n'''
              text = text.replace(anchor, anchor + status, 1)
          plan.write_text(text)
          PY

          node --test tooling/development-workflow.test.mjs tooling/verification-scripts.test.mjs

          git rm .github/workflows/dev-workflow-v01-task6-status.yml
          git add docs/systems/development-workflow/specs/2026-08-07-development-workflow-system-improvement-v0-1.md docs/systems/development-workflow/tdd/2026-08-07-development-workflow-system-improvement-v0-1.md
          git commit -m 'docs(workflow): record v0.1 implementation status'
          git push origin HEAD:chore/development-workflow-system-improvement-v0-1
