name: Apply automatic growth interaction fix

on:
  push:
    branches:
      - agent/building-growth-runtime-v0-1

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-runtime-v0-1
          fetch-depth: 0

      - name: Patch automatic growth integration
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one literal match, found {count}')
              path.write_text(text.replace(old, new))

          def replace_regex_once(path: Path, pattern: str, replacement: str) -> None:
              text = path.read_text()
              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex match, found {count}: {pattern}')
              path.write_text(updated)

          bootstrap = Path('apps/game/src/game-bootstrap.ts')
          replace_once(
              bootstrap,
              """export interface GameRuntime {
            dispose(): void;
          }
          """,
              """export interface GameRuntime {
            runAutomaticBuildingPass(): void;
            dispose(): void;
          }
          """,
          )
          replace_once(
              bootstrap,
              '    return { dispose(): void {} };',
              '    return { runAutomaticBuildingPass(): void {}, dispose(): void {} };',
          )

          building_block = """  const commitBuildingPlan = (
            plan: BuildingMutationPlan,
            interaction: 'interactive' | 'background',
          ): void => {
            const interactive = interaction === 'interactive';
            if (interactive) buildingInvalidReason = plan.invalidReason;
            if (!plan.valid) {
              if (interactive) {
                ui.setStatus(statusForBuildingPlan(plan));
                ui.setUndoAvailable(undoStore.available);
              }
              return;
            }
            const before = buildingsSnapshot;
            if (interactive) dispatchGameTransactionState(ui.canvas, 'committing', 'building');
            try {
              const committed = commitBuildingMutation(
                buildingsSnapshot,
                plan,
                buildingEnvironment,
                WORLD_CONFIG,
              );
              buildingsSnapshot = committed.snapshot;
              buildingPresentation.load(buildingsSnapshot);
              zoneEnvironment = createZonePlacementEnvironment(
                snapshot,
                waterSnapshot,
                roadsSnapshot,
                createBuildingWorldOccupancy(buildingsSnapshot),
                WORLD_CONFIG,
              );
              undoStore.replace({ kind: 'building', buildings: before });
              if (plan.operation === 'develop') buildingCommitCount += 1;
              else buildingBulldozeCount += 1;
              buildingInvalidReason = null;
              ui.setBuildingCount(buildingCount(buildingsSnapshot));
              if (interactive) ui.setStatus(statusForBuildingPlan(plan));
            } catch {
              if (interactive) ui.setStatus('Building update failed');
            }
            if (interactive) ui.setUndoAvailable(undoStore.available);
          };

          const applyBuildingRequest = (mode: BuildingToolMode, cell: CellCoord): void => {
            const plan =
              mode === 'building-develop'
                ? planBuildingDevelopment(buildingsSnapshot, buildingEnvironment, WORLD_CONFIG)
                : planBuildingBulldoze(buildingsSnapshot, cell, buildingEnvironment, WORLD_CONFIG);
            commitBuildingPlan(plan, 'interactive');
          };

          const runAutomaticBuildingPass = (): void => {
            const plan = planBuildingDevelopment(buildingsSnapshot, buildingEnvironment, WORLD_CONFIG);
            commitBuildingPlan(plan, 'background');
          };

          const resetCamera"""
          replace_regex_once(
              bootstrap,
              r"  const applyBuildingRequest = .*?\n  const resetCamera",
              building_block,
          )
          replace_regex_once(
              bootstrap,
              r'^\s*return \{ dispose \};$',
              '  return { runAutomaticBuildingPass, dispose };',
          )

          main = Path('apps/game/src/main.ts')
          replace_once(main, 'let automaticPointerId = 10_000;\n', '')
          replace_regex_once(
              main,
              r"function dispatchAutomaticBuildingPass\(\): void \{.*?\n\}\n\nfunction shouldRunAutomaticBuildingPass",
              """function dispatchAutomaticBuildingPass(): void {
            runtime.runAutomaticBuildingPass();
          }

          function shouldRunAutomaticBuildingPass""",
          )
          PY

          rm .github/workflows/fix-automatic-growth-tool-interruption.yml

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src/game-bootstrap.ts apps/game/src/main.ts .github/workflows/fix-automatic-growth-tool-interruption.yml
          git commit -m 'fix: preserve active tool during automatic growth'
          git push origin HEAD:agent/building-growth-runtime-v0-1
