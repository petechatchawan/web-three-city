name: Fix background Growth isolation

on:
  push:
    branches:
      - agent/building-growth-runtime-v0-1

permissions:
  contents: write

concurrency:
  group: fix-background-growth-isolation
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-runtime-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Add active-stroke regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('browser-tests/growth.spec.ts')
          text = path.read_text()

          old_import = "import { prepareBuildingFixtureWorld } from './helpers/building-fixture.js';"
          new_import = """import {
            BUILDING_FIXTURES,
            pointFor,
            prepareBuildingFixtureWorld,
          } from './helpers/building-fixture.js';"""
          if text.count(old_import) != 1:
              raise SystemExit('growth.spec import anchor mismatch')
          text = text.replace(old_import, new_import)

          old_test = """test('automatic Growth preserves the active Zoning tool', async ({ page }) => {
            await openGrowthGame(page);
            await prepareBuildingFixtureWorld(page);
            const industrialButton = page.getByRole('button', { name: 'Industrial', exact: true });
            await industrialButton.click();
            await expect(page.getByTestId('active-tool')).toHaveText('Industrial Zone');
            await expect(industrialButton).toHaveAttribute('aria-pressed', 'true');

            const snapshot = await stepLogicalTicks(page, 4);

            expect(snapshot.simulation.absoluteTick).toBe(12);
            expect(snapshot.simulation.growthSequence).toBe(1);
            expect(snapshot.buildingCount).toBe(1);
            await expect(page.getByTestId('active-tool')).toHaveText('Industrial Zone');
            await expect(industrialButton).toHaveAttribute('aria-pressed', 'true');
          });"""
          new_test = """test('automatic Growth preserves the active Zoning tool and in-progress stroke', async ({
            page,
          }) => {
            await openGrowthGame(page);
            const points = await prepareBuildingFixtureWorld(page);
            const industrialButton = page.getByRole('button', { name: 'Industrial', exact: true });
            await industrialButton.click();
            await expect(page.getByTestId('active-tool')).toHaveText('Industrial Zone');
            await expect(industrialButton).toHaveAttribute('aria-pressed', 'true');

            await page.evaluate(() => {
              const canvas = document.querySelector<HTMLCanvasElement>('#game-canvas');
              const navigate = document.querySelector<HTMLButtonElement>(
                '[data-action=\"tool-navigate\"]',
              );
              const develop = document.querySelector<HTMLButtonElement>(
                '[data-action=\"tool-building-develop\"]',
              );
              const status = document.querySelector<HTMLElement>('[data-testid=\"game-status\"]');
              if (canvas === null || navigate === null || develop === null || status === null) {
                throw new Error('growth:missing-isolation-probe-target');
              }
              const probe = {
                navigateClicks: 0,
                developClicks: 0,
                buildingTransactions: 0,
                statusValues: [] as string[],
              };
              navigate.addEventListener('click', () => {
                probe.navigateClicks += 1;
              });
              develop.addEventListener('click', () => {
                probe.developClicks += 1;
              });
              canvas.addEventListener('web-three-city:game-tool-presentation', (event) => {
                const detail = (
                  event as CustomEvent<{ readonly type?: string; readonly domain?: string }>
                ).detail;
                if (detail?.type === 'transaction-state' && detail.domain === 'building') {
                  probe.buildingTransactions += 1;
                }
              });
              new MutationObserver(() => {
                probe.statusValues.push(status.textContent?.trim() ?? '');
              }).observe(status, { childList: true, characterData: true, subtree: true });
              (
                window as Window & {
                  __WEB_THREE_CITY_GROWTH_ISOLATION_PROBE__?: typeof probe;
                }
              ).__WEB_THREE_CITY_GROWTH_ISOLATION_PROBE__ = probe;
            });

            const start = pointFor(points, BUILDING_FIXTURES.industrial.zoneCells[0]);
            const end = pointFor(points, BUILDING_FIXTURES.industrial.zoneCells[1]);
            const status = page.getByTestId('game-status');
            const undo = page.getByTestId('undo-world-change');
            const statusBeforeGrowth = (await status.textContent()) ?? '';
            const undoDisabledBeforeGrowth = await undo.isDisabled();

            await page.mouse.move(start.x, start.y);
            await page.mouse.down();
            await expect
              .poll(() =>
                page.evaluate(
                  () => window.__WEB_THREE_CITY_INTERACTION__?.zone.strokeActive ?? false,
                ),
              )
              .toBe(true);

            await page.evaluate(() => {
              const timeWindow = window as Window & {
                __WEB_THREE_CITY_TIME__?: {
                  setSpeed(speed: 'paused' | 'normal' | 'fast' | 'faster'): void;
                };
              };
              timeWindow.__WEB_THREE_CITY_TIME__?.setSpeed('faster');
            });
            await expect
              .poll(async () => (await readTimeSnapshot(page)).simulation.absoluteTick, {
                timeout: 5_000,
              })
              .toBeGreaterThanOrEqual(12);
            await page.evaluate(() => {
              const timeWindow = window as Window & {
                __WEB_THREE_CITY_TIME__?: {
                  setSpeed(speed: 'paused' | 'normal' | 'fast' | 'faster'): void;
                };
              };
              timeWindow.__WEB_THREE_CITY_TIME__?.setSpeed('paused');
            });

            const snapshot = await readTimeSnapshot(page);
            expect(snapshot.simulation.absoluteTick).toBeGreaterThanOrEqual(12);
            expect(snapshot.simulation.growthSequence).toBeGreaterThanOrEqual(1);
            expect(snapshot.buildingCount).toBeGreaterThanOrEqual(1);
            await expect(page.getByTestId('active-tool')).toHaveText('Industrial Zone');
            await expect(industrialButton).toHaveAttribute('aria-pressed', 'true');
            await expect
              .poll(() =>
                page.evaluate(
                  () => window.__WEB_THREE_CITY_INTERACTION__?.zone.strokeActive ?? false,
                ),
              )
              .toBe(true);
            await expect(status).toHaveText(statusBeforeGrowth);
            await expect(status).not.toHaveText('Zones developed');
            expect(await undo.isDisabled()).toBe(undoDisabledBeforeGrowth);

            const probe = await page.evaluate(() => {
              const value = (
                window as Window & {
                  __WEB_THREE_CITY_GROWTH_ISOLATION_PROBE__?: {
                    readonly navigateClicks: number;
                    readonly developClicks: number;
                    readonly buildingTransactions: number;
                    readonly statusValues: readonly string[];
                  };
                }
              ).__WEB_THREE_CITY_GROWTH_ISOLATION_PROBE__;
              if (value === undefined) throw new Error('growth:missing-isolation-probe');
              return value;
            });
            expect(probe.navigateClicks).toBe(0);
            expect(probe.developClicks).toBe(0);
            expect(probe.buildingTransactions).toBe(0);
            expect(probe.statusValues).not.toContain('Zones developed');

            await page.mouse.move(end.x, end.y);
            await page.mouse.up();
            await expect(page.getByTestId('active-tool')).toHaveText('Industrial Zone');
            await expect(industrialButton).toHaveAttribute('aria-pressed', 'true');
          });"""
          if text.count(old_test) != 1:
              raise SystemExit('growth.spec test anchor mismatch')
          path.write_text(text.replace(old_test, new_test))
          PY
          pnpm exec prettier --write browser-tests/growth.spec.ts

      - name: Reproduce against previous runtime boundary
        id: red
        continue-on-error: true
        run: >-
          pnpm exec playwright test browser-tests/growth.spec.ts
          --grep "automatic Growth preserves the active Zoning tool and in-progress stroke"
          --workers=2

      - name: Replace interactive bridge with background transaction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor mismatch: {count}')
              return text.replace(old, new)

          bootstrap_path = Path('apps/game/src/game-bootstrap.ts')
          bootstrap = bootstrap_path.read_text()
          bootstrap = replace_once(
              bootstrap,
              "import { OrthographicCameraRig } from '@web-three-city/camera-input';\n",
              "import { OrthographicCameraRig } from '@web-three-city/camera-input';\nimport type { SimulationSnapshot } from '@web-three-city/simulation-core';\n",
              'bootstrap simulation import',
          )
          bootstrap = replace_once(
              bootstrap,
              "import { WorldUndoStore, type WorldUndoEntry } from './world-undo.js';\n",
              "import { executeWorldGrowthTick } from './world-growth-transaction.js';\nimport { WorldUndoStore, type WorldUndoEntry } from './world-undo.js';\n",
              'bootstrap growth transaction import',
          )
          bootstrap = replace_once(
              bootstrap,
              """export interface GameRuntime {
            runAutomaticBuildingPass(): void;
            dispose(): void;
          }""",
              """export interface GameRuntime {
            runBackgroundGrowthTick(simulation: SimulationSnapshot): SimulationSnapshot;
            dispose(): void;
          }""",
              'runtime interface',
          )
          bootstrap = replace_once(
              bootstrap,
              "return { runAutomaticBuildingPass(): void {}, dispose(): void {} };",
              """return {
                runBackgroundGrowthTick(simulation: SimulationSnapshot): SimulationSnapshot {
                  return simulation;
                },
                dispose(): void {},
              };""",
              'unsupported runtime',
          )

          old_boundary = """  const commitBuildingPlan = (
            plan: BuildingMutationPlan,
            interaction: 'interactive' | 'background',
          ): void => {
            const interactive = interaction === 'interactive';
            if (interactive) buildingInvalidReason = plan.invalidReason;
            if (!plan.valid) {
              if (interactive) {
                ui.setStatus(statusForBuildingPlan(plan));
                ui.setUndoAvailable(undoStore.available);
              }
              return;
            }
            const before = buildingsSnapshot;
            if (interactive) dispatchGameTransactionState(ui.canvas, 'committing', 'building');
            try {
              const committed = commitBuildingMutation(
                buildingsSnapshot,
                plan,
                buildingEnvironment,
                WORLD_CONFIG,
              );
              buildingsSnapshot = committed.snapshot;
              buildingPresentation.load(buildingsSnapshot);
              zoneEnvironment = createZonePlacementEnvironment(
                snapshot,
                waterSnapshot,
                roadsSnapshot,
                createBuildingWorldOccupancy(buildingsSnapshot),
                WORLD_CONFIG,
              );
              undoStore.replace({ kind: 'building', buildings: before });
              if (plan.operation === 'develop') buildingCommitCount += 1;
              else buildingBulldozeCount += 1;
              buildingInvalidReason = null;
              ui.setBuildingCount(buildingCount(buildingsSnapshot));
              if (interactive) ui.setStatus(statusForBuildingPlan(plan));
            } catch {
              if (interactive) ui.setStatus('Building update failed');
            }
            if (interactive) ui.setUndoAvailable(undoStore.available);
          };

          const applyBuildingRequest = (mode: BuildingToolMode, cell: CellCoord): void => {
            const plan =
              mode === 'building-develop'
                ? planBuildingDevelopment(buildingsSnapshot, buildingEnvironment, WORLD_CONFIG)
                : planBuildingBulldoze(buildingsSnapshot, cell, buildingEnvironment, WORLD_CONFIG);
            commitBuildingPlan(plan, 'interactive');
          };

          const runAutomaticBuildingPass = (): void => {
            const plan = planBuildingDevelopment(buildingsSnapshot, buildingEnvironment, WORLD_CONFIG);
            commitBuildingPlan(plan, 'background');
          };"""
          new_boundary = """  const commitBuildingPlan = (plan: BuildingMutationPlan): void => {
            buildingInvalidReason = plan.invalidReason;
            if (!plan.valid) {
              ui.setStatus(statusForBuildingPlan(plan));
              ui.setUndoAvailable(undoStore.available);
              return;
            }
            const before = buildingsSnapshot;
            dispatchGameTransactionState(ui.canvas, 'committing', 'building');
            try {
              const committed = commitBuildingMutation(
                buildingsSnapshot,
                plan,
                buildingEnvironment,
                WORLD_CONFIG,
              );
              buildingsSnapshot = committed.snapshot;
              buildingPresentation.load(buildingsSnapshot);
              zoneEnvironment = createZonePlacementEnvironment(
                snapshot,
                waterSnapshot,
                roadsSnapshot,
                createBuildingWorldOccupancy(buildingsSnapshot),
                WORLD_CONFIG,
              );
              undoStore.replace({ kind: 'building', buildings: before });
              if (plan.operation === 'develop') buildingCommitCount += 1;
              else buildingBulldozeCount += 1;
              buildingInvalidReason = null;
              ui.setBuildingCount(buildingCount(buildingsSnapshot));
              ui.setStatus(statusForBuildingPlan(plan));
            } catch {
              ui.setStatus('Building update failed');
            }
            ui.setUndoAvailable(undoStore.available);
          };

          const applyBuildingRequest = (mode: BuildingToolMode, cell: CellCoord): void => {
            const plan =
              mode === 'building-develop'
                ? planBuildingDevelopment(buildingsSnapshot, buildingEnvironment, WORLD_CONFIG)
                : planBuildingBulldoze(buildingsSnapshot, cell, buildingEnvironment, WORLD_CONFIG);
            commitBuildingPlan(plan);
          };

          const runBackgroundGrowthTick = (simulation: SimulationSnapshot): SimulationSnapshot => {
            const result = executeWorldGrowthTick({
              state: Object.freeze({ simulation, buildings: buildingsSnapshot }),
              environment: buildingEnvironment,
              config: WORLD_CONFIG,
            });
            if (result.buildings.revision !== buildingsSnapshot.revision) {
              buildingsSnapshot = result.buildings;
              buildingPresentation.load(buildingsSnapshot);
              zoneEnvironment = createZonePlacementEnvironment(
                snapshot,
                waterSnapshot,
                roadsSnapshot,
                createBuildingWorldOccupancy(buildingsSnapshot),
                WORLD_CONFIG,
              );
              buildingCommitCount += 1;
              ui.setBuildingCount(buildingCount(buildingsSnapshot));
            }
            return result.simulation;
          };"""
          bootstrap = replace_once(bootstrap, old_boundary, new_boundary, 'building runtime boundary')
          bootstrap = replace_once(
              bootstrap,
              'return { runAutomaticBuildingPass, dispose };',
              'return { runBackgroundGrowthTick, dispose };',
              'runtime return',
          )
          bootstrap_path.write_text(bootstrap)

          main_path = Path('apps/game/src/main.ts')
          main = main_path.read_text()
          main = replace_once(
              main,
              """import {
            configureAutomaticBuildingGrowth,
            constructionProgressAtTick,
            createEmptyBuildingSnapshot,
          } from '@web-three-city/building-core';""",
              """import {
            constructionProgressAtTick,
            createEmptyBuildingSnapshot,
          } from '@web-three-city/building-core';""",
              'main building import',
          )
          main = replace_once(
              main,
              """  createInitialSimulationSnapshot,
            createSimulationSnapshot,
            isDevelopmentEvaluationTick,
            type SimulationSnapshot,""",
              """  createInitialSimulationSnapshot,
            createSimulationSnapshot,
            type SimulationSnapshot,""",
              'main simulation import',
          )
          old_tick = """function dispatchAutomaticBuildingPass(): void {
            runtime.runAutomaticBuildingPass();
          }

          function shouldRunAutomaticBuildingPass(): boolean {
            if (!automaticGrowthEnabled) return false;
            const dueConstruction = currentBuildings().instances.some(
              (instance) =>
                instance.lifecycle === 'construction' &&
                instance.constructionCompletesAtTick <= simulation.absoluteTick,
            );
            const zonedCellCount = window.__WEB_THREE_CITY_INTERACTION__?.zone.counts.total ?? 0;
            return (
              dueConstruction || (zonedCellCount > 0 && isDevelopmentEvaluationTick(simulation.absoluteTick))
            );
          }

          function advanceOneLogicalTick(): void {
            simulation = createSimulationSnapshot({
              revision: simulation.revision + 1,
              absoluteTick: simulation.absoluteTick + 1,
              growthSequence: simulation.growthSequence,
            });
            setBuildingPresentationAbsoluteTick(simulation.absoluteTick);

            if (shouldRunAutomaticBuildingPass()) {
              const expectedInstanceId = `building:growth:${simulation.growthSequence + 1}`;
              const beforeIds = new Set(currentBuildings().instances.map((instance) => instance.instanceId));
              configureAutomaticBuildingGrowth({
                absoluteTick: simulation.absoluteTick,
                growthSequence: simulation.growthSequence,
                evaluation: isDevelopmentEvaluationTick(simulation.absoluteTick),
              });
              try {
                dispatchAutomaticBuildingPass();
              } finally {
                configureAutomaticBuildingGrowth(null);
              }
              const afterIds = new Set(currentBuildings().instances.map((instance) => instance.instanceId));
              if (!beforeIds.has(expectedInstanceId) && afterIds.has(expectedInstanceId)) {
                simulation = createSimulationSnapshot({
                  revision: simulation.revision,
                  absoluteTick: simulation.absoluteTick,
                  growthSequence: simulation.growthSequence + 1,
                });
              }
            }

            refreshConstructionPhaseIfNeeded();
            refreshTimeUi();
          }"""
          new_tick = """function advanceOneLogicalTick(): void {
            simulation = automaticGrowthEnabled
              ? runtime.runBackgroundGrowthTick(simulation)
              : createSimulationSnapshot({
                  revision: simulation.revision + 1,
                  absoluteTick: simulation.absoluteTick + 1,
                  growthSequence: simulation.growthSequence,
                });
            setBuildingPresentationAbsoluteTick(simulation.absoluteTick);
            refreshConstructionPhaseIfNeeded();
            refreshTimeUi();
          }"""
          main = replace_once(main, old_tick, new_tick, 'main tick scheduler')
          main = replace_once(
              main,
              '  configureAutomaticBuildingGrowth(null);\n',
              '',
              'main reset bridge',
          )
          main_path.write_text(main)
          PY
          pnpm exec prettier --write apps/game/src/game-bootstrap.ts apps/game/src/main.ts

      - name: Verify targeted regression
        run: >-
          pnpm exec playwright test browser-tests/growth.spec.ts
          --grep "automatic Growth preserves the active Zoning tool and in-progress stroke"
          --workers=2

      - name: Verify complete workspace
        run: pnpm verify:full

      - name: Commit verified fix and remove helper
        run: |
          rm .github/workflows/fix-background-growth-isolation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src/game-bootstrap.ts apps/game/src/main.ts browser-tests/growth.spec.ts .github/workflows/fix-background-growth-isolation.yml
          git commit -m 'fix: isolate automatic Growth from active tools'
          git push origin HEAD:agent/building-growth-runtime-v0-1
