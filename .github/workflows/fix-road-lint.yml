name: Fix Road Lint

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: fix-road-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.number == 11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply targeted lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('apps/terrain-lab/src/fixture-registry.ts'): [
                  ("  BASIC_ROAD_CODE,\n", ""),
              ],
              Path('browser-tests/road.spec.ts'): [
                  ("  type TerrainSnapshot,\n", ""),
              ],
              Path('tooling/verification-scripts.test.mjs'): [
                  (
                      "import { readFile } from 'node:fs/promises';\n",
                      "import { readFile } from 'node:fs/promises';\nimport { URL } from 'node:url';\n",
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/terrain-lab/src/fixture-registry.ts browser-tests/road.spec.ts tooling/verification-scripts.test.mjs
      - run: pnpm lint
      - name: Commit lint fixes
        shell: bash
        run: |
          expected="apps/terrain-lab/src/fixture-registry.ts
          browser-tests/road.spec.ts
          tooling/verification-scripts.test.mjs"
          changed="$(git diff --name-only | sort)"
          expected_sorted="$(printf '%s\n' "$expected" | sed 's/^ *//' | sort)"
          if [[ "$changed" != "$expected_sorted" ]]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/terrain-lab/src/fixture-registry.ts browser-tests/road.spec.ts tooling/verification-scripts.test.mjs
          git commit -m "fix: resolve road foundation lint errors"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
