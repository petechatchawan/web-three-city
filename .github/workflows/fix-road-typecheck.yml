name: Fix Road Typecheck

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: fix-road-typecheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.number == 11
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply CellCoord annotation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/game/src/road-stroke-controller.test.ts')
          text = path.read_text()
          edits = [
              (
                  "import { WORLD_CONFIG } from '@web-three-city/world-core';",
                  "import { WORLD_CONFIG, type CellCoord } from '@web-three-city/world-core';",
              ),
              (
                  "    surfaceAt(cell): TerrainCellSurfaceProfile {",
                  "    surfaceAt(cell: CellCoord): TerrainCellSurfaceProfile {",
              ),
          ]
          for old, new in edits:
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/game/src/road-stroke-controller.test.ts
      - run: pnpm typecheck
      - name: Commit typecheck fix
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [[ "$changed" != "apps/game/src/road-stroke-controller.test.ts" ]]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/road-stroke-controller.test.ts
          git commit -m "fix: type road placement test cell"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
