name: Format automatic growth fix

on:
  push:
    branches:
      - agent/building-growth-runtime-v0-1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-runtime-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format source and remove helper
        run: |
          pnpm exec prettier --write apps/game/src/game-bootstrap.ts apps/game/src/main.ts browser-tests/growth.spec.ts
          rm .github/workflows/format-automatic-growth-fix.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src/game-bootstrap.ts apps/game/src/main.ts browser-tests/growth.spec.ts .github/workflows/format-automatic-growth-fix.yml
          git commit -m 'style: format automatic growth fix'
          git push origin HEAD:agent/building-growth-runtime-v0-1
