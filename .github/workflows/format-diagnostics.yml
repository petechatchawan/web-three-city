name: Format Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture exact Prettier changes
        run: |
          pnpm exec prettier --write "**/*.{ts,js,yml,yaml}"
          mkdir -p diagnostics/formatted
          git diff --name-only > diagnostics/files.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "diagnostics/formatted/$(dirname "$file")"
            cp "$file" "diagnostics/formatted/$file"
          done < diagnostics/files.txt
          git diff > diagnostics/format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: format-diagnostics
          path: diagnostics
          if-no-files-found: error
