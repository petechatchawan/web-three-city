name: Format Growth implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/building-growth-runtime-v0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-runtime-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format authored source and tests
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write "**/*.{ts,js,yml,yaml}"
          rm -f docs/superpowers/evidence/.growth-format-trigger
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: format Building Growth implementation'
          git push origin HEAD:agent/building-growth-runtime-v0-1
