name: Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Task 1 files
        run: |
          pnpm exec prettier --write \
            packages/camera-input/src/camera-state.ts \
            packages/camera-input/src/camera-framing.ts \
            packages/camera-input/src/orthographic-camera-rig.ts \
            packages/camera-input/src/index.ts \
            packages/camera-input/test/camera-framing.test.ts \
            packages/camera-input/test/orthographic-camera-rig.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: task-1-formatted
          path: packages/camera-input
          if-no-files-found: error
