name: Format Road Branch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: format-road-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.number == 11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "**/*.{ts,js,yml,yaml}"
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting is already canonical."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply canonical formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
