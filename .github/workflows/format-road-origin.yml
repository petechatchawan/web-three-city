name: Format Road origin fix

on:
  push:
    branches: [fix/road-world-origin-visibility]
    paths:
      - '.github/workflows/format-road-origin.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/road-world-origin-visibility
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/road-three/test/road-geometry.test.ts
      - name: Commit formatting and remove this workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-road-origin.yml
          git add packages/road-three/test/road-geometry.test.ts
          git commit -m 'test: format centered Road geometry expectations'
          git push origin HEAD:fix/road-world-origin-visibility
