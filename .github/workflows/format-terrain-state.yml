name: Format Terrain State

on:
  push:
    branches:
      - feat/phase-1b-terrain-authority
    paths:
      - .github/workflows/format-terrain-state.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply pinned formatting
        run: ./node_modules/.bin/prettier --write systems/terrain/src/domain/terrain-state.ts
      - name: Commit formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/terrain/src/domain/terrain-state.ts
          git rm .github/workflows/format-terrain-state.yml
          git commit -m "style(terrain): normalize terrain state formatting"
          git push origin HEAD:feat/phase-1b-terrain-authority
