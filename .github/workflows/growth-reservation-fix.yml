name: Growth Reservation Fix

on:
  push:
    branches:
      - agent/building-growth-runtime-v0-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-runtime-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair executor literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tooling/apply-growth-reservation-fix.mjs')
          source = path.read_text()
          literal_before = "    for (const cell of cells) unique.set(\\`${cell.x}:${cell.z}\\`, cell);"
          literal_after = "    for (const cell of cells) unique.set(String(cell.x) + ':' + String(cell.z), cell);"
          if literal_before not in source:
              raise SystemExit('growth-reservation-fix:missing-executor-literal')
          source = source.replace(literal_before, literal_after)
          optional_before = "reservedCells: input.reservedCells,"
          optional_after = "...(input.reservedCells === undefined ? {} : { reservedCells: input.reservedCells }),"
          if source.count(optional_before) != 2:
              raise SystemExit('growth-reservation-fix:unexpected-optional-forwarding-count')
          path.write_text(source.replace(optional_before, optional_after))
          PY
      - run: node tooling/apply-growth-reservation-fix.mjs
      - run: >-
          pnpm exec prettier --write
          packages/building-core/src/building-selection.ts
          packages/building-core/src/building-growth.ts
          packages/building-core/test/building-growth-reservation.test.ts
          apps/game/src/world-growth-transaction.ts
          apps/game/src/game-input.ts
          apps/game/src/game-bootstrap.ts
          browser-tests/growth-reservation.spec.ts
      - run: pnpm --filter @web-three-city/building-core test
      - run: pnpm --filter @web-three-city/building-core typecheck
      - run: pnpm --filter @web-three-city/game typecheck
      - run: pnpm typecheck:browser
      - name: Commit verified fix and remove executor
        run: |
          rm -f tooling/apply-growth-reservation-fix.mjs
          rm -f .github/workflows/growth-reservation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reserve active transactions from background Growth"
          git push origin HEAD:agent/building-growth-runtime-v0-1
