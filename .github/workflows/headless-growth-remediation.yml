name: Headless Growth Remediation

on:
  push:
    branches:
      - agent/building-growth-runtime-v0-1
    paths:
      - tooling/apply-headless-growth-remediation.mjs
      - .github/workflows/headless-growth-remediation.yml

permissions:
  contents: write

concurrency:
  group: headless-growth-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-runtime-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply remediation
        run: node tooling/apply-headless-growth-remediation.mjs
      - name: Diagnose guarded production routes
        if: failure()
        run: |
          grep -n -C 3 -E 'building-develop|tool-building-develop|Develop Zones|Zones developed' apps/game/src/game-bootstrap.ts || true
      - name: Format changed sources
        run: |
          pnpm exec prettier --write \
            apps/game/src/game-tool-mode.ts \
            apps/game/src/game-tool-mode-building.test.ts \
            apps/game/src/game-ui.ts \
            apps/game/src/game-ui.test.ts \
            apps/game/src/main.ts \
            apps/game/src/game-tool-hud-binding.ts \
            apps/game/src/game-input.ts \
            apps/game/src/game-bootstrap.ts \
            browser-tests/growth.spec.ts \
            browser-tests/building.spec.ts \
            browser-tests/building-visual-evidence.spec.ts
      - name: Verify focused unit and type boundaries
        run: |
          pnpm --filter @web-three-city/game test
          pnpm --filter @web-three-city/game typecheck
          pnpm typecheck:browser
          git diff --check
      - name: Commit remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src browser-tests
          git commit -m "fix: make automatic growth headless"
          git push origin HEAD:agent/building-growth-runtime-v0-1
