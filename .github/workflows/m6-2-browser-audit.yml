name: M6.2 browser contract audit

on:
  push:
    branches:
      - fix/m6-2-mobile-build-dock

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-2-mobile-build-dock
      - name: Find stale City UI browser contracts
        run: |
          echo '=== stale persistent nav selectors ==='
          grep -RInE "nav-(navigate|terrain|roads|zones|buildings)" browser-tests || true
          echo '=== stale Tool Context name/message contracts ==='
          grep -RInE "tool-context-(name|message)" browser-tests || true
          echo '=== stale City UI Ready waits ==='
          grep -RInE "tool-context-status.*Ready|toHaveText\('Ready'\)|toHaveText\(\"Ready\"\)" browser-tests || true
          echo '=== stale secondary HUD metric uses ==='
          grep -RInE "data-metric=.?(net|demand|construction|active|total)" browser-tests || true
