name: M6.2 browser selector migration

on:
  push:
    branches:
      - fix/m6-2-mobile-build-dock

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-2-mobile-build-dock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Migrate audited selectors
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'browser-tests/terraform-visual-evidence.@terrain@visual@performance@release.spec.ts',
              'browser-tests/zoning.@zoning.spec.ts',
              'browser-tests/road-visibility.@road@visual.spec.ts',
              'browser-tests/terraform.@terrain.spec.ts',
              'browser-tests/road.@road.spec.ts',
              'browser-tests/road-reversible-stroke.@road@interaction.spec.ts',
              'browser-tests/transaction-release.@road@interaction.spec.ts',
              'browser-tests/road-operation-aware-interaction.@road@interaction.spec.ts',
              'browser-tests/building.@building@visual@release.spec.ts',
              'browser-tests/city-ui-inspect-information.@interaction@building@road@zoning.spec.ts',
              'browser-tests/interaction.@interaction.spec.ts',
              'browser-tests/city-ui-dialogs.@rci@interaction.spec.ts',
          ]

          nav = {
              'terrain': "await openBuildCategory(page, 'terrain');",
              'roads': "await openBuildCategory(page, 'roads');",
              'zones': "await openBuildCategory(page, 'zones');",
              'buildings': "await openBuildCategory(page, 'buildings');",
              'navigate': 'await closeBuild(page);',
          }

          for name in files:
              path = Path(name)
              text = path.read_text()
              used = set()
              for category, replacement in nav.items():
                  old = f"await page.getByTestId('nav-{category}').click();"
                  if old in text:
                      text = text.replace(old, replacement)
                      used.add('closeBuild' if category == 'navigate' else 'openBuildCategory')
              ready = "await expect(page.getByTestId('tool-context-status')).toHaveText('Ready');"
              if ready in text:
                  text = text.replace(ready, 'await waitForCityUi(page);')
                  used.add('waitForCityUi')
              if used:
                  helpers = ', '.join(sorted(used))
                  import_line = f"import {{ {helpers} }} from './helpers/city-ui.js';\n"
                  if "from './helpers/city-ui.js'" not in text:
                      text = import_line + text
              path.write_text(text)
          PY
      - run: pnpm exec prettier --write browser-tests
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser-tests
          git commit -m "test(city-ui): migrate audited browser selectors to M6.2"
          git push origin HEAD:fix/m6-2-mobile-build-dock
