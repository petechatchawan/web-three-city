name: M6.2 final staging hygiene

on:
  push:
    branches:
      - fix/m6-2-mobile-build-dock

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-2-mobile-build-dock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format M6.2 production and browser surfaces
        run: >-
          pnpm exec prettier --write
          apps/game/src/main.ts
          apps/game/src/ui/m6-2-mobile.css
          apps/game/src/ui/shell
          browser-tests
      - name: Audit retired City UI browser contracts
        run: |
          set -e
          if grep -RInE "nav-(navigate|terrain|roads|zones|buildings)" browser-tests; then
            echo 'stale persistent nav selector found' >&2
            exit 1
          fi
          if grep -RInE "tool-context-(name|message)" browser-tests; then
            echo 'stale Tool Context identity contract found' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(
              r"getByTestId\('tool-context-status'\)\s*\)\s*\.toHaveText\(\s*'Ready'",
              re.MULTILINE,
          )
          offenders = []
          for path in Path('browser-tests').glob('*.spec.ts'):
              if pattern.search(path.read_text()):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('stale City UI Ready waits: ' + ', '.join(offenders))
          PY
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src/main.ts apps/game/src/ui/m6-2-mobile.css apps/game/src/ui/shell browser-tests
          git commit -m "style: finalize M6.2 presentation and browser contracts"
          git push origin HEAD:fix/m6-2-mobile-build-dock
