name: M6.2 format road coverage

on:
  push:
    branches:
      - fix/m6-2-mobile-build-dock

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-2-mobile-build-dock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prettier --write browser-tests/road-operation-aware-interaction.@road@interaction.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser-tests/road-operation-aware-interaction.@road@interaction.spec.ts
          git commit -m "style: format M6.2 camera coverage"
          git push origin HEAD:fix/m6-2-mobile-build-dock
