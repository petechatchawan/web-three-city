name: M6.2 format staging

on:
  push:
    branches:
      - fix/m6-2-mobile-build-dock

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-2-mobile-build-dock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: >-
          pnpm exec prettier --write
          apps/game/src/ui/shell/bottom-nav.test.ts
          apps/game/src/ui/shell/player-shell.test.ts
          apps/game/src/ui/shell/player-shell-wiring.test.ts
          apps/game/src/ui/shell/tool-context-sheet.test.ts
          apps/game/src/ui/shell/game-hud.test.ts
          apps/game/src/ui/shell/primary-actions.ts
          apps/game/src/ui/shell/build-category-dock.ts
          apps/game/src/ui/shell/status-feedback.ts
          apps/game/src/ui/shell/tool-context-sheet.ts
          apps/game/src/ui/shell/player-shell.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src/ui/shell
          git commit -m "style: format M6.2 GREEN batch"
          git push origin HEAD:fix/m6-2-mobile-build-dock
