name: M6.2 Ready contract migration

on:
  push:
    branches:
      - fix/m6-2-mobile-build-dock

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-2-mobile-build-dock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Replace City UI Ready waits only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('browser-tests/visual-evidence.@terrain@water@visual@performance@release.spec.ts'),
              Path('browser-tests/water.@water.spec.ts'),
          ]
          pattern = re.compile(
              r"await\s+expect\(page\.getByTestId\('tool-context-status'\)\)\.toHaveText\(\s*'Ready'\s*(?:,\s*\{.*?\})?\s*\);",
              re.DOTALL,
          )
          for path in files:
              text = path.read_text()
              text, count = pattern.subn('await waitForCityUi(page);', text)
              if count == 0:
                  raise SystemExit(f'no City UI Ready waits migrated in {path}')
              if "from './helpers/city-ui.js'" not in text:
                  text = "import { waitForCityUi } from './helpers/city-ui.js';\n" + text
              path.write_text(text)
              print(f'{path}: migrated {count}')
          PY
      - run: pnpm exec prettier --write browser-tests/visual-evidence.@terrain@water@visual@performance@release.spec.ts browser-tests/water.@water.spec.ts
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser-tests/visual-evidence.@terrain@water@visual@performance@release.spec.ts browser-tests/water.@water.spec.ts
          git commit -m "test(city-ui): migrate remaining Ready waits to shell readiness"
          git push origin HEAD:fix/m6-2-mobile-build-dock
