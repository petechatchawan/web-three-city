name: M6.2 targeted browser verification

on:
  push:
    branches:
      - fix/m6-2-mobile-build-dock

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-2-mobile-build-dock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:browser
      - run: ./node_modules/.bin/playwright install chromium
      - name: Run previously failing M6.2 browser specs
        env:
          CI: '1'
        run: >-
          pnpm exec playwright test
          browser-tests/building.@building@smoke.spec.ts
          browser-tests/growth-reservation.@building.spec.ts
          browser-tests/growth-visual-evidence.@building@visual@release.spec.ts
          browser-tests/growth.@building.spec.ts
          browser-tests/interaction-conformance.@interaction@smoke.spec.ts
          browser-tests/road-operation-aware-interaction.@road@interaction.spec.ts
          browser-tests/road-reversible-stroke.@road@interaction.spec.ts
          browser-tests/transaction-release.@road@interaction.spec.ts
          browser-tests/zoning-visual-evidence.@zoning@visual@release.spec.ts
