name: M6.3 final hygiene

on:
  push:
    branches:
      - fix/m6-3-figma-fidelity

permissions:
  contents: write

jobs:
  hygiene:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-3-figma-fidelity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format changed M6.3 code and browser contracts
        run: |
          pnpm exec prettier --write \
            apps/game/src/main.ts \
            apps/game/src/ui/city-ui-runtime.ts \
            apps/game/src/ui/shell/bottom-nav.ts \
            apps/game/src/ui/shell/bottom-nav.test.ts \
            apps/game/src/ui/shell/game-hud.ts \
            apps/game/src/ui/shell/game-hud.test.ts \
            apps/game/src/ui/shell/player-shell.ts \
            apps/game/src/ui/shell/player-shell.test.ts \
            apps/game/src/ui/shell/player-shell-wiring.test.ts \
            apps/game/src/ui/shell/simulation-controls.ts \
            apps/game/src/ui/shell/simulation-controls.test.ts \
            apps/game/src/ui/shell/status-feedback.ts \
            apps/game/src/ui/shell/tool-context-sheet.test.ts \
            apps/game/src/ui/shell/subtool-tray.ts \
            apps/game/src/ui/systems/city-system-dialogs.ts \
            apps/game/src/ui/systems/city-system-dialogs.test.ts \
            apps/game/src/ui/city-ui-runtime.test.ts \
            browser-tests/helpers/city-ui.ts \
            browser-tests/helpers/growth-fixture.ts \
            browser-tests/helpers/interaction.ts \
            browser-tests/city-ui-responsive.@interaction@smoke@release.spec.ts \
            browser-tests/city-ui-dialogs.@rci@interaction.spec.ts \
            browser-tests/city-ui-inspect-information.@interaction@building@road@zoning.spec.ts \
            browser-tests/economy.@rci@interaction@smoke.spec.ts \
            browser-tests/game.@interaction@smoke.spec.ts \
            browser-tests/growth.@building.spec.ts \
            browser-tests/growth-visual-evidence.@building@visual@release.spec.ts \
            browser-tests/interaction.@interaction.spec.ts \
            browser-tests/interaction-conformance.@interaction@smoke.spec.ts \
            browser-tests/rci.@rci@smoke.spec.ts \
            browser-tests/road-operation-aware-interaction.@road@interaction.spec.ts \
            browser-tests/terraform-visual-evidence.@terrain@visual@performance@release.spec.ts \
            browser-tests/zoning.@zoning.spec.ts \
            browser-tests/terraform.@terrain.spec.ts \
            browser-tests/road.@road.spec.ts \
            browser-tests/building.@building@smoke.spec.ts
      - name: Audit retired M6.2 contracts
        run: |
          echo '=== production references to retired M6.2 modules ==='
          grep -RInE "primary-actions|build-category-dock|m6-2-mobile" apps/game/src --exclude='primary-actions.ts' --exclude='build-category-dock.ts' --exclude='m6-2-mobile.css' || true
          echo '=== browser references to retired M6.2 selectors ==='
          grep -RInE 'build-cta|primary-navigate|build-category-|build-category-dock|build-close|city-primary-actions|city-top-actions' browser-tests || true
          echo '=== direct top-level Game Menu or Information Views clicks ==='
          grep -RInE "getByRole\('button', \{ name: '(Game Menu|Information Views)'" browser-tests || true
          echo '=== direct legacy single speed assumptions ==='
          grep -RInE "locator\('\[data-simulation-speed\]'\).*toHaveText|toHaveText\('Ⅱ'\)" browser-tests || true
          echo '=== direct Undo clicks not via helper ==='
          grep -RIn "getByTestId('tool-context-undo').click" browser-tests || true
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src browser-tests
          git commit -m "style: format M6.3 fidelity cutover"
          git push origin HEAD:fix/m6-3-figma-fidelity
