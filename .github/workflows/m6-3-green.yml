name: M6.3 GREEN verification

on:
  push:
    branches:
      - verify/m6-3-green

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/m6-3-green
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:browser
      - run: ./node_modules/.bin/playwright install chromium
      - name: Verify M6.3 GREEN browser surface
        env:
          CI: '1'
        run: >-
          pnpm exec playwright test
          browser-tests/city-ui-responsive.@interaction@smoke@release.spec.ts
          browser-tests/city-ui-dialogs.@rci@interaction.spec.ts
          browser-tests/city-ui-inspect-information.@interaction@building@road@zoning.spec.ts
          browser-tests/economy.@rci@interaction@smoke.spec.ts
          browser-tests/game.@interaction@smoke.spec.ts
          browser-tests/growth.@building.spec.ts
          browser-tests/interaction.@interaction.spec.ts
          browser-tests/interaction-conformance.@interaction@smoke.spec.ts
          browser-tests/rci.@rci@smoke.spec.ts
          browser-tests/road-operation-aware-interaction.@road@interaction.spec.ts
          browser-tests/transaction-release.@road@interaction.spec.ts
          --workers=1
