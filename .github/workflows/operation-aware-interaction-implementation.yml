            apps/game/src/game-tool-hud-binding.ts \
            apps/game/src/interaction-evidence.ts \
            apps/game/src/road-release-contract.test.ts \
            apps/game/src/road-preview-label.test.ts \
            packages/camera-input/src/orthographic-camera-rig.ts \
            packages/camera-input/src/camera-interaction-controller.ts \
            packages/camera-input/src/index.ts \
            packages/camera-input/test/screen-relative-pan.test.ts \
            browser-tests/road-operation-aware-interaction.spec.ts

      - name: Focused GREEN verification
        run: |
          pnpm exec vitest run \
            packages/road-three/test/operation-aware-preview.test.ts \
            packages/road-three/test/road-preview-presentation.test.ts \
            apps/game/src/road-release-contract.test.ts \
            apps/game/src/road-preview-label.test.ts \
            packages/camera-input/test/screen-relative-pan.test.ts \
            packages/camera-input/test/camera-interaction-controller.test.ts
          pnpm --filter @web-three-city/road-three typecheck
          pnpm --filter @web-three-city/camera-input typecheck
          pnpm --filter @web-three-city/camera-input build
          pnpm --filter @web-three-city/game typecheck

      - name: Repository verification
        run: pnpm check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Focused browser acceptance
        run: pnpm exec playwright test browser-tests/road-operation-aware-interaction.spec.ts --project=chromium

      - name: Full Chromium and WebGL verification
        run: pnpm test:browser

      - name: Final tree audit and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e .github/workflows/operation-aware-interaction-implementation.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Road and camera interaction operation-aware'
          git push origin HEAD:master
          git rev-parse HEAD | tee final-head.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operation-aware-interaction-evidence
          path: |
            tdd-red.log
            final-head.txt
            playwright-report
            test-results
          if-no-files-found: ignore
