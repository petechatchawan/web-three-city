name: Operation-aware interaction implementation

on:
  push:
    branches: [master]
    paths:
      - 'docs/superpowers/plans/2026-08-02-operation-aware-road-preview-release-camera-pan.md'

permissions:
  contents: write

concurrency:
  group: operation-aware-interaction-master
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create RED tests
        run: |
          python <<'PY'
          from pathlib import Path

          Path('packages/road-three/test/operation-aware-preview.test.ts').write_text(r'''import {
            BASIC_ROAD_CODE,
            createRoadSnapshot,
            planRoadMutation,
            type RoadPlacementEnvironment,
            type RoadSnapshot,
          } from '@web-three-city/road-core';
          import type { TerrainCellSurfaceProfile } from '@web-three-city/terrain-core';
          import { WORLD_CONFIG, type CellCoord } from '@web-three-city/world-core';
          import * as THREE from 'three';
          import { describe, expect, it } from 'vitest';
          import {
            RoadPreviewPresentation,
            createCoreRoadPresentationSource,
          } from '../src/index.js';

          function environment(dry: boolean): RoadPlacementEnvironment {
            return Object.freeze({
              terrainRevision: 1,
              waterSourceTerrainRevision: 1,
              surfaceAt(cell: CellCoord): TerrainCellSurfaceProfile {
                return Object.freeze({
                  cell: Object.freeze({ ...cell }),
                  corners: Object.freeze({ nw: 2, ne: 2, sw: 2, se: 2 }),
                  shape: 'flat',
                  minimumLevel: 2,
                  maximumLevel: 2,
                  slopeAxis: null,
                });
              },
              isDry: () => dry,
            });
          }

          function snapshot(cells: readonly CellCoord[]): RoadSnapshot {
            const codes = new Uint8Array(WORLD_CONFIG.mapWidth * WORLD_CONFIG.mapHeight);
            for (const cell of cells) codes[cell.z * WORLD_CONFIG.mapWidth + cell.x] = BASIC_ROAD_CODE;
            return createRoadSnapshot(
              {
                width: WORLD_CONFIG.mapWidth,
                height: WORLD_CONFIG.mapHeight,
                revision: 0,
                definitionCodes: codes,
              },
              WORLD_CONFIG,
            );
          }

          function firstMesh(root: THREE.Group | null): THREE.Mesh {
            let result: THREE.Mesh | null = null;
            root?.traverse((object) => {
              if (result === null && object instanceof THREE.Mesh) result = object;
            });
            if (result === null) throw new Error('operation-aware-preview:missing-mesh');
            return result;
          }

          describe('operation-aware Road Preview', () => {
            it('uses operation and validity specific materials and a Bulldoze marker', () => {
              const scene = new THREE.Scene();
              const preview = new RoadPreviewPresentation(
                scene,
                createCoreRoadPresentationSource(WORLD_CONFIG),
                WORLD_CONFIG,
              );
              const cell = { x: 64, z: 64 };
              const empty = snapshot([]);
              const occupied = snapshot([cell]);
              const dry = environment(true);
              const wet = environment(false);

              const buildValid = planRoadMutation(
                empty,
                { operation: 'build', definitionId: 'basic-road', cells: [cell] },
                dry,
                WORLD_CONFIG,
              );
              preview.show(empty, buildValid, dry);
              expect((firstMesh(preview.root).material as THREE.Material).name).toBe(
                'road-material-preview-build-valid',
              );

              const buildInvalid = planRoadMutation(
                empty,
                { operation: 'build', definitionId: 'basic-road', cells: [cell] },
                wet,
                WORLD_CONFIG,
              );
              preview.show(empty, buildInvalid, wet);
              expect((firstMesh(preview.root).material as THREE.Material).name).toBe(
                'road-material-preview-build-invalid',
              );

              const bulldozeValid = planRoadMutation(
                occupied,
                { operation: 'bulldoze', definitionId: 'basic-road', cells: [cell] },
                dry,
                WORLD_CONFIG,
              );
              preview.show(occupied, bulldozeValid, dry);
              expect((firstMesh(preview.root).material as THREE.Material).name).toBe(
                'road-material-preview-bulldoze-valid',
              );
              const marker = preview.root?.getObjectByName('road-preview-bulldoze-marker');
              expect(marker).toBeInstanceOf(THREE.LineSegments);
              expect(((marker as THREE.LineSegments).material as THREE.Material).name).toBe(
                'road-material-preview-bulldoze-marker',
              );

              const bulldozeInvalid = planRoadMutation(
                empty,
                { operation: 'bulldoze', definitionId: 'basic-road', cells: [cell] },
                dry,
                WORLD_CONFIG,
              );
              preview.show(empty, bulldozeInvalid, dry);
              expect((firstMesh(preview.root).material as THREE.Material).name).toBe(
                'road-material-preview-bulldoze-invalid',
              );
              preview.dispose();
            });
          });
          ''')

          Path('apps/game/src/road-release-contract.test.ts').write_text(r'''import {
            createEmptyRoadSnapshot,
            type RoadPlacementEnvironment,
          } from '@web-three-city/road-core';
          import type { TerrainCellSurfaceProfile } from '@web-three-city/terrain-core';
          import { WORLD_CONFIG, type CellCoord } from '@web-three-city/world-core';
          import { describe, expect, it } from 'vitest';
          import { createRoadStrokeController } from './road-stroke-controller.js';

          const environment: RoadPlacementEnvironment = Object.freeze({
            terrainRevision: 1,
            waterSourceTerrainRevision: 1,
            surfaceAt(cell: CellCoord): TerrainCellSurfaceProfile {
              return Object.freeze({
                cell: Object.freeze({ ...cell }),
                corners: Object.freeze({ nw: 2, ne: 2, sw: 2, se: 2 }),
                shape: 'flat',
                minimumLevel: 2,
                maximumLevel: 2,
                slopeAxis: null,
              });
            },
            isDry: () => true,
          });

          describe('Road release outside Terrain', () => {
            it('finalizes the latest valid Build plan when release has no Terrain cell', () => {
              const controller = createRoadStrokeController({
                config: WORLD_CONFIG,
                getMode: () => 'road-build',
                getRoadSnapshot: () => createEmptyRoadSnapshot(WORLD_CONFIG),
                getEnvironment: () => environment,
                onPreview: () => undefined,
              });
              controller.begin(1, { x: 10, z: 10 });
              controller.move(1, { x: 12, z: 10 });

              const plan = controller.end(1, null);

              expect(plan?.valid).toBe(true);
              expect(plan?.requestedCells).toEqual([
                { x: 10, z: 10 },
                { x: 11, z: 10 },
                { x: 12, z: 10 },
              ]);
              expect(controller.getState().strokeActive).toBe(false);
            });

            it('preserves the latest invalid reason when release has no Terrain cell', () => {
              const controller = createRoadStrokeController({
                config: WORLD_CONFIG,
                getMode: () => 'road-bulldoze',
                getRoadSnapshot: () => createEmptyRoadSnapshot(WORLD_CONFIG),
                getEnvironment: () => environment,
                onPreview: () => undefined,
              });
              controller.begin(1, { x: 10, z: 10 });

              const plan = controller.end(1, null);

              expect(plan?.valid).toBe(false);
              expect(plan?.invalidReason).toBe('road:no-change');
              expect(controller.getState().strokeActive).toBe(false);
            });
          });
          ''')

          Path('apps/game/src/road-preview-label.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
          import { roadPreviewStateLabel } from './game-tool-hud-binding.js';

          describe('roadPreviewStateLabel', () => {
            it.each([
              ['road-build', true, 'Valid build'],
              ['road-build', false, 'Invalid build'],
              ['road-bulldoze', true, 'Valid bulldoze'],
              ['road-bulldoze', false, 'Invalid bulldoze'],
              ['road-build', null, 'Tool ready'],
            ] as const)('maps %s / %s to %s', (mode, valid, expected) => {
              expect(roadPreviewStateLabel(mode, valid)).toBe(expected);
            });
          });
          ''')

          Path('packages/camera-input/test/screen-relative-pan.test.ts').write_text(r'''import * as THREE from 'three';
          import { describe, expect, it } from 'vitest';
          import { CameraInteractionController, OrthographicCameraRig } from '../src/index.js';

          const MAP = { mapWidth: 128, mapHeight: 128, cellSize: 1 } as const;
          const INSETS = { top: 0, right: 0, bottom: 0, left: 0 } as const;
          const BOUNDS = { minimumWorldY: -1.5, maximumWorldY: 2 } as const;

          function setup(yaw: number) {
            const camera = new THREE.OrthographicCamera();
            const rig = new OrthographicCameraRig(camera, MAP);
            rig.setViewport(1000, 800, INSETS);
            rig.fitToWorld(BOUNDS);
            rig.setYawDegrees(yaw);
            rig.focus(0, 0);
            const controller = new CameraInteractionController(rig, { pick: () => null });
            return { camera, rig, controller };
          }

          function projected(camera: THREE.OrthographicCamera): THREE.Vector3 {
            camera.updateMatrixWorld(true);
            return new THREE.Vector3(0, 0, 0).project(camera);
          }

          describe('screen-relative camera pan', () => {
            it.each([17, 45, 90, 135, 180, 225, 270, 315] as const)(
              'keeps horizontal and vertical drag direction stable at yaw %s',
              (yaw) => {
                const horizontal = setup(yaw);
                const beforeRight = projected(horizontal.camera);
                horizontal.controller.panScreen({ x: 20, y: 0 });
                const afterRight = projected(horizontal.camera);
                expect(afterRight.x).toBeGreaterThan(beforeRight.x);
                expect(afterRight.y).toBeCloseTo(beforeRight.y, 5);

                const vertical = setup(yaw);
                const beforeUp = projected(vertical.camera);
                vertical.controller.panScreen({ x: 0, y: -20 });
                const afterUp = projected(vertical.camera);
                expect(afterUp.y).toBeGreaterThan(beforeUp.y);
                expect(afterUp.x).toBeCloseTo(beforeUp.x, 5);
              },
            );
          });
          ''')
          PY

      - name: Verify RED failures
        run: |
          set +e
          : > tdd-red.log
          failures=0
          for command in \
            "pnpm exec vitest run packages/road-three/test/operation-aware-preview.test.ts" \
            "pnpm exec vitest run apps/game/src/road-release-contract.test.ts" \
            "pnpm exec vitest run apps/game/src/road-preview-label.test.ts" \
            "pnpm exec vitest run packages/camera-input/test/screen-relative-pan.test.ts"
          do
            echo "=== $command ===" | tee -a tdd-red.log
            bash -lc "$command" 2>&1 | tee -a tdd-red.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              echo "RED contract unexpectedly passed: $command" | tee -a tdd-red.log
              failures=$((failures + 1))
            fi
          done
          set -e
          test "$failures" -eq 0

      - name: Apply minimal production implementation
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
            target = Path(path)
            text = target.read_text()
            if text.count(old) != 1:
              raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
            target.write_text(text.replace(old, new, 1))

          Path('packages/road-three/src/material-factory.ts').write_text(r'''import * as THREE from 'three';

          export interface RoadMaterials {
            readonly committed: THREE.MeshStandardMaterial;
            readonly buildValidPreview: THREE.MeshStandardMaterial;
            readonly buildInvalidPreview: THREE.MeshStandardMaterial;
            readonly bulldozeValidPreview: THREE.MeshStandardMaterial;
            readonly bulldozeInvalidPreview: THREE.MeshStandardMaterial;
            readonly invalidMarker: THREE.LineBasicMaterial;
            readonly bulldozeMarker: THREE.LineBasicMaterial;
          }

          function previewMaterial(
            name: string,
            color: number,
            opacity: number,
          ): THREE.MeshStandardMaterial {
            const material = new THREE.MeshStandardMaterial({
              color,
              transparent: true,
              opacity,
              depthTest: true,
              depthWrite: false,
              side: THREE.DoubleSide,
            });
            material.name = name;
            return material;
          }

          export function createRoadMaterials(): RoadMaterials {
            const committed = new THREE.MeshStandardMaterial({
              vertexColors: true,
              roughness: 0.92,
              metalness: 0,
              side: THREE.DoubleSide,
            });
            committed.name = 'road-material-committed';

            const buildValidPreview = previewMaterial(
              'road-material-preview-build-valid',
              0x37d67a,
              0.78,
            );
            const buildInvalidPreview = previewMaterial(
              'road-material-preview-build-invalid',
              0xef4d4d,
              0.8,
            );
            const bulldozeValidPreview = previewMaterial(
              'road-material-preview-bulldoze-valid',
              0xff7043,
              0.82,
            );
            const bulldozeInvalidPreview = previewMaterial(
              'road-material-preview-bulldoze-invalid',
              0xb71c1c,
              0.84,
            );

            const invalidMarker = new THREE.LineBasicMaterial({
              color: 0x7d1111,
              transparent: true,
              opacity: 0.96,
              depthTest: true,
              depthWrite: false,
            });
            invalidMarker.name = 'road-material-preview-invalid-marker';

            const bulldozeMarker = new THREE.LineBasicMaterial({
              color: 0x7a1f0e,
              transparent: true,
              opacity: 1,
              depthTest: true,
              depthWrite: false,
            });
            bulldozeMarker.name = 'road-material-preview-bulldoze-marker';

            return Object.freeze({
              committed,
              buildValidPreview,
              buildInvalidPreview,
              bulldozeValidPreview,
              bulldozeInvalidPreview,
              invalidMarker,
              bulldozeMarker,
            });
          }
          ''')

          Path('packages/road-three/src/road-bulldoze-marker.ts').write_text(r'''import {
            BASIC_ROAD_DEFINITION,
            type RoadMutationPlan,
            type RoadPlacementEnvironment,
          } from '@web-three-city/road-core';
          import type { TerrainCellSurfaceProfile } from '@web-three-city/terrain-core';
          import type { CellCoord, WorldConfig } from '@web-three-city/world-core';

          const INSET = 0.14;
          const OFFSET = BASIC_ROAD_DEFINITION.surfaceOffset + 0.075;

          export interface RoadBulldozeMarkerData {
            readonly positions: Float32Array;
            readonly segmentCount: number;
          }

          function levelAt(surface: TerrainCellSurfaceProfile, u: number, v: number): number {
            const { nw, ne, sw, se } = surface.corners;
            return nw * (1 - u) * (1 - v) + ne * u * (1 - v) + sw * (1 - u) * v + se * u * v;
          }

          function point(
            cell: CellCoord,
            surface: TerrainCellSurfaceProfile,
            u: number,
            v: number,
            config: WorldConfig,
          ): readonly [number, number, number] {
            return [
              (cell.x + u - config.mapWidth / 2) * config.cellSize,
              levelAt(surface, u, v) * config.heightStep + OFFSET,
              (cell.z + v - config.mapHeight / 2) * config.cellSize,
            ];
          }

          export function buildRoadBulldozeMarker(
            plan: RoadMutationPlan,
            environment: RoadPlacementEnvironment,
            config: WorldConfig,
          ): RoadBulldozeMarkerData {
            if (!plan.valid || plan.operation !== 'bulldoze' || plan.removedCells.length === 0) {
              return Object.freeze({ positions: new Float32Array(), segmentCount: 0 });
            }
            const positions: number[] = [];
            const minimum = INSET;
            const maximum = 1 - INSET;
            for (const cell of plan.removedCells) {
              const surface = environment.surfaceAt(cell);
              const nw = point(cell, surface, minimum, minimum, config);
              const ne = point(cell, surface, maximum, minimum, config);
              const se = point(cell, surface, maximum, maximum, config);
              const sw = point(cell, surface, minimum, maximum, config);
              positions.push(
                ...nw, ...ne,
                ...ne, ...se,
                ...se, ...sw,
                ...sw, ...nw,
                ...nw, ...se,
                ...ne, ...sw,
              );
            }
            if (!positions.every(Number.isFinite)) {
              throw new RangeError('road-bulldoze-marker:non-finite-geometry');
            }
            return Object.freeze({
              positions: new Float32Array(positions),
              segmentCount: plan.removedCells.length * 6,
            });
          }
          ''')

          Path('packages/road-three/src/road-preview-presentation.ts').write_text(r'''import {
            BASIC_ROAD_DEFINITION,
            createRoadSnapshot,
            roadCellViewAt,
            type RoadCellView,
            type RoadMutationPlan,
            type RoadPlacementEnvironment,
            type RoadSnapshot,
          } from '@web-three-city/road-core';
          import type { WorldConfig } from '@web-three-city/world-core';
          import * as THREE from 'three';
          import { createRoadGeometry } from './geometry-adapter.js';
          import { createRoadMaterials, type RoadMaterials } from './material-factory.js';
          import { buildRoadBulldozeMarker } from './road-bulldoze-marker.js';
          import { buildRoadCellMesh, mergeRoadCellMeshes } from './road-geometry.js';
          import { buildRoadInvalidMarker } from './road-invalid-marker.js';
          import type { RoadPresentationSource } from './road-chunk-presentation.js';

          function disposeRoot(root: THREE.Group): void {
            root.traverse((object) => {
              if (object instanceof THREE.Mesh || object instanceof THREE.LineSegments) {
                object.geometry.dispose();
              }
            });
            root.clear();
          }

          function materialForPlan(
            plan: RoadMutationPlan,
            materials: RoadMaterials,
          ): THREE.MeshStandardMaterial {
            if (plan.operation === 'build') {
              return plan.valid ? materials.buildValidPreview : materials.buildInvalidPreview;
            }
            return plan.valid ? materials.bulldozeValidPreview : materials.bulldozeInvalidPreview;
          }

          export class RoadPreviewPresentation {
            readonly #scene: THREE.Scene;
            readonly #config: WorldConfig;
            readonly #materials = createRoadMaterials();
            #root: THREE.Group | null = null;
            #disposed = false;

            constructor(scene: THREE.Scene, _source: RoadPresentationSource, config: WorldConfig) {
              this.#scene = scene;
              this.#config = config;
            }

            show(
              baseRoads: RoadSnapshot,
              plan: RoadMutationPlan,
              environment: RoadPlacementEnvironment,
            ): void {
              this.#assertUsable();
              const staged = new THREE.Group();
              staged.name = plan.valid ? 'road-preview-root-valid' : 'road-preview-root-invalid';
              const material = materialForPlan(plan, this.#materials);

              try {
                if (plan.valid) {
                  const sourceSnapshot =
                    plan.operation === 'build'
                      ? createRoadSnapshot(
                          {
                            width: this.#config.mapWidth,
                            height: this.#config.mapHeight,
                            revision: plan.baseRoadRevision,
                            definitionCodes: plan.proposedDefinitionCodes,
                          },
                          this.#config,
                        )
                      : baseRoads;
                  const cells = plan.operation === 'build' ? plan.addedCells : plan.removedCells;
                  const views: RoadCellView[] = [];
                  for (const cell of cells) {
                    const view = roadCellViewAt(sourceSnapshot, cell, environment, this.#config);
                    if (view !== null) views.push(view);
                  }
                  const data = mergeRoadCellMeshes(
                    views.map((view) => buildRoadCellMesh(view, this.#config)),
                  );
                  if (data.positions.length > 0) {
                    const mesh = new THREE.Mesh(createRoadGeometry(data), material);
                    mesh.name = `road-preview-${plan.operation}-valid-surface`;
                    staged.add(mesh);
                  }
                  if (plan.operation === 'bulldoze') {
                    const markerData = buildRoadBulldozeMarker(plan, environment, this.#config);
                    if (markerData.segmentCount > 0) {
                      const markerGeometry = new THREE.BufferGeometry();
                      markerGeometry.setAttribute(
                        'position',
                        new THREE.BufferAttribute(markerData.positions, 3),
                      );
                      markerGeometry.computeBoundingBox();
                      markerGeometry.computeBoundingSphere();
                      const marker = new THREE.LineSegments(
                        markerGeometry,
                        this.#materials.bulldozeMarker,
                      );
                      marker.name = 'road-preview-bulldoze-marker';
                      staged.add(marker);
                    }
                  }
                } else {
                  const views: RoadCellView[] = plan.requestedCells.map((cell) =>
                    Object.freeze({
                      cell: Object.freeze({ x: cell.x, z: cell.z }),
                      definition: BASIC_ROAD_DEFINITION,
                      connections: 0,
                      surface: environment.surfaceAt(cell),
                    }),
                  );
                  const data = mergeRoadCellMeshes(
                    views.map((view) => buildRoadCellMesh(view, this.#config)),
                  );
                  if (data.positions.length > 0) {
                    const invalidMesh = new THREE.Mesh(createRoadGeometry(data), material);
                    invalidMesh.name = `road-preview-${plan.operation}-invalid-surface`;
                    staged.add(invalidMesh);
                  }
                  const markerData = buildRoadInvalidMarker(plan, environment, this.#config);
                  if (markerData.segmentCount > 0) {
                    const markerGeometry = new THREE.BufferGeometry();
                    markerGeometry.setAttribute(
                      'position',
                      new THREE.BufferAttribute(markerData.positions, 3),
                    );
                    markerGeometry.computeBoundingBox();
                    markerGeometry.computeBoundingSphere();
                    const marker = new THREE.LineSegments(
                      markerGeometry,
                      this.#materials.invalidMarker,
                    );
                    marker.name = 'road-preview-invalid-marker';
                    staged.add(marker);
                  }
                }
              } catch (error) {
                disposeRoot(staged);
                throw error;
              }

              const previous = this.#root;
              this.#scene.add(staged);
              this.#root = staged;
              if (previous !== null) {
                this.#scene.remove(previous);
                disposeRoot(previous);
              }
            }

            get root(): THREE.Group | null {
              return this.#root;
            }

            clear(): void {
              this.#assertUsable();
              if (this.#root === null) return;
              this.#scene.remove(this.#root);
              disposeRoot(this.#root);
              this.#root = null;
            }

            dispose(): void {
              if (this.#disposed) return;
              if (this.#root !== null) {
                this.#scene.remove(this.#root);
                disposeRoot(this.#root);
                this.#root = null;
              }
              this.#materials.committed.dispose();
              this.#materials.buildValidPreview.dispose();
              this.#materials.buildInvalidPreview.dispose();
              this.#materials.bulldozeValidPreview.dispose();
              this.#materials.bulldozeInvalidPreview.dispose();
              this.#materials.invalidMarker.dispose();
              this.#materials.bulldozeMarker.dispose();
              this.#disposed = true;
            }

            #assertUsable(): void {
              if (this.#disposed) throw new Error('road-preview:disposed');
            }
          }
          ''')

          replace_once(
            'packages/road-three/test/road-preview-presentation.test.ts',
            "'road-material-preview-valid'",
            "'road-material-preview-build-valid'",
          )
          replace_once(
            'packages/road-three/test/road-preview-presentation.test.ts',
            "'road-material-preview-invalid'",
            "'road-material-preview-build-invalid'",
          )

          replace_once(
            'apps/game/src/road-stroke-controller.ts',
            '  end(pointerId: number, cell: CellCoord): RoadMutationPlan | null;',
            '  end(pointerId: number, cell: CellCoord | null): RoadMutationPlan | null;',
          )
          replace_once(
            'apps/game/src/road-stroke-controller.ts',
            '''    end(pointerId: number, cell: CellCoord): RoadMutationPlan | null {
              if (session?.pointerId !== pointerId) return null;
              updateTrace(cell);
              const finalPlan = session.plan;
              clear();
              return finalPlan;
            },''',
            '''    end(pointerId: number, cell: CellCoord | null): RoadMutationPlan | null {
              if (session?.pointerId !== pointerId) return null;
              if (cell !== null) updateTrace(cell);
              const finalPlan = session.plan;
