name: Operation-aware interaction implementation v4

on:
  push:
    branches:
      - master
    paths:
      - .github/operation-aware-v4-trigger

permissions:
  contents: write

concurrency:
  group: operation-aware-interaction-master
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch execution script for presentation compatibility
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/operation-aware-v3.sh')
          text = path.read_text()
          needle = "        next_text = next_text.replace('road-material-preview-invalid', 'road-material-preview-build-invalid')\n"
          replacement = needle + "        next_text = next_text.replace('.validPreview', '.buildValidPreview')\n        next_text = next_text.replace('.invalidPreview', '.buildInvalidPreview')\n"
          if text.count(needle) != 1:
              raise SystemExit(f'expected one material replacement insertion point, found {text.count(needle)}')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              "  .github/workflows/operation-aware-interaction-v3.yml \\\n",
              "  .github/workflows/operation-aware-interaction-v3.yml \\\n  .github/workflows/operation-aware-interaction-v4.yml \\\n",
              1,
          )
          text = text.replace(
              "  .github/operation-aware-v3-trigger \\\n",
              "  .github/operation-aware-v3-trigger \\\n  .github/operation-aware-v4-trigger \\\n",
              1,
          )
          path.write_text(text)
          PY
      - name: Execute TDD implementation
        run: bash .github/scripts/operation-aware-v3.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operation-aware-interaction-evidence-v4
          path: |
            tdd-red.log
            focused-vitest.log
            repository-check.log
            focused-browser.log
            full-browser.log
            final-head.txt
            playwright-report
            test-results
          if-no-files-found: ignore
