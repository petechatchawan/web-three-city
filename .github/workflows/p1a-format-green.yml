name: P1-A Format GREEN

on:
  push:
    branches:
      - feat/phase-1a-world-authority

permissions:
  contents: write

jobs:
  format-green:
    if: contains(github.event.head_commit.message, '[FORMAT-P1A]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-1a-world-authority
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Normalize Task 2 files
        run: |
          pnpm exec prettier --write \
            systems/world/src/domain/grid-topology.ts \
            systems/world/src/application/world-spatial-read.ts \
            systems/world/tests/spatial.test.ts
          rm .github/workflows/p1a-format-green.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add systems/world .github/workflows/p1a-format-green.yml
          git diff --cached --check
          git commit -m 'chore(world): format canonical grid topology'
          git push origin HEAD:feat/phase-1a-world-authority
