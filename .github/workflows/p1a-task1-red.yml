name: P1-A Task 1 RED

on:
  push:
    branches:
      - feat/phase-1a-world-authority

permissions:
  contents: write

jobs:
  red-task-1:
    if: contains(github.event.head_commit.message, '[RED-T1]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-1a-world-authority
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Refresh workspace lockfile safely
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Verify intended RED
        run: |
          set +e
          pnpm --filter @web-three-city/world exec vitest run tests/public-surface.test.ts 2>&1 | tee /tmp/p1a-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -E "src/index|Cannot find module|Failed to load url|ENOENT" /tmp/p1a-red.log
          echo "Observed intended RED: World public surface is not implemented."
      - name: Persist generated lockfile and remove RED helper
        run: |
          rm .github/workflows/p1a-task1-red.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/p1a-task1-red.yml
          git diff --cached --check
          git commit -m 'chore(world): record Task 1 RED lockfile state'
          git push origin HEAD:feat/phase-1a-world-authority
