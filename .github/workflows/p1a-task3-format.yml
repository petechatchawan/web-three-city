name: P1-A Task 3 Format

on:
  push:
    branches:
      - feat/phase-1a-world-authority

permissions:
  contents: write

jobs:
  format-task-3:
    if: contains(github.event.head_commit.message, '[FORMAT-T3]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-1a-world-authority
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Normalize Task 3 files
        run: |
          pnpm exec prettier --write \
            systems/world/src/application/prepare-world-definition.ts \
            systems/world/src/domain/map-definition.ts \
            systems/world/src/domain/region-geometry.ts \
            systems/world/tests/map-region.test.ts
          rm .github/workflows/p1a-task3-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add systems/world .github/workflows/p1a-task3-format.yml
          git diff --cached --check
          git commit -m 'chore(world): format production map and regions'
          git push origin HEAD:feat/phase-1a-world-authority
