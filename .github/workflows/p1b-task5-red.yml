name: P1-B Task 5 RED

on:
  push:
    branches:
      - feat/phase-1b-terrain-authority

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Refresh workspace lockfile
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Verify intended RED
        run: |
          set +e
          pnpm --filter @web-three-city/terrain exec vitest run tests/public-surface.test.ts 2>&1 | tee /tmp/p1b-task5-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -E "src/index|Cannot find module|Failed to load" /tmp/p1b-task5-red.log
      - name: Commit lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/p1b-task5-red.yml
          git commit -m "test(terrain): record Task 5 RED lockfile state"
          git push origin HEAD:feat/phase-1b-terrain-authority
