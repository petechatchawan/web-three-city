name: P1-C Query Format

on:
  push:
    branches:
      - feat/phase-1c-terrain-surface
    paths:
      - .github/workflows/p1c-query-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format test
        run: ./node_modules/.bin/prettier --write systems/terrain/tests/surface.test.ts
      - name: Commit formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/terrain/tests/surface.test.ts
          git rm .github/workflows/p1c-query-format.yml
          git commit -m "style(terrain): normalize semantic surface query test"
          git push origin HEAD:feat/phase-1c-terrain-surface
