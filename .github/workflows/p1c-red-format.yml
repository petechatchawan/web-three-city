name: P1-C Surface RED

on:
  push:
    branches:
      - feat/phase-1c-terrain-surface
    paths:
      - .github/workflows/p1c-red-format.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Format RED test
        run: ./node_modules/.bin/prettier --write systems/terrain/tests/surface.test.ts
      - name: Verify intended RED
        run: |
          set +e
          pnpm --filter @web-three-city/terrain exec vitest run tests/surface.test.ts 2>&1 | tee /tmp/p1c-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -E "domain/surface|Cannot find module|Failed to load" /tmp/p1c-red.log
      - name: Commit formatted RED and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/terrain/tests/surface.test.ts
          git rm .github/workflows/p1c-red-format.yml
          git commit -m "test(terrain): record valid P1-C surface RED"
          git push origin HEAD:feat/phase-1c-terrain-surface
