name: P1-C Surface Query RED

on:
  push:
    branches:
      - feat/phase-1c-terrain-surface
    paths:
      - .github/workflows/p1c-surface-query-red.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Verify intended RED
        run: |
          set +e
          pnpm --filter @web-three-city/terrain exec vitest run tests/surface.test.ts 2>&1 | tee /tmp/p1c-query-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -E "cellSurface.*not a function|sampleSurface.*not a function" /tmp/p1c-query-red.log
      - name: Remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1c-surface-query-red.yml
          git commit -m "chore(ci): remove P1-C query RED helper"
          git push origin HEAD:feat/phase-1c-terrain-surface
