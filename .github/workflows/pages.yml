name: Pages deployments

on:
  push:
    branches:
      - master
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request_target:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-three-city-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0].number != null
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'closed'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pages: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Checkout production source
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up pnpm
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install production dependencies
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Build production applications
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          pnpm --filter @web-three-city/game build
          pnpm --filter @web-three-city/terrain-lab build

      - name: Download verified pull-request build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: web-app-builds
          path: pull-request-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              pr_number="$(jq -r '.workflow_run.pull_requests[0].number' "$GITHUB_EVENT_PATH")"
              source_sha="$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
              echo "mode=preview" >> "$GITHUB_OUTPUT"
              echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
              echo "target=pr-$pr_number" >> "$GITHUB_OUTPUT"
              echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
              ;;
            pull_request_target)
              pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              source_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              echo "mode=cleanup" >> "$GITHUB_OUTPUT"
              echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
              echo "target=pr-$pr_number" >> "$GITHUB_OUTPUT"
              echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "mode=production" >> "$GITHUB_OUTPUT"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "target=." >> "$GITHUB_OUTPUT"
              echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Initialize persistent Pages state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pages-state
          git -C pages-state init
          git -C pages-state config user.name "github-actions[bot]"
          git -C pages-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages-state remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git -C pages-state fetch --depth=1 origin pages-state; then
            git -C pages-state checkout -B pages-state FETCH_HEAD
          else
            git -C pages-state checkout --orphan pages-state
          fi

      - name: Compose complete Pages site
        env:
          DEPLOY_MODE: ${{ steps.target.outputs.mode }}
          DEPLOY_TARGET: ${{ steps.target.outputs.target }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          case "$DEPLOY_MODE" in
            production)
              find pages-state -mindepth 1 -maxdepth 1 \
                ! -name '.git' \
                ! -name 'pr-*' \
                -exec rm -rf {} +
              cp -a apps/game/dist/. pages-state/
              mkdir -p pages-state/terrain-lab
              cp -a apps/terrain-lab/dist/. pages-state/terrain-lab/
              metadata_path="pages-state/deployment.json"
              ;;
            preview)
              rm -rf "pages-state/$DEPLOY_TARGET"
              mkdir -p "pages-state/$DEPLOY_TARGET/terrain-lab"
              cp -a pull-request-build/game/dist/. "pages-state/$DEPLOY_TARGET/"
              cp -a pull-request-build/terrain-lab/dist/. "pages-state/$DEPLOY_TARGET/terrain-lab/"
              metadata_path="pages-state/$DEPLOY_TARGET/deployment.json"
              ;;
            cleanup)
              rm -rf "pages-state/$DEPLOY_TARGET"
              metadata_path=""
              ;;
            *)
              echo "Unsupported deployment mode: $DEPLOY_MODE" >&2
              exit 1
              ;;
          esac

          touch pages-state/.nojekyll

          if [[ -n "$metadata_path" ]]; then
            deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            cat > "$metadata_path" <<EOF
          {
            "mode": "$DEPLOY_MODE",
            "sourceSha": "$SOURCE_SHA",
            "deployedAt": "$deployed_at"
          }
          EOF
          fi

          find pages-state -mindepth 1 -maxdepth 1 -type d -name 'pr-*' -printf '%f\n' \
            | sort \
            | jq -R -s '{previews: (split("\n") | map(select(length > 0)))}' \
            > pages-state/previews.json

      - name: Persist Pages state
        env:
          DEPLOY_MODE: ${{ steps.target.outputs.mode }}
          DEPLOY_TARGET: ${{ steps.target.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          git -C pages-state add -A
          if git -C pages-state diff --cached --quiet; then
            echo "Pages state is already current."
          else
            git -C pages-state commit -m "deploy: ${DEPLOY_MODE} ${DEPLOY_TARGET}"
            git -C pages-state push origin HEAD:pages-state
          fi

          rm -rf pages-state/.git

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-state
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Publish preview link on pull request
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          marker='<!-- web-three-city-preview -->'
          base_url="${PAGE_URL%/}"
          preview_url="$base_url/pr-$PR_NUMBER/"
          terrain_lab_url="$base_url/pr-$PR_NUMBER/terrain-lab/"
          short_sha="${SOURCE_SHA:0:12}"
          body="$(cat <<EOF
          $marker
          ## Web preview ready

          - Game: $preview_url
          - Terrain Lab: $terrain_lab_url
          - Source: \`$short_sha\`

          This preview updates automatically after the PR CI passes.
          EOF
          )"

          comment_id="$(
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
              | jq -r --arg marker "$marker" '.[] | select(.body | contains($marker)) | .id' \
              | head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

          {
            echo "## Pull-request preview"
            echo
            echo "- Game: $preview_url"
            echo "- Terrain Lab: $terrain_lab_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record production deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Game: ${PAGE_URL%/}/"
            echo "- Terrain Lab: ${PAGE_URL%/}/terrain-lab/"
          } >> "$GITHUB_STEP_SUMMARY"
