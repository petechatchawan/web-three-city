name: Phase 1 Plan Semantic Finalize

on:
  push:
    branches:
      - design/phase-1-world-map-terrain

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/phase-1-world-map-terrain
          fetch-depth: 0
      - name: Apply semantic plan finalization
        run: |
          python - <<'PY'
          from pathlib import Path

          plan = Path('docs/superpowers/plans/2026-08-29-phase-1-world-map-terrain-implementation.md')
          text = plan.read_text()

          draft = '**Plan Status:** REVIEW DRAFT — NOT APPROVED FOR EXECUTION'
          approved = '**Plan Status:** APPROVED FOR EXECUTION — OWNER AUTHORIZED 2026-08-29'
          if draft not in text:
              raise SystemExit('plan status anchor missing')
          text = text.replace(draft, approved, 1)

          record_anchor = 'export interface CanonicalVertexRecord {\n  readonly vertexKey: number;'
          if record_anchor not in text:
              raise SystemExit('CanonicalVertexRecord anchor missing')
          text = text.replace(
              record_anchor,
              'export interface CanonicalVertexRecord {\n  readonly chunkKey: number;\n  readonly vertexKey: number;',
              1,
          )

          vertex_helper = 'export function toVertexKey(vertex: VertexCoord, vertexWidth: number): number {\n  return vertex.z * vertexWidth + vertex.x;\n}\n'
          if vertex_helper not in text:
              raise SystemExit('toVertexKey declaration missing')
          if 'export function toChunkKey(' not in text:
              text = text.replace(
                  vertex_helper,
                  vertex_helper + '\nexport function toChunkKey(chunk: ChunkCoord): number {\n  return chunk.z * 16 + chunk.x;\n}\n',
                  1,
              )

          unresolved_reject = 'return rejectMaterialization(owner);'
          if unresolved_reject not in text:
              raise SystemExit('materialization rejection call missing')
          text = text.replace(
              unresolved_reject,
              'return { status: "rejected", reason: "world-topology-rejected", detail: { code: owner.code } };',
              1,
          )

          staged_anchor = 'staged.push({\n      vertexKey: toVertexKey(vertex, source.vertexWidth),'
          if staged_anchor not in text:
              raise SystemExit('materialization staged record anchor missing')
          text = text.replace(
              staged_anchor,
              'staged.push({\n      chunkKey: toChunkKey(owner.value),\n      vertexKey: toVertexKey(vertex, source.vertexWidth),',
              1,
          )
          unresolved_commit = 'return commitMaterializedState(staged, /* owner routing metadata */);'
          if unresolved_commit not in text:
              raise SystemExit('materialization commit call missing')
          text = text.replace(
              unresolved_commit,
              '// Construct and publish TerrainState exactly once from the complete staged array here.',
              1,
          )

          fnv = 'hash = fnv1a64Update(hash, valueBytes);'
          if fnv not in text:
              raise SystemExit('FNV helper call missing')
          text = text.replace(
              fnv,
              'for (const byte of valueBytes) {\n    hash ^= BigInt(byte);\n    hash = BigInt.asUintN(64, hash * 0x100000001b3n);\n  }',
              1,
          )

          def replace_fence_after_marker(source: str, marker: str, replacement: str) -> str:
              marker_at = source.find(marker)
              if marker_at < 0:
                  raise SystemExit(f'marker missing: {marker}')
              open_at = source.find('```', marker_at + len(marker))
              if open_at < 0:
                  raise SystemExit(f'opening fence missing after: {marker}')
              open_end = source.find('\n', open_at)
              if open_end < 0:
                  raise SystemExit(f'opening fence newline missing after: {marker}')
              close_at = source.find('\n```', open_end)
              if close_at < 0:
                  raise SystemExit(f'closing fence missing after: {marker}')
              close_end = close_at + len('\n```')
              return source[:marker_at] + replacement + source[close_end:]

          text = replace_fence_after_marker(
              text,
              'The preparation control flow is linear:',
              '''The preparation control flow is linear and contains no retry edge:\n\n```text\nvalidate profile id/version\n-> validate Seed64 syntax\n-> validate accepted-seed catalog membership\n-> generate exactly one ProductionTerrainField\n-> validate every one of the 263,169 elevations against [32,288]\n-> validate fingerprint 0xF2FA29BFD2AEB069\n-> evaluate R06, R08, R11, R13 in canonical order\n-> reject when no candidate is eligible\n-> return that exact field + fingerprint + evaluations\n```''',
          )

          text = replace_fence_after_marker(
              text,
              'Use one owned group and one sector map:',
              '''Use one owned `THREE.Group` plus one `Map<string, THREE.Mesh>`. Task 12 defines the package-private projection helpers consumed here:\n\n```ts\nfunction renderSectorKey(coord: RenderSectorCoord): string;\nfunction buildRenderSectorGeometry(coord: RenderSectorCoord): THREE.BufferGeometry;\nfunction computeDirtyRenderSectors(\n  changeSet: TerrainChangeSet,\n): readonly RenderSectorCoord[];\n```\n\n`rebuild(changeSet)` visits `computeDirtyRenderSectors(changeSet)` in canonical `(z,x)` order, disposes and replaces only those meshes, and preserves every unaffected sector. `dispose()` detaches/disposes every owned mesh exactly once, clears the map, and is idempotent.''',
          )

          snapshot_token = 'chunks: canonicalChunks(state).map(captureChunkSnapshot),'
          snapshot_at = text.find(snapshot_token)
          if snapshot_at < 0:
              raise SystemExit('snapshot illustrative helper call missing')
          fence_start = text.rfind('```ts', 0, snapshot_at)
          fence_end = text.find('\n```', snapshot_at)
          if fence_start < 0 or fence_end < 0:
              raise SystemExit('snapshot fenced block boundaries missing')
          snapshot_replacement = '''```text\nTerrainStateSnapshot field order:\nmapDefinitionId\ngenerationProfileId = balanced-temperate-generation\ngenerationProfileVersion = 2\nselectedSeed64\nrevision\ncompleteness\nchunks ordered by ChunkCoord (z,x)\n  -> chunkCoord\n  -> owned elevations ordered by owner-window VertexCoord (z,x)\n```\n\nImplement `captureTerrainSnapshot(state)` directly from private Terrain authority and explicit sorted copies; never depend on Map insertion order.'''
          text = text[:fence_start] + snapshot_replacement + text[fence_end + len('\n```'):]

          app_token = 'assertEligibleSelection('
          app_at = text.find(app_token)
          if app_at < 0:
              raise SystemExit('app selection helper call missing')
          app_fence_start = text.rfind('```ts', 0, app_at)
          app_fence_end = text.find('\n```', app_at)
          if app_fence_start < 0 or app_fence_end < 0:
              raise SystemExit('app composition fenced block boundaries missing')
          app_replacement = '''```ts\nconst worldPreparation = prepareProductionWorldDefinition();\nif (worldPreparation.status === "rejected") return worldPreparation;\n\nconst terrainPreparation = prepareProductionTerrain({\n  world: worldPreparation.value,\n  seed64: request.seed64,\n});\nif (terrainPreparation.status === "rejected") return terrainPreparation;\n\nconst evaluations = terrainPreparation.value.candidateEvaluations;\nconst selected = evaluations.find(\n  (evaluation) => evaluation.regionId === request.startingRegionId,\n);\nif (selected === undefined || !selected.eligible) {\n  return { status: "rejected", code: "WORLD_STARTING_REGION_NOT_ELIGIBLE" };\n}\nconst eligibleStartingRegionIds = evaluations\n  .filter((evaluation) => evaluation.eligible)\n  .map((evaluation) => evaluation.regionId);\n\nconst world = createInitialWorldSystem({\n  prepared: worldPreparation.value,\n  selectedStartingRegionId: request.startingRegionId,\n  eligibleStartingRegionIds,\n});\n```'''
          text = text[:app_fence_start] + app_replacement + text[app_fence_end + len('\n```'):]

          forbidden = (
              'REVIEW DRAFT — NOT APPROVED FOR EXECUTION',
              'rejectMaterialization(',
              'commitMaterializedState(',
              'fnv1a64Update(',
              'validateProfile(',
              'validateSeedSyntax(',
              'validateAcceptedSeed(',
              'validateFullEnvelope(',
              'validateFingerprint(',
              'dirtySectors(',
              'disposeSector(',
              'keyOf(',
              'buildSectorMesh(',
              'canonicalChunks(',
              'captureChunkSnapshot',
              'assertEligibleSelection(',
              'eligibleIds(',
              'TODO',
              'TBD',
              'implement later',
              'Similar to Task',
          )
          remaining = [token for token in forbidden if token in text]
          if remaining:
              raise SystemExit(f'postcondition failed; unresolved tokens: {remaining}')
          if approved not in text:
              raise SystemExit('approved plan status absent after transformation')
          if 'export function toVertexKey(' not in text:
              raise SystemExit('valid toVertexKey helper was lost')
          if 'export function toChunkKey(' not in text:
              raise SystemExit('numeric owner-chunk mapping helper absent')

          plan.write_text(text)
          Path('.github/workflows/phase1-plan-semantic-finalize.yml').unlink()
          PY
      - name: Commit only finalized plan and helper deletion
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/plans/2026-08-29-phase-1-world-map-terrain-implementation.md .github/workflows/phase1-plan-semantic-finalize.yml
          git diff --cached --check
          git commit -m 'docs(plan): approve Phase 1 execution plan'
          git push origin HEAD:design/phase-1-world-map-terrain
