name: PR 11 Verification

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact PR branch without external actions
        run: |
          gh repo clone "${GITHUB_REPOSITORY}" repo -- --depth 1 --branch "${GITHUB_HEAD_REF}"
          cd repo
          git rev-parse HEAD
      - name: Install and verify source gates in Node 22
        working-directory: repo
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            node:22-bookworm \
            bash -lc '
              corepack enable &&
              corepack prepare pnpm@10.13.1 --activate &&
              node --version &&
              pnpm --version &&
              pnpm install --frozen-lockfile &&
              pnpm format:check &&
              pnpm typecheck &&
              pnpm build:browser
            '
      - name: Focused and full Chromium verification
        working-directory: repo
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            bash -lc '
              corepack enable &&
              corepack prepare pnpm@10.13.1 --activate &&
              pnpm exec playwright test \
                browser-tests/terraform.spec.ts \
                -g "accumulates Raise Preview and commits once on release" \
                --project=chromium \
                --reporter=line \
                --workers=1 &&
              pnpm test:browser:only
            '
