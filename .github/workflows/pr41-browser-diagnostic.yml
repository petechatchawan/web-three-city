name: PR41 Browser Diagnostic

on:
  push:
    branches:
      - chore/pr41-browser-diagnostic

permissions:
  contents: read

jobs:
  visual-ab:
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, candidate-first]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f42efdacb23737125af373aa640a8d494601bb36
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Controlled visual A/B
        env:
          ORDER: ${{ matrix.order }}
        run: |
          set -uo pipefail
          baseline=6578b3fa13d19c608068995a1dd8796baf9d7ef7
          candidate=f42efdacb23737125af373aa640a8d494601bb36
          if [ "$ORDER" = baseline-first ]; then
            refs="$baseline $candidate"
          else
            refs="$candidate $baseline"
          fi
          overall=0
          for ref in $refs; do
            git checkout --force "$ref"
            rm -rf apps/game/dist apps/terrain-lab/dist playwright-report test-results
            pnpm build:browser
            start=$(date +%s)
            pnpm exec playwright test \
              browser-tests/growth-visual-evidence.spec.ts \
              browser-tests/zoning-visual-evidence.spec.ts \
              --project=chromium --workers=2
            status=$?
            end=$(date +%s)
            echo "AB_RESULT order=$ORDER ref=$ref status=$status seconds=$((end-start))"
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr41-visual-ab-${{ matrix.order }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
