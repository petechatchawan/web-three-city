name: Raise Road reversible timeout once

on:
  push:
    branches:
      - agent/building-growth-runtime-v0-1

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-runtime-v0-1
          fetch-depth: 0
      - name: Update evidence timeout and remove helper
        run: |
          sed -i 's/test.describe.configure({ timeout: 60_000 });/test.describe.configure({ timeout: 90_000 });/' browser-tests/road-reversible-stroke.spec.ts
          rm .github/workflows/raise-road-reversible-timeout.yml
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser-tests/road-reversible-stroke.spec.ts .github/workflows/raise-road-reversible-timeout.yml
          git commit -m 'test: budget Road reversible evidence deterministically'
          git push origin HEAD:agent/building-growth-runtime-v0-1
