name: RCI bootstrap integration patch v5

on:
  push:
    branches:
      - feat/rci-game-integration-v0-1
    paths:
      - .github/workflows/rci-bootstrap-patch-v5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rci-game-integration-v0-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run corrected section-scoped patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/rci-bootstrap-patch-v3.yml').read_text()
          body = workflow.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(body)

          search_from = 0
          target_start = -1
          target_end = -1
          while True:
              start = script.find('replace_in_section(', search_from)
              if start < 0:
                  break
              end = script.find('\n)', start)
              if end < 0:
                  raise SystemExit('unterminated replace_in_section block')
              end += 2
              block = script[start:end]
              if 'LEGACY_WORLD_SAVE_V2_KEY' in block:
                  target_start = start
                  target_end = end
                  break
              search_from = end

          if target_start < 0:
              raise SystemExit('fallback replace block not found')

          replacement = '''replace_in_section(
              '  ui.saveButton.addEventListener(',
              '\\n  ui.rotateLeftButton.addEventListener(',
              "        localStorage.getItem(WORLD_SAVE_KEY) ??",
              """        localStorage.getItem(WORLD_SAVE_KEY) ??
                    localStorage.getItem(LEGACY_WORLD_SAVE_V3_KEY) ??""",
          )'''
          script = script[:target_start] + replacement + script[target_end:]
          exec(compile(script, '<rci-bootstrap-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Commit bootstrap integration
        run: |
          rm .github/workflows/rci-bootstrap-patch.yml
          rm .github/workflows/rci-bootstrap-patch-v2.yml
          rm .github/workflows/rci-bootstrap-patch-v3.yml
          rm .github/workflows/rci-bootstrap-patch-v4.yml
          rm .github/workflows/rci-bootstrap-patch-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/game-bootstrap.ts .github/workflows/rci-bootstrap-patch.yml .github/workflows/rci-bootstrap-patch-v2.yml .github/workflows/rci-bootstrap-patch-v3.yml .github/workflows/rci-bootstrap-patch-v4.yml .github/workflows/rci-bootstrap-patch-v5.yml
          git commit -m "feat(game): integrate atomic RCI runtime"
          git push origin HEAD:feat/rci-game-integration-v0-1
