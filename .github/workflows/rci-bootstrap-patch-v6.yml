name: RCI bootstrap integration patch v6

on:
  push:
    branches:
      - feat/rci-game-integration-v0-1
    paths:
      - .github/workflows/rci-bootstrap-patch-v6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rci-game-integration-v0-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run corrected section-scoped patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/rci-bootstrap-patch-v3.yml').read_text()
          body = workflow.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(body)

          def replace_call_containing(source: str, needle: str, replacement: str) -> str:
              search_from = 0
              while True:
                  start = source.find('replace_in_section(', search_from)
                  if start < 0:
                      raise SystemExit(f'replace block not found: {needle}')
                  end = source.find('\n)', start)
                  if end < 0:
                      raise SystemExit('unterminated replace_in_section block')
                  end += 2
                  block = source[start:end]
                  if needle in block:
                      return source[:start] + replacement + source[end:]
                  search_from = end

          script = replace_call_containing(
              script,
              'LEGACY_WORLD_SAVE_V2_KEY',
              '''replace_in_section(
              '  ui.saveButton.addEventListener(',
              '\\n  ui.rotateLeftButton.addEventListener(',
              "        localStorage.getItem(WORLD_SAVE_KEY) ??",
              """        localStorage.getItem(WORLD_SAVE_KEY) ??
                    localStorage.getItem(LEGACY_WORLD_SAVE_V3_KEY) ??""",
          )''',
          )
          script = replace_call_containing(
              script,
              'input.dispose();',
              '''replace_in_section(
              '  const dispose = (): void => {',
              "\\n  window.addEventListener('pagehide'",
              "    input.dispose();",
              """    input.dispose();
                rciHud.dispose();""",
          )''',
          )
          exec(compile(script, '<rci-bootstrap-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Commit bootstrap integration
        run: |
          rm .github/workflows/rci-bootstrap-patch.yml
          rm .github/workflows/rci-bootstrap-patch-v2.yml
          rm .github/workflows/rci-bootstrap-patch-v3.yml
          rm .github/workflows/rci-bootstrap-patch-v4.yml
          rm .github/workflows/rci-bootstrap-patch-v5.yml
          rm .github/workflows/rci-bootstrap-patch-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/game-bootstrap.ts .github/workflows/rci-bootstrap-patch.yml .github/workflows/rci-bootstrap-patch-v2.yml .github/workflows/rci-bootstrap-patch-v3.yml .github/workflows/rci-bootstrap-patch-v4.yml .github/workflows/rci-bootstrap-patch-v5.yml .github/workflows/rci-bootstrap-patch-v6.yml
          git commit -m "feat(game): integrate atomic RCI runtime"
          git push origin HEAD:feat/rci-game-integration-v0-1
