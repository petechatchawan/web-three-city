name: RCI browser contract patch

on:
  push:
    branches:
      - feat/rci-game-integration-v0-1
    paths:
      - .github/workflows/rci-browser-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rci-game-integration-v0-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch browser Save expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('browser-tests/game.spec.ts')
          text = path.read_text()
          changes = {
            "const SAVE_KEY = 'web-three-city:world-save:v3';": "const SAVE_KEY = 'web-three-city:world-save:v5';",
            "    schemaVersion: 3,\n    buildings: { schemaVersion: 1 },": "    schemaVersion: 5,\n    buildings: { schemaVersion: 2 },\n    rci: { kind: 'rci-save', schemaVersion: 1 },",
          }
          for old, new in changes.items():
            if text.count(old) != 1:
              raise SystemExit(f'expected one match for {old!r}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit contract update
        run: |
          rm .github/workflows/rci-browser-contract-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-tests/game.spec.ts .github/workflows/rci-browser-contract-patch.yml
          git commit -m "test(browser): align Save contract with WorldSaveV5"
          git push origin HEAD:feat/rci-game-integration-v0-1
