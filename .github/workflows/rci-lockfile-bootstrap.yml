name: RCI Lockfile Bootstrap

on:
  push:
    branches:
      - feat/rci-core-contracts-v0-1
    paths:
      - 'packages/rci-core/package.json'
      - 'apps/game/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/rci-lockfile-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rci-core-contracts-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore: refresh lockfile for rci workspace"
          git push origin HEAD:feat/rci-core-contracts-v0-1
