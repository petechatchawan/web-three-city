name: RCI PR 2 Formatter

on:
  push:
    branches:
      - feat/rci-population-lifecycle-v0-1
    paths:
      - 'packages/rci-core/**'
      - '.github/workflows/rci-pr2-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rci-population-lifecycle-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "packages/rci-core/**/*.{ts,js}" ".github/workflows/rci-pr2-format.yml"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/rci-core .github/workflows/rci-pr2-format.yml
          git commit -m "style: format rci pr2 changes"
          git push origin HEAD:feat/rci-population-lifecycle-v0-1
