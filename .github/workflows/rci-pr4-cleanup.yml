name: Clean RCI PR 4 verifier

on:
  push:
    branches: [feat/rci-employment-v0-1]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rci-employment-v0-1
      - name: Remove temporary verifier workflows
        run: |
          rm .github/workflows/rci-pr4-verify.yml
          rm .github/workflows/rci-pr4-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary RCI PR 4 verifier"
          git push origin HEAD:feat/rci-employment-v0-1
