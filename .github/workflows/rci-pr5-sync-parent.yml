name: Synchronize RCI PR 5 parent

on:
  push:
    branches: [feat/rci-demand-growth-v0-1]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rci-demand-growth-v0-1
          fetch-depth: 0
      - name: Merge final PR 4 head while preserving PR 5 authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/rci-employment-v0-1
          set +e
          git merge --no-commit --no-ff origin/feat/rci-employment-v0-1
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ -z "$conflicts" ]; then exit "$merge_status"; fi
            while IFS= read -r path; do
              git checkout --ours -- "$path"
              git add "$path"
            done <<< "$conflicts"
          fi
          rm .github/workflows/rci-pr5-sync-parent.yml
          git add -A
          git commit -m "chore: synchronize RCI PR 5 with PR 4 head"
          git push origin HEAD:feat/rci-demand-growth-v0-1
