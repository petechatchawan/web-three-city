name: Format RCI PR 4

on:
  push:
    branches: [feat/rci-employment-v0-1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rci-employment-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "**/*.{ts,js,yml,yaml}"
      - name: Commit formatting and remove workflow
        run: |
          rm .github/workflows/rci-stack-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format RCI PR 4 implementation"
          git push origin HEAD:feat/rci-employment-v0-1
