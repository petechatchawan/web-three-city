name: Reconcile Growth lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'agent/building-growth-runtime-v0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-runtime-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reconcile workspace lockfile once
        run: |
          pnpm install --lockfile-only
          rm .github/workflows/reconcile-growth-lockfile.yml
      - name: Commit lockfile and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml .github/workflows/reconcile-growth-lockfile.yml
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git commit -m 'chore: reconcile Growth workspace lockfile'
          git push origin HEAD:agent/building-growth-runtime-v0-1
