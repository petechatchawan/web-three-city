name: Repair Road Lockfile

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-road-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.number == 11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi

          changed_files="$(git diff --name-only)"
          if [[ "$changed_files" != "pnpm-lock.yaml" ]]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$changed_files"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh road workspace lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
