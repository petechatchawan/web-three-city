name: Repository cleanup once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/repository-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete merged and superseded branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete stale branches and verify inventory
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'agent/building-content-occupancy-v0-1'
            'agent/building-content-variety-v0-1'
            'agent/building-growth-core-v0-1'
            'agent/building-growth-runtime-v0-1'
            'agent/zoning-foundation-v0-1'
            'docs/building-growth-variety-v0-1-planning'
            'docs/mit-license'
            'docs/zoning-foundation-v0-1'
            'fix/road-reversible-stroke-preview-isolation'
            'fix/road-world-origin-visibility'
          )

          for branch in "${branches[@]}"; do
            encoded_branch="${branch//\//%2F}"
            if gh api "repos/${REPOSITORY}/git/ref/heads/${encoded_branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded_branch}"
              echo "Deleted ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

          mapfile -t remaining < <(
            gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" \
              --jq '.[].name' | grep -v '^master$' || true
          )

          if (( ${#remaining[@]} > 0 )); then
            printf 'Unexpected non-master branches remain:\n%s\n' "${remaining[*]}" >&2
            exit 1
          fi

          echo 'Repository branch inventory is clean: master only.'
