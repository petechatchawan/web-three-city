name: Road formatting probe

on:
  push:
    branches:
      - agent/road-network-foundation-v0-1

permissions:
  contents: read
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- road-format-probe-task-1 -->'
            echo '### terrain-cell-surface.ts'
            echo '```ts'
            pnpm exec prettier packages/terrain-core/src/terrain-cell-surface.ts
            echo '```'
            echo '### index.ts'
            echo '```ts'
            pnpm exec prettier packages/terrain-core/src/index.ts
            echo '```'
          } > /tmp/road-format-probe.md
          gh pr comment 11 --body-file /tmp/road-format-probe.md
