name: Road formatting probe

on:
  push:
    branches:
      - agent/road-network-foundation-v0-1

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier packages/terrain-core/test/terrain-cell-surface.test.ts
          exit 1
