name: Road Stroke TDD

on:
  pull_request:
    paths:
      - 'apps/game/src/game-input.ts'
      - 'apps/game/src/game-input-road-preview.test.ts'
      - 'apps/game/src/road-stroke-controller.ts'
      - 'apps/game/src/road-stroke-controller.test.ts'
      - 'packages/road-three/src/road-preview-presentation.ts'
      - 'packages/road-three/test/road-preview-presentation.test.ts'
      - 'browser-tests/road-reversible-stroke.spec.ts'
      - '.github/workflows/road-stroke-tdd.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: road-stroke-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/road-reversible-stroke-preview-isolation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format focused implementation
        run: >-
          pnpm exec prettier --write
          apps/game/src/game-input.ts
          apps/game/src/game-input-road-preview.test.ts
          apps/game/src/road-stroke-controller.ts
          apps/game/src/road-stroke-controller.test.ts
          packages/road-three/src/road-preview-presentation.ts
          packages/road-three/test/road-preview-presentation.test.ts
          browser-tests/road-reversible-stroke.spec.ts
          .github/workflows/road-stroke-tdd.yml
      - name: Focused unit verification
        run: >-
          pnpm exec vitest run
          apps/game/src/road-stroke-controller.test.ts
          apps/game/src/game-input-road-preview.test.ts
          packages/road-three/test/road-preview-presentation.test.ts
      - run: pnpm --filter @web-three-city/game typecheck
      - run: pnpm --filter @web-three-city/road-three typecheck
      - run: pnpm build:browser
      - run: pnpm exec playwright install --with-deps chromium
      - name: Focused Chromium verification
        run: >-
          pnpm exec playwright test
          browser-tests/road-reversible-stroke.spec.ts
          --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-reversible-stroke-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Commit verified formatting
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/game/src/game-input.ts \
            apps/game/src/game-input-road-preview.test.ts \
            apps/game/src/road-stroke-controller.ts \
            apps/game/src/road-stroke-controller.test.ts \
            packages/road-three/src/road-preview-presentation.ts \
            packages/road-three/test/road-preview-presentation.test.ts \
            browser-tests/road-reversible-stroke.spec.ts \
            .github/workflows/road-stroke-tdd.yml
          git diff --cached --quiet && exit 0
          git commit -m 'test: verify reversible Road interaction in Chromium'
          git push origin HEAD:fix/road-reversible-stroke-preview-isolation
