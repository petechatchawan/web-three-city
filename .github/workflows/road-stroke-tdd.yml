name: Finalize Road TDD Docs

on:
  pull_request:
    paths:
      - '.github/workflows/road-stroke-tdd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/road-reversible-stroke-preview-isolation
      - name: Mark implementation status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/superpowers/specs/2026-08-02-road-reversible-stroke-preview-isolation-design.md')
          text = path.read_text()
          old = '**Status:** Proposed for owner review  '
          new = '**Status:** Implemented; exact-head verification pending  '
          if old in text:
            text = text.replace(old, new, 1)
          elif new not in text:
            raise SystemExit('design status marker missing')
          path.write_text(text)
          PY
      - name: Commit status update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/specs/2026-08-02-road-reversible-stroke-preview-isolation-design.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: mark Road reversible stroke implemented'
          git push origin HEAD:fix/road-reversible-stroke-preview-isolation
