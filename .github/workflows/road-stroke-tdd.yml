name: Road Stroke TDD

on:
  pull_request:
    paths:
      - 'apps/game/src/road-stroke-controller.ts'
      - 'apps/game/src/road-stroke-controller.test.ts'
      - '.github/workflows/road-stroke-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: road-stroke-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/game/src/road-stroke-controller.test.ts
