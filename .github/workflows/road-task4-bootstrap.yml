name: Road task four bootstrap

on:
  push:
    branches:
      - agent/road-network-foundation-v0-1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/road-network-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/road-core/src/serialization.ts
          packages/road-core/src/index.ts
          packages/road-core/test/serialization.test.ts
          apps/game/src/road-placement-environment.ts
          apps/game/src/road-placement-environment.test.ts
          apps/game/src/world-save.ts
          apps/game/src/world-save.test.ts
          apps/game/package.json
          pnpm-lock.yaml
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml packages/road-core apps/game
          git commit -m "style: finalize Road save foundation"
          git push origin HEAD:agent/road-network-foundation-v0-1
