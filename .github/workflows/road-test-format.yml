name: Road test formatter

on:
  push:
    branches:
      - agent/road-network-foundation-v0-1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/road-network-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/road-core/test/connectivity.test.ts packages/road-core/test/road-mutation.test.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/road-core/test/connectivity.test.ts packages/road-core/test/road-mutation.test.ts
          git commit -m "style: format road mutation contract tests"
          git push origin HEAD:agent/road-network-foundation-v0-1
