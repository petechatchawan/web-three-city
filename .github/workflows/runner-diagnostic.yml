name: Runner diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    name: GitHub-hosted runner availability
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner allocation
        shell: bash
        run: |
          set -euo pipefail
          echo "runner-started"
          uname -a
