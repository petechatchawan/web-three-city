name: Staging check diagnostic

on:
  push:
    branches:
      - fix/mobile-first-figma-fidelity-pr59-v2

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-first-figma-fidelity-pr59-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run check and record exact result
        run: |
          mkdir -p .staging
          set +e
          pnpm check >/tmp/staging-check.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            printf 'PASS\n' > .staging/check-result.txt
          else
            printf 'FAIL exit=%s\n\n' "$code" > .staging/check-result.txt
            tail -n 300 /tmp/staging-check.log >> .staging/check-result.txt
          fi
      - name: Commit diagnostic and self-remove
        run: |
          git rm .github/workflows/staging-check-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .staging/check-result.txt
          git commit -m "ci: record staging check result"
          git push origin HEAD:fix/mobile-first-figma-fidelity-pr59-v2
