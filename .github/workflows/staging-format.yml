name: Staging format

on:
  push:
    branches:
      - fix/mobile-first-figma-fidelity-pr59

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-first-figma-fidelity-pr59
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format RED tests
        run: >-
          pnpm exec prettier --write
          apps/game/src/ui/city-ui-runtime.test.ts
          apps/game/src/ui/dialog/dialog-host.test.ts
          apps/game/src/ui/shell/tool-context-sheet.test.ts
          browser-tests/city-ui-mobile-fidelity.@interaction@smoke.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/ui/city-ui-runtime.test.ts apps/game/src/ui/dialog/dialog-host.test.ts apps/game/src/ui/shell/tool-context-sheet.test.ts browser-tests/city-ui-mobile-fidelity.@interaction@smoke.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format mobile fidelity RED tests"
          git push origin HEAD:fix/mobile-first-figma-fidelity-pr59
