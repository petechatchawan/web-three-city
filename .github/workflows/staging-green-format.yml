name: Staging green format

on:
  push:
    branches:
      - fix/mobile-first-figma-fidelity-pr59-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-first-figma-fidelity-pr59-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Repair connector encoding artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/game/src/ui/city-ui-runtime.ts')
          text = path.read_text()
          text = text.replace("(key: 'grid' | \tzoning' | null)", "(key: 'grid' | 'zoning' | null)")
          text = text.replace("return 'ₑ';", "return '↑';")
          text = text.replace("ports.setInformationView(\tzoning')", "ports.setInformationView('zoning')")
          text = text.replace("createElement('dV')", "createElement('div')")
          path.write_text(text)
          PY
      - name: Format mobile remediation
        run: >-
          pnpm exec prettier --write
          apps/game/src/ui/components/icon.ts
          apps/game/src/ui/shell/bottom-nav.ts
          apps/game/src/ui/shell/game-hud.ts
          apps/game/src/ui/shell/simulation-controls.ts
          apps/game/src/ui/shell/brush-stepper.ts
          apps/game/src/ui/shell/subtool-tray.ts
          apps/game/src/ui/shell/tool-context-sheet.ts
          apps/game/src/ui/shell/player-shell.ts
          apps/game/src/ui/shell/top-actions.ts
          apps/game/src/ui/dialog/dialog-host.ts
          apps/game/src/ui/systems/city-system-dialogs.ts
          apps/game/src/ui/city-ui-runtime.ts
          apps/game/src/ui/city-ui.css
          apps/game/src/ui/foundation/tokens.css
      - name: Commit formatted production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/ui
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format mobile presentation remediation"
          git push origin HEAD:fix/mobile-first-figma-fidelity-pr59-v2
