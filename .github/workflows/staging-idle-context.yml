name: Staging idle context fix

on:
  push:
    branches:
      - fix/mobile-first-figma-fidelity-pr59-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-first-figma-fidelity-pr59-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hide idle Navigate context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ts = Path('apps/game/src/ui/shell/tool-context-sheet.ts')
          text = ts.read_text()
          old = "state.textContent = projection.state;\n      icon.replaceChildren"
          new = "state.textContent = projection.state;\n      element.dataset.toolMode = projection.mode;\n      icon.replaceChildren"
          if old not in text:
              raise SystemExit('tool-context insertion point not found')
          ts.write_text(text.replace(old, new, 1))

          css = Path('apps/game/src/ui/city-ui.css')
          style = css.read_text()
          marker = ".city-tool-context {\n"
          rule = ".city-tool-context[data-tool-mode='navigate'] {\n  display: none;\n}\n\n"
          if rule not in style:
              if marker not in style:
                  raise SystemExit('tool-context css marker not found')
              style = style.replace(marker, rule + marker, 1)
          css.write_text(style)
          PY
      - run: pnpm exec prettier --write apps/game/src/ui/shell/tool-context-sheet.ts apps/game/src/ui/city-ui.css
      - name: Commit and self-remove
        run: |
          git rm .github/workflows/staging-idle-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/ui/shell/tool-context-sheet.ts apps/game/src/ui/city-ui.css
          git commit -m "fix: hide idle navigate context"
          git push origin HEAD:fix/mobile-first-figma-fidelity-pr59-v2
