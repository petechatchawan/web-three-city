name: Task 4 Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture focused diagnostics
        run: |
          mkdir -p diagnostics
          pnpm typecheck > diagnostics/typecheck.log 2>&1 || true
          pnpm --filter @web-three-city/camera-input test -- dom-input-binding.test.ts > diagnostics/unit.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: task4-diagnostics
          path: diagnostics
          if-no-files-found: error
