name: Terraform Docs Format Probe

on:
  push:
    branches:
      - docs/terraform-v1-product-freeze

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/terraform-v1-product-freeze
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format Terraform docs
        run: pnpm exec prettier --write docs/systems/terraform/specs/TERRAFORM-V1-PRODUCT-SPEC.md docs/superpowers/plans/2026-08-31-terraform-v1-implementation.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/systems/terraform/specs/TERRAFORM-V1-PRODUCT-SPEC.md docs/superpowers/plans/2026-08-31-terraform-v1-implementation.md
          git commit -m "style(terraform): format frozen docs"
          git push origin HEAD:docs/terraform-v1-product-freeze
