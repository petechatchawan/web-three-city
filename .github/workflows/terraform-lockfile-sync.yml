name: Terraform Lockfile Sync

on:
  push:
    branches:
      - feat/terraform-v1-core

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/terraform-v1-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(terraform): sync workspace lockfile"
          git push origin HEAD:feat/terraform-v1-core
