name: Terraform TF1 Format

on:
  push:
    branches:
      - feat/terraform-v1-core

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format TF1 files
        run: |
          pnpm exec prettier --write \
            systems/terraform/src/application/plan-terraform.ts \
            systems/terraform/src/domain/flatten-reference.ts \
            systems/terraform/tests/brush-footprint.test.ts \
            systems/terraform/tests/flatten-reference.test.ts \
            systems/terraform/tests/plan-terraform.test.ts \
            systems/terraform/tests/undo-history.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/terraform
          git commit -m "style(terraform): format TF1 core"
          git push
