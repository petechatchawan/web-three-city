name: Terrain Hardening

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/terrain-hardening.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docs/systems/terrain/**"
      - "systems/terrain/**"
      - "systems/world/**"
      - "orchestration/city-session/**"
      - "apps/game/**"
      - "tests/browser/terrain-performance.spec.ts"
      - "tests/browser/terrain-lifecycle-soak.spec.ts"
      - "playwright.config.ts"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/terrain-hardening.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docs/systems/terrain/**"
      - "systems/terrain/**"
      - "systems/world/**"
      - "orchestration/city-session/**"
      - "apps/game/**"
      - "tests/browser/terrain-performance.spec.ts"
      - "tests/browser/terrain-lifecycle-soak.spec.ts"
      - "playwright.config.ts"

permissions:
  contents: read

concurrency:
  group: terrain-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild approved install-script dependency
        run: pnpm rebuild esbuild
      - name: Verify exact HEAD
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Create hardening artifact directory
        run: mkdir -p artifacts/terrain-hardening
      - name: Record Node Terrain performance baseline
        run: |
          set -o pipefail
          pnpm terrain:performance:node 2>&1 | tee artifacts/terrain-hardening/node-performance.txt
      - name: Record browser Terrain performance baseline
        run: |
          set -o pipefail
          pnpm terrain:performance:browser 2>&1 | tee artifacts/terrain-hardening/browser-performance.txt
      - name: Run Terrain lifecycle soak
        run: |
          set -o pipefail
          pnpm terrain:lifecycle:soak 2>&1 | tee artifacts/terrain-hardening/lifecycle-soak.txt
      - name: Verify tracked worktree remains clean
        run: git diff --exit-code
      - name: Upload Terrain hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-hardening-${{ github.sha }}
          path: artifacts/terrain-hardening
          if-no-files-found: error
          retention-days: 30
