name: TF2 Format Runtime Test

on:
  push:
    branches:
      - tmp/terraform-v1-format-runtime-test

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Stop after formatter commit
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = "style(terraform): format runtime regression test" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format Terraform runtime test
        if: steps.guard.outputs.skip != 'true'
        run: pnpm exec prettier --write apps/game/tests/terraform-runtime.test.ts
      - name: Verify formatting diff
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm exec prettier --check apps/game/tests/terraform-runtime.test.ts
          git diff --check
          git diff -- apps/game/tests/terraform-runtime.test.ts
      - name: Commit formatter output
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/game/tests/terraform-runtime.test.ts
          git commit -m 'style(terraform): format runtime regression test'
          git push origin HEAD:tmp/terraform-v1-format-runtime-test
