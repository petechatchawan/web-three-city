name: TF2 Lockfile Generator

on:
  push:
    branches:
      - feat/terraform-v1-live-mutation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Stop after generated dependency commit
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore(terraform): link app runtime dependency" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Add Terraform app dependency and generate lockfile
        if: steps.guard.outputs.skip != 'true'
        run: pnpm --filter @web-three-city/app-game add '@web-three-city/terraform@workspace:*' --lockfile-only --ignore-scripts
      - name: Verify generated diff
        if: steps.guard.outputs.skip != 'true'
        run: |
          git diff --check
          git diff -- apps/game/package.json pnpm-lock.yaml
      - name: Commit generated package metadata
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/game/package.json pnpm-lock.yaml
          git commit -m 'chore(terraform): link app runtime dependency'
          git push origin HEAD:feat/terraform-v1-live-mutation
