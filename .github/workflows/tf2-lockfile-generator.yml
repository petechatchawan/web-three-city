name: TF2 Lockfile Generator

on:
  push:
    branches:
      - feat/terraform-v1-live-mutation

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message != 'chore(terraform): link app runtime dependency'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Add Terraform app dependency
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/game/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies = {
            '@web-three-city/orchestration-city-session': pkg.dependencies['@web-three-city/orchestration-city-session'],
            '@web-three-city/terraform': 'workspace:*',
            '@web-three-city/terrain': pkg.dependencies['@web-three-city/terrain'],
            '@web-three-city/world': pkg.dependencies['@web-three-city/world'],
            three: pkg.dependencies.three,
          };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Generate lockfile with repository pnpm
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify generated diff
        run: |
          git diff --check
          git diff -- apps/game/package.json pnpm-lock.yaml
      - name: Commit generated package metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/game/package.json pnpm-lock.yaml
          git commit -m 'chore(terraform): link app runtime dependency'
          git push origin HEAD:feat/terraform-v1-live-mutation
