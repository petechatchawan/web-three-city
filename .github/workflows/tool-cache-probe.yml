name: Tool Cache Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  tool-cache-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage locked Prettier package
        run: |
          mkdir -p .tool-cache
          cp -LR node_modules/prettier .tool-cache/prettier
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-3.9.6
          path: .tool-cache/prettier
          if-no-files-found: error
