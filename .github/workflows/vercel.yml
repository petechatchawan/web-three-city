name: Vercel deployments

on:
  push:
    branches:
      - master
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request_target:
    branches:
      - master
    types:
      - labeled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Deploy gated Preview
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'
      ) || (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'preview-ready'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: vercel-preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Resolve exact-head successful CI
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          LABELED_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          echo "deploy=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            pr_number="$RUN_PR_NUMBER"
            ci_run_id="$RUN_ID"
            ci_head_sha="$RUN_HEAD_SHA"
          else
            pr_number="$LABELED_PR_NUMBER"
            ci_run_id=""
            ci_head_sha=""
          fi

          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with this event."
            exit 0
          fi

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          state="$(jq -r '.state' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"

          if [[ "$state" != "open" ]]; then
            echo "PR #$pr_number is not open."
            exit 0
          fi

          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR #$pr_number is not a same-repository pull request."
            exit 0
          fi

          if ! jq -e '.labels | any(.name == "preview-ready")' <<< "$pr_json" >/dev/null; then
            echo "PR #$pr_number does not have the preview-ready label."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$ci_head_sha" != "$head_sha" ]]; then
              echo "CI head $ci_head_sha is stale; current PR head is $head_sha."
              exit 0
            fi
          else
            runs_json="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=100"
            )"
            ci_run_id="$(
              jq -r --arg sha "$head_sha" \
                '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty' \
                <<< "$runs_json"
            )"
            ci_head_sha="$head_sha"
          fi

          if [[ -z "$ci_run_id" ]]; then
            echo "No successful exact-head CI run exists yet for $head_sha."
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted deployment tooling
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Set up pnpm
        if: steps.gate.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download verified pull-request build
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-app-builds
          path: pull-request-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.gate.outputs.ci_run_id }}

      - name: Verify Vercel token
        if: steps.gate.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Missing required repository secret: VERCEL_TOKEN"
            exit 1
          fi

      - name: Bootstrap protected Vercel project
        if: steps.gate.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node tooling/bootstrap-vercel-project.mjs --project web-three-city

      - name: Compose Vercel Build Output API
        if: steps.gate.outputs.deploy == 'true'
        run: >-
          node tooling/compose-vercel-output.mjs
          --game pull-request-build/game/dist
          --terrain-lab pull-request-build/terrain-lab/dist
          --output .vercel/output

      - name: Deploy protected Preview
        if: steps.gate.outputs.deploy == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            pnpm dlx vercel@58.0.0 deploy \
              --prebuilt \
              --yes \
              --token="$VERCEL_TOKEN"
          )"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Vercel CLI did not return a deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Publish Preview link and consume label
        if: steps.gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          SOURCE_SHA: ${{ steps.gate.outputs.source_sha }}
          CI_RUN_ID: ${{ steps.gate.outputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- web-three-city-vercel-preview -->'
          game_url="${DEPLOYMENT_URL%/}/"
          terrain_lab_url="${DEPLOYMENT_URL%/}/terrain-lab/"
          short_sha="${SOURCE_SHA:0:12}"
          body="$(cat <<EOF
          $marker
          ## Protected Vercel Preview ready

          - Game: $game_url
          - Terrain Lab: $terrain_lab_url
          - Source: \`$short_sha\`
          - Exact-head CI run: \`$CI_RUN_ID\`

          Sign in to Vercel with the project owner account to open this Preview. Apply \`preview-ready\` again only when another owner-review deployment is required.
          EOF
          )"

          comment_id="$(
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
              | jq -r --arg marker "$marker" '.[] | select(.body | contains($marker)) | .id' \
              | head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" >/dev/null
          fi

          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/preview-ready" >/dev/null

          {
            echo "## Protected Vercel Preview"
            echo
            echo "- Game: $game_url"
            echo "- Terrain Lab: $terrain_lab_url"
            echo "- Source: \`$short_sha\`"
            echo "- CI run: \`$CI_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy Production
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: vercel-production
      cancel-in-progress: false

    steps:
      - name: Checkout trusted master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:deployment

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Missing required repository secret: VERCEL_TOKEN"
            exit 1
          fi

      - name: Bootstrap protected Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node tooling/bootstrap-vercel-project.mjs --project web-three-city

      - run: pnpm compose:vercel

      - name: Ensure Preview gate label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"name":"preview-ready","color":"1f6feb","description":"Deploy the exact green PR head to protected Vercel Preview once"}'
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/labels"
          )"
          if [[ "$status" == "201" ]]; then
            echo "Created preview-ready label."
          elif [[ "$status" == "422" ]] && jq -e '.errors | any(.code == "already_exists")' "$response_file" >/dev/null; then
            echo "preview-ready label already exists."
          else
            cat "$response_file"
            echo "::error::Unable to ensure preview-ready label; GitHub returned HTTP $status."
            exit 1
          fi

      - name: Deploy public Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            pnpm dlx vercel@58.0.0 deploy \
              --prebuilt \
              --prod \
              --yes \
              --token="$VERCEL_TOKEN"
          )"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Vercel CLI did not return a deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Record Production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          game_url="${DEPLOYMENT_URL%/}/"
          terrain_lab_url="${DEPLOYMENT_URL%/}/terrain-lab/"
          {
            echo "## Public Vercel Production"
            echo
            echo "- Game: $game_url"
            echo "- Terrain Lab: $terrain_lab_url"
            echo "- Source: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
