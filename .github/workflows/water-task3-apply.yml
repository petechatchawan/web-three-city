name: Apply verified Water Task 3

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply verified Task 3 files
        env:
          TASK3_PAYLOAD: 
        run: |
          printf '%s' "$TASK3_PAYLOAD" | base64 --decode | tar -xzf -
      - name: Verify Task 3
        run: |
          pnpm --filter @web-three-city/water-core test -- water-chunk-mesher.test.ts water-wall-mesher.test.ts
          pnpm --filter @web-three-city/water-core typecheck
          pnpm exec prettier --check packages/water-core
          pnpm exec eslint packages/water-core
      - name: Commit Task 3 when changed
        run: |
          if git diff --quiet -- packages/water-core; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/water-core
          git commit -m "feat(water): build shoreline and Water meshes"
          git push origin HEAD:${{ github.head_ref }}
