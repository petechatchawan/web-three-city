name: Apply verified Water Task 4 GREEN

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  green:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Decode verified Task 4 source
        env:
          TASK4_GREEN: 
        run: |
          printf '%s' "$TASK4_GREEN" | base64 --decode | tar -xzf -
      - name: Normalize Water Three source
        run: pnpm exec prettier --write packages/water-three/src
      - name: Run Task 4 tests
        working-directory: packages/water-three
        run: pnpm exec vitest run
      - name: Run Water Three strict typecheck
        run: pnpm exec tsc -p packages/water-three/tsconfig.json --noEmit
      - name: Run Water Three lint
        run: pnpm exec eslint packages/water-three
      - name: Commit Task 4 GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/water-three/src
          git commit -m "feat(water): add atomic Three.js Water presentation"
          git push origin HEAD:${{ github.head_ref }}
