name: Stage Water Task 4 RED

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  red:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode Task 4 RED package and tests
        env:
          TASK4_RED: 
        run: |
          printf '%s' "$TASK4_RED" | base64 --decode | tar -xzf -
      - name: Update workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Normalize RED files
        run: pnpm exec prettier --write packages/water-three
      - name: Commit Task 4 RED
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/water-three pnpm-lock.yaml
          git commit -m "test(water): define Three.js Water presentation contract"
          git push origin HEAD:${{ github.head_ref }}
