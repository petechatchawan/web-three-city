name: Apply verified Water Task 5 GREEN

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  green:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode verified Terrain Lab integration
        env:
          PACKAGE_JSON: 
          FIXTURE_REGISTRY: 
          BOOTSTRAP: 
        run: |
          decode_file() {
            printf '%s' "$1" | base64 --decode | gzip --decompress > "$2"
          }
          decode_file "$PACKAGE_JSON" apps/terrain-lab/package.json
          decode_file "$FIXTURE_REGISTRY" apps/terrain-lab/src/fixture-registry.ts
          decode_file "$BOOTSTRAP" apps/terrain-lab/src/bootstrap.ts
      - name: Update workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize Terrain Lab files
        run: pnpm exec prettier --write apps/terrain-lab
      - name: Run Terrain Lab strict typecheck
        run: pnpm exec tsc -p apps/terrain-lab/tsconfig.json --noEmit
      - name: Run Terrain Lab lint
        run: pnpm exec eslint apps/terrain-lab browser-tests/terrain-lab.spec.ts
      - name: Build Terrain Lab
        working-directory: apps/terrain-lab
        run: pnpm exec vite build
      - name: Commit Task 5 GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/terrain-lab pnpm-lock.yaml
          git commit -m "feat(water): add Terrain Lab Water fixtures"
          git push origin HEAD:${{ github.head_ref }}
