name: Diagnose Water Task 6 Chromium

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode Task 6 source
        env:
          TASK6_GREEN: 
        run: |
          printf '%s' "$TASK6_GREEN" | base64 --decode | tar -xzf -
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @web-three-city/game build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run and print focused Chromium failure
        run: |
          set +e
          pnpm exec playwright test browser-tests/game.spec.ts browser-tests/interaction.spec.ts --project=chromium > /tmp/task6-browser.log 2>&1
          status=$?
          tail -n 260 /tmp/task6-browser.log
          exit $status
