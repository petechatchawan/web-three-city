name: Apply verified Water Task 6 GREEN v2

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  green:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode verified Task 6 files
        env:
          TASK6_GREEN: 
        run: printf '%s' "$TASK6_GREEN" | base64 --decode | tar -xzf -
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/game browser-tests/interaction.spec.ts
      - run: pnpm --filter @web-three-city/game typecheck
      - run: pnpm exec eslint apps/game browser-tests/interaction.spec.ts
      - run: pnpm --filter @web-three-city/game build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run focused Game Chromium acceptance
        run: pnpm exec playwright test browser-tests/game.spec.ts browser-tests/interaction.spec.ts --project=chromium
      - name: Commit Task 6 GREEN
        run: |
          if git diff --quiet -- apps/game browser-tests/interaction.spec.ts pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game browser-tests/interaction.spec.ts pnpm-lock.yaml
          git commit -m "feat(water): integrate Water into Game lifecycle"
          git push origin HEAD:${{ github.head_ref }}
