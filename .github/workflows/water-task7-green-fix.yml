name: Verify corrected Water Task 7 GREEN

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  green:
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode corrected helper and Task 7 evidence files
        env:
          HELPER: 
        run: |
          manifest=.github/workflows/water-task7-green.yml
          payload() { sed -n "s/^          $1: //p" "$manifest"; }
          printf '%s' "$HELPER" | base64 --decode | gzip --decompress > browser-tests/helpers/interaction.ts
          { payload VISUAL_1; payload VISUAL_2; payload VISUAL_3; } | tr -d '\n' | base64 --decode | gzip --decompress > browser-tests/visual-evidence.spec.ts
          { payload DOC_1; payload DOC_2; } | tr -d '\n' | base64 --decode | gzip --decompress > docs/evidence/water-shoreline-foundation-v0-1.md
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write browser-tests docs/evidence/water-shoreline-foundation-v0-1.md
      - run: pnpm exec eslint browser-tests
      - run: pnpm --filter @web-three-city/terrain-lab build
      - run: pnpm --filter @web-three-city/game build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Water acceptance and evidence suite
        run: pnpm exec playwright test browser-tests/water.spec.ts browser-tests/visual-evidence.spec.ts --project=chromium --trace=on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-shoreline-foundation-v0-1-evidence-corrected
          path: |
            test-results
            playwright-report
          if-no-files-found: error
      - name: Commit Task 7 GREEN
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-tests docs/evidence/water-shoreline-foundation-v0-1.md
          git commit -m "test(water): add browser acceptance and evidence"
          git push origin HEAD:${{ github.head_ref }}
