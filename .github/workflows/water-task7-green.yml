name: Apply verified Water Task 7 GREEN

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  green:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode verified Task 7 files
        env:
          HELPER_1: 
          HELPER_2: 
          VISUAL_1: 
          VISUAL_2: 
          VISUAL_3: 
          DOC_1: 
          DOC_2: iA0hW1x3OEIfAdd4D1wtCSHM8DfyPg+gZAsAAA==
        run: |
          decode() { printf '%s' "$1" | base64 --decode | gzip --decompress > "$2"; }
          printf '%s%s' "$HELPER_1" "$HELPER_2" | base64 --decode | gzip --decompress > browser-tests/helpers/interaction.ts
          printf '%s%s%s' "$VISUAL_1" "$VISUAL_2" "$VISUAL_3" | base64 --decode | gzip --decompress > browser-tests/visual-evidence.spec.ts
          printf '%s%s' "$DOC_1" "$DOC_2" | base64 --decode | gzip --decompress > docs/evidence/water-shoreline-foundation-v0-1.md
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write browser-tests docs/evidence/water-shoreline-foundation-v0-1.md
      - run: pnpm exec eslint browser-tests
      - run: pnpm --filter @web-three-city/terrain-lab build
      - run: pnpm --filter @web-three-city/game build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Water acceptance and evidence suite
        run: pnpm exec playwright test browser-tests/water.spec.ts browser-tests/visual-evidence.spec.ts --project=chromium --trace=on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-shoreline-foundation-v0-1-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: error
      - name: Commit Task 7 GREEN
        if: success()
        run: |
          if git diff --quiet -- browser-tests docs/evidence/water-shoreline-foundation-v0-1.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-tests docs/evidence/water-shoreline-foundation-v0-1.md
          git commit -m "test(water): add browser acceptance and evidence"
          git push origin HEAD:${{ github.head_ref }}
