name: Water Task 8 final audit

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused Water coverage
        run: |
          pnpm --filter @web-three-city/water-core test:coverage
          pnpm --filter @web-three-city/water-three test:coverage
      - name: Focused Water strict typecheck
        run: |
          pnpm --filter @web-three-city/water-core typecheck
          pnpm --filter @web-three-city/water-three typecheck
      - name: Application production builds
        run: |
          pnpm --filter @web-three-city/terrain-lab build
          pnpm --filter @web-three-city/game build
      - name: Enforce Water core purity
        run: |
          if rg -n "from ['\"]three['\"]|document\.|window\." packages/water-core --glob '*.ts'; then
            echo 'water-core must remain pure TypeScript without Three.js or DOM globals.' >&2
            exit 1
          fi
      - name: Enforce Terrain independence
        run: |
          if rg -n "Water|water" packages/terrain-core/src packages/terrain-generator/src --glob '*.ts'; then
            echo 'Terrain authority must not depend on Water.' >&2
            exit 1
          fi
      - name: Enforce unchanged save ownership
        run: |
          if rg -n "TerrainSaveV2|WaterSave|water.*localStorage|localStorage.*water" apps packages --glob '*.ts'; then
            echo 'Water must remain derived and absent from persistence.' >&2
            exit 1
          fi
      - name: Enforce deferred-scope exclusions
        run: |
          if rg -n "chunkSignature|dirtyWater|reflection|refraction|buoyancy|WebGPU" \
            packages/water-core/src packages/water-three/src apps/game/src apps/terrain-lab/src \
            --glob '*.ts'; then
            echo 'Deferred Water systems entered v0.1 production scope.' >&2
            exit 1
          fi
      - name: Record exact audit evidence
        run: |
          mkdir -p water-task8-audit
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "water_core_coverage=pass"
            echo "water_three_coverage=pass"
            echo "water_typecheck=pass"
            echo "application_builds=pass"
            echo "water_core_purity=pass"
            echo "terrain_independence=pass"
            echo "save_ownership=pass"
            echo "deferred_scope=pass"
          } > water-task8-audit/audit.txt
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: water-task8-final-audit
          path: water-task8-audit
          if-no-files-found: error
