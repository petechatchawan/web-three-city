name: Water workspace snapshot

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Pack workspace and frozen dependencies
        run: |
          tar \
            --exclude=.git \
            --exclude='./packages/*/dist' \
            --exclude='./apps/*/dist' \
            --exclude='./packages/*/coverage' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            -czf /tmp/web-three-city-water-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: water-workspace-snapshot-complete
          path: /tmp/web-three-city-water-workspace.tgz
          if-no-files-found: error
