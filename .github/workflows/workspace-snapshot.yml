name: Workspace Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: branch-workspace
          path: |
            .
            !.git
            !node_modules
            !**/node_modules
            !coverage
            !**/coverage
            !dist
            !**/dist
            !playwright-report
            !test-results
          include-hidden-files: true
          if-no-files-found: error
