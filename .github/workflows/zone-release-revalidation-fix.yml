name: Zone Release Revalidation Fix

on:
  push:
    branches:
      - agent/building-growth-runtime-v0-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/building-growth-runtime-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/apply-zone-release-revalidation-fix.mjs
      - run: pnpm exec prettier --write apps/game/src/game-bootstrap.ts
      - run: pnpm --filter @web-three-city/game test
      - run: pnpm --filter @web-three-city/game typecheck
      - run: pnpm typecheck:browser
      - name: Commit verified fix and remove executor
        run: |
          rm -f tooling/apply-zone-release-revalidation-fix.mjs
          rm -f .github/workflows/zone-release-revalidation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: revalidate Zone transactions after background Growth"
          git push origin HEAD:agent/building-growth-runtime-v0-1
