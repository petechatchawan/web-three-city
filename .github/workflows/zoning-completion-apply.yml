name: Zoning completion apply

on:
  push:
    branches:
      - agent/zoning-foundation-v0-1

permissions:
  contents: write

concurrency:
  group: zoning-completion-apply
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[zoning-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
          fetch-depth: 0
      - name: Apply completion patch
        run: |
          test -f tooling/zoning-completion.patch.gz.b64 || exit 0
          base64 --decode tooling/zoning-completion.patch.gz.b64 | gzip --decompress > /tmp/zoning-completion.patch
          echo "107b6b5ab166cb88f8e086832cba60e2061e312c279fa7e996a4f1321b1ec583  /tmp/zoning-completion.patch" | sha256sum --check
          git apply --index /tmp/zoning-completion.patch
          rm tooling/zoning-completion.patch.gz.b64
          rm .github/workflows/zoning-completion-apply.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: complete Zoning Foundation v0.1 [zoning-complete]"
          git push origin HEAD:agent/zoning-foundation-v0-1
