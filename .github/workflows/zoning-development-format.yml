name: Zoning development formatter

on:
  push:
    branches:
      - agent/zoning-foundation-v0-1

permissions:
  contents: write

jobs:
  format-zoning-work:
    if: ${{ !contains(github.event.head_commit.message, '[zoning-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format active Zoning scope
        run: |
          targets=(packages/zone-core apps/game/src browser-tests)
          if [ -d packages/zone-three ]; then
            targets+=(packages/zone-three)
          fi
          pnpm exec prettier --write "${targets[@]}"
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/zone-core packages/zone-three apps/game/src browser-tests 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format active Zoning scope [zoning-format]"
          git push origin HEAD:agent/zoning-foundation-v0-1
