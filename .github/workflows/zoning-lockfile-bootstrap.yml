name: Zoning lockfile bootstrap

on:
  push:
    branches:
      - agent/zoning-foundation-v0-1

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[zoning-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Zone workspace lockfile [zoning-bootstrap]"
          git push origin HEAD:agent/zoning-foundation-v0-1
      - name: Run focused Zone RED tests
        run: pnpm --filter @web-three-city/zone-core test
