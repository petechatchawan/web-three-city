name: Zoning Task 5 bootstrap

on:
  push:
    branches:
      - agent/zoning-foundation-v0-1

permissions:
  contents: write

jobs:
  bootstrap-game-tests:
    if: ${{ !contains(github.event.head_commit.message, '[zoning-task5-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write apps/game/package.json apps/game/vitest.config.ts apps/game/src/reversible-cell-trace.test.ts apps/game/src/zone-stroke-controller.test.ts
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml apps/game
          git commit -m "chore: bootstrap Zone Game tests [zoning-task5-bootstrap]"
          git push origin HEAD:agent/zoning-foundation-v0-1
