name: Zoning Task 5 formatter

on:
  push:
    branches:
      - agent/zoning-foundation-v0-1

permissions:
  contents: write

jobs:
  format-zone-strokes:
    if: ${{ !contains(github.event.head_commit.message, '[zoning-task5-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/game/src/reversible-cell-trace.ts apps/game/src/road-stroke-controller.ts apps/game/src/game-tool-mode.ts apps/game/src/zone-stroke-controller.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src
          git commit -m "style: format Zone stroke implementation [zoning-task5-format]"
          git push origin HEAD:agent/zoning-foundation-v0-1
