name: Zoning Task 6 RED formatter

on:
  push:
    branches:
      - agent/zoning-foundation-v0-1

permissions:
  contents: write

jobs:
  format-task6-tests:
    if: ${{ !contains(github.event.head_commit.message, '[zoning-task6-red-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/game/src/zone-placement-environment.test.ts apps/game/src/terraform-occupancy-guard.test.ts apps/game/src/road-zone-guard.test.ts
      - name: Commit canonical tests
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src
          git commit -m "style: format Zone Task 6 RED tests [zoning-task6-red-format]"
          git push origin HEAD:agent/zoning-foundation-v0-1
