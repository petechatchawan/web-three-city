name: Zoning Task 7 integration migration

on:
  push:
    branches:
      - agent/zoning-foundation-v0-1

permissions:
  contents: write

jobs:
  wire-zone-tools:
    if: ${{ !contains(github.event.head_commit.message, '[zoning-task7-integration]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Zone ownership edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/game/src/game-input.ts')
          text = path.read_text()
          old = "import { isRoadToolMode, isTerraformToolMode, type GameToolMode } from './game-tool-mode.js';"
          new = "import {\n  isRoadToolMode,\n  isTerraformToolMode,\n  isZoneToolMode,\n  type GameToolMode,\n} from './game-tool-mode.js';"
          assert old in text
          text = text.replace(old, new, 1)
          old = "        value !== 'road-build' &&\n        value !== 'road-bulldoze'"
          new = "        value !== 'road-build' &&\n        value !== 'road-bulldoze' &&\n        value !== 'zone-residential' &&\n        value !== 'zone-commercial' &&\n        value !== 'zone-industrial' &&\n        value !== 'zone-remove'"
          assert old in text
          text = text.replace(old, new, 1)
          old = "        mode: isRoadToolMode(mode) ? 'navigate' : mode,"
          new = "        mode: isRoadToolMode(mode) || isZoneToolMode(mode) ? 'navigate' : mode,"
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('apps/game/src/main.ts')
          text = path.read_text()
          old = "  'road-build': 'tool-road-build',\n  'road-bulldoze': 'tool-road-bulldoze',"
          new = "  'road-build': 'tool-road-build',\n  'road-bulldoze': 'tool-road-bulldoze',\n  'zone-residential': 'tool-zone-residential',\n  'zone-commercial': 'tool-zone-commercial',\n  'zone-industrial': 'tool-zone-industrial',\n  'zone-remove': 'tool-zone-remove',"
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('apps/game/src/game-reason-catalog.test.ts')
          text = path.read_text()
          old = "  'road:invalid-ramp-topology': 'Invalid Road ramp topology',\n} satisfies Readonly<Record<GameOperationReason, string>>;"
          new = "  'road:invalid-ramp-topology': 'Invalid Road ramp topology',\n  'road:zone-occupied': 'Road overlaps Zone',\n  'road:zone-access-lost': 'Road required by Zone',\n  'terraform:zone-occupied': 'Terraform blocked by Zone',\n  'zone:invalid-state': 'Invalid Zone state',\n  'zone:invalid-environment': 'Invalid Zone environment',\n  'zone:invalid-cell': 'Invalid Zone cell',\n  'zone:unknown-definition': 'Unknown Zone definition',\n  'zone:no-change': 'No Zone change',\n  'zone:unsupported-terrain': 'Unsupported Zone terrain',\n  'zone:wet-cell': 'Wet Zone cell',\n  'zone:road-occupied': 'Zone overlaps Road',\n  'zone:occupied': 'Zone cell occupied',\n  'zone:zone-conflict': 'Zone type conflict',\n  'zone:road-access-required': 'Zone Road access required',\n} satisfies Readonly<Record<GameOperationReason, string>>;"
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/game/src/game-input.ts apps/game/src/main.ts apps/game/src/game-reason-catalog.test.ts
      - name: Commit integration wiring
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src
          git commit -m "feat: wire Zone tool ownership [zoning-task7-integration]"
          git push origin HEAD:agent/zoning-foundation-v0-1
