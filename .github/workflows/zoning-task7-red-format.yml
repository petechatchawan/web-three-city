name: Zoning Task 7 RED formatter

on:
  push:
    branches:
      - agent/zoning-foundation-v0-1

permissions:
  contents: write

jobs:
  format-task7-test:
    if: ${{ !contains(github.event.head_commit.message, '[zoning-task7-red-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/game/src/zoning-tool-ui.test.ts
      - name: Commit canonical test
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src/zoning-tool-ui.test.ts
          git commit -m "style: format Zone Task 7 RED test [zoning-task7-red-format]"
          git push origin HEAD:agent/zoning-foundation-v0-1
