name: Zoning tool mode formatter

on:
  push:
    branches:
      - agent/zoning-foundation-v0-1

permissions:
  contents: write

jobs:
  format-tool-mode:
    if: ${{ !contains(github.event.head_commit.message, '[zone-tool-mode-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/game/src/game-tool-mode.ts
      - name: Commit canonical output
        run: |
          if git diff --quiet -- apps/game/src/game-tool-mode.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game/src/game-tool-mode.ts
          git commit -m "style: format Zone tool mode [zone-tool-mode-format]"
          git push origin HEAD:agent/zoning-foundation-v0-1
