name: Zoning workspace export

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-workspace:
    if: github.head_ref == 'agent/zoning-foundation-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zoning-foundation-v0-1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack workspace
        run: tar -czf /tmp/zoning-workspace.tgz --exclude='./.git/objects/pack/*.pack' .
      - uses: actions/upload-artifact@v4
        with:
          name: zoning-workspace
          path: /tmp/zoning-workspace.tgz
          if-no-files-found: error
          retention-days: 1
