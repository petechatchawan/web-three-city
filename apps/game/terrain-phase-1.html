<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain Phase 1 Presentation Harness</title>
    <style>
      html,
      body,
      #terrain-phase-1 {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #terrain-phase-1 {
        position: relative;
        overflow: hidden;
      }

      #terrain-viewport {
        width: 100%;
        height: 100%;
      }

      .diagnostic-panel {
        position: absolute;
        inset: 1rem auto auto 1rem;
        z-index: 1;
        display: grid;
        gap: 0.5rem;
        padding: 0.75rem;
        color: #e5e7eb;
        background: rgb(17 24 39 / 88%);
        border: 1px solid rgb(148 163 184 / 30%);
        border-radius: 0.5rem;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }

      .diagnostic-panel label {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <main id="terrain-phase-1" data-presentation="booting">
      <section
        id="terrain-viewport"
        aria-label="Terrain presentation viewport"
      ></section>
      <aside class="diagnostic-panel" aria-label="Terrain debug controls">
        <button type="button" data-testid="terrain-rebuild">
          Rebuild terrain
        </button>
        <label
          ><input type="checkbox" data-testid="debug-cellGrid" /> Gameplay
          grid</label
        >
        <label
          ><input type="checkbox" data-testid="debug-renderSectors" /> Render
          sectors</label
        >
        <label
          ><input type="checkbox" data-testid="debug-vertices" />
          Vertices</label
        >
        <label
          ><input type="checkbox" data-testid="debug-triangles" />
          Triangles</label
        >
        <label
          ><input type="checkbox" data-testid="debug-normals" /> Normals</label
        >
        <label
          ><input type="checkbox" data-testid="debug-elevation" />
          Elevation</label
        >
      </aside>
    </main>
    <script type="module" src="/tests/terrain-phase-1-harness.ts"></script>
  </body>
</html>
