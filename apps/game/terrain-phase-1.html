<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain Phase 1 Presentation Harness</title>
    <style>
      html,
      body,
      #terrain-phase-1 {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #terrain-phase-1 {
        position: relative;
        overflow: hidden;
      }

      #terrain-viewport {
        width: 100%;
        height: 100%;
      }

      [data-testid="terrain-rebuild"] {
        position: absolute;
        inset: 1rem auto auto 1rem;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <main id="terrain-phase-1" data-presentation="booting">
      <section
        id="terrain-viewport"
        aria-label="Terrain presentation viewport"
      ></section>
      <button type="button" data-testid="terrain-rebuild">
        Rebuild terrain
      </button>
    </main>
    <script type="module" src="/tests/terrain-phase-1-harness.ts"></script>
  </body>
</html>
